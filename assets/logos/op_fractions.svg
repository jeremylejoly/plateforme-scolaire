<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="retro-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A2E" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FFF8" />
      <stop offset="60%" stop-color="#E2F5EE" />
      <stop offset="100%" stop-color="#BFEBD8" />
    </linearGradient>
  </defs>
  <!-- Carte de fond -->
  <rect x="25" y="25" width="350" height="350" rx="60" fill="url(#bg-grad)" stroke="#1A1A2E" stroke-width="10" filter="url(#retro-shadow)" />
  <!-- Pizza du haut : 1/2 -->
  <g stroke="#1A1A2E" stroke-width="7" stroke-linejoin="round">
    <circle cx="112" cy="125" r="50" fill="#FFFFFF" />
    <path d="M112 75 A50 50 0 0 0 112 175 Z" fill="#5B4FCF" />
    <line x1="112" y1="75" x2="112" y2="175" />
    <!-- Pizza du haut droite : 1/4 -->
    <circle cx="288" cy="125" r="50" fill="#FFFFFF" />
    <path d="M288 125 L288 75 A50 50 0 0 1 338 125 Z" fill="#2EC27E" />
    <line x1="288" y1="75" x2="288" y2="175" />
    <line x1="238" y1="125" x2="338" y2="125" />
  </g>
  <!-- Signe + -->
  <g stroke="#5B4FCF" stroke-width="14" stroke-linecap="round">
    <line x1="200" y1="108" x2="200" y2="142" />
    <line x1="183" y1="125" x2="217" y2="125" />
  </g>
  <!-- Écriture : 1/2 + 1/4 -->
  <g font-family="Arial Rounded MT Bold, Nunito, Arial, sans-serif" font-weight="900" font-size="52" fill="#1A1A2E" text-anchor="middle">
    <text x="120" y="262">1</text>
    <text x="120" y="335">2</text>
    <text x="280" y="262">1</text>
    <text x="280" y="335">4</text>
  </g>
  <g stroke="#1A1A2E" stroke-width="7" stroke-linecap="round">
    <line x1="92" y1="282" x2="148" y2="282" />
    <line x1="252" y1="282" x2="308" y2="282" />
  </g>
  <g stroke="#5B4FCF" stroke-width="12" stroke-linecap="round">
    <line x1="200" y1="262" x2="200" y2="302" />
    <line x1="180" y1="282" x2="220" y2="282" />
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
