<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Ombre portée 3D rétro (même style que les logos des jeux) -->
    <filter id="retro-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A2E" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF3FF" />
      <stop offset="60%" stop-color="#DCE6FD" />
      <stop offset="100%" stop-color="#C3D3FA" />
    </linearGradient>
    <radialGradient id="lens-grad" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97" />
      <stop offset="75%" stop-color="#F1F7FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BFD7FB" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F7C948" />
      <stop offset="100%" stop-color="#E0A21B" />
    </linearGradient>
    <linearGradient id="handle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5BDB" />
      <stop offset="100%" stop-color="#1C2752" />
    </linearGradient>
    <clipPath id="lens-clip"><circle cx="190" cy="185" r="78" /></clipPath>
  </defs>

  <!-- CARTE DE FOND -->
  <rect x="25" y="25" width="350" height="350" rx="44" fill="url(#bg-grad)" stroke="#1A1A2E" stroke-width="8" filter="url(#retro-shadow)" />

  <!-- Points de fond (comme la page de l'exercice) -->
  <g fill="#1C2752" opacity="0.13">
    <circle cx="70" cy="70" r="4"/><circle cx="110" cy="70" r="4"/><circle cx="70" cy="110" r="4"/>
    <circle cx="330" cy="330" r="4"/><circle cx="290" cy="330" r="4"/><circle cx="330" cy="290" r="4"/>
  </g>

  <!-- Étincelles -->
  <path d="M 322 72 Q 322 88 306 88 Q 322 88 322 104 Q 322 88 338 88 Q 322 88 322 72 Z" fill="#F7C948" stroke="#1A1A2E" stroke-width="2.5" />
  <path d="M 72 300 Q 72 312 60 312 Q 72 312 72 324 Q 72 312 84 312 Q 72 312 72 300 Z" fill="#46AD99" stroke="#1A1A2E" stroke-width="2.5" />

  <!-- ============ LA LOUPE ============ -->
  <g>
    <!-- Manche -->
    <path d="M 248 246 L 322 320 C 330 328, 330 340, 322 348 C 314 356, 302 356, 294 348 L 220 274 Z" fill="url(#handle-grad)" stroke="#1A1A2E" stroke-width="7" stroke-linejoin="round" />
    <rect x="226" y="252" width="26" height="14" rx="3" transform="rotate(45, 239, 259)" fill="url(#gold-grad)" stroke="#1A1A2E" stroke-width="4" />

    <!-- Verre -->
    <circle cx="190" cy="185" r="78" fill="url(#lens-grad)" />

    <!-- Contenu grossi : la terminaison « ées » -->
    <g clip-path="url(#lens-clip)">
      <!-- lignes de texte floues derrière -->
      <rect x="112" y="122" width="90" height="10" rx="5" fill="#9FB4E8" opacity="0.6"/>
      <rect x="210" y="122" width="50" height="10" rx="5" fill="#9FB4E8" opacity="0.6"/>
      <rect x="112" y="240" width="60" height="10" rx="5" fill="#9FB4E8" opacity="0.6"/>
      <rect x="180" y="240" width="80" height="10" rx="5" fill="#9FB4E8" opacity="0.6"/>
      <!-- surlignage vert de la bonne terminaison -->
      <rect x="166" y="152" width="96" height="66" rx="14" fill="#C9EED3" />
      <text x="190" y="209" text-anchor="middle" font-family="'Arial Rounded MT Bold','Nunito','DM Sans',Arial,sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
        <tspan fill="#1C2752">é</tspan><tspan fill="#2E8B4A">es</tspan>
      </text>
    </g>

    <!-- Cerclage -->
    <circle cx="190" cy="185" r="78" fill="none" stroke="#1A1A2E" stroke-width="20" />
    <circle cx="190" cy="185" r="78" fill="none" stroke="url(#gold-grad)" stroke-width="12" />

    <!-- Reflet -->
    <path d="M 140 145 C 152 126, 180 118, 206 121" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- ============ ÉTIQUETTE « CDV » ============ -->
  <g transform="rotate(-10, 105, 90)">
    <rect x="52" y="64" width="112" height="50" rx="14" fill="#F7DC5C" stroke="#1A1A2E" stroke-width="6" />
    <text x="108" y="100" text-anchor="middle" font-family="'Arial Rounded MT Bold','Nunito','DM Sans',Arial,sans-serif" font-weight="900" font-size="31" fill="#1C2752">CDV</text>
  </g>

  <!-- Coche verte -->
  <g transform="translate(300, 205)">
    <circle r="27" fill="#3A9B52" stroke="#1A1A2E" stroke-width="5" />
    <path d="M -12 1 L -3 10 L 13 -9" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
