<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Ombre portée rétro (comme jeu_kim.svg) -->
    <filter id="retro-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A2E" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="60%" stop-color="#E2F0FA" />
      <stop offset="100%" stop-color="#BFDDF2" />
    </linearGradient>
  </defs>
  <!-- Carte de fond -->
  <rect x="25" y="25" width="350" height="350" rx="44" fill="url(#bg-grad)" stroke="#1A1A2E" stroke-width="8" filter="url(#retro-shadow)" />
  <circle cx="200" cy="200" r="125" fill="#FFFFFF" opacity="0.55" />
  <!-- Figure en L carrelée : morceau A (bleu) et morceau B (ambre) -->
  <g stroke="#1A1A2E" stroke-width="3">
    <!-- A : 2 colonnes × 4 rangées -->
    <g fill="#8EC5EA">
      <rect x="90" y="90" width="50" height="50"/><rect x="140" y="90" width="50" height="50"/>
      <rect x="90" y="140" width="50" height="50"/><rect x="140" y="140" width="50" height="50"/>
      <rect x="90" y="190" width="50" height="50"/><rect x="140" y="190" width="50" height="50"/>
      <rect x="90" y="240" width="50" height="50"/><rect x="140" y="240" width="50" height="50"/>
    </g>
    <!-- B : 3 colonnes × 2 rangées -->
    <g fill="#F5C77E">
      <rect x="190" y="190" width="50" height="50"/><rect x="240" y="190" width="50" height="50"/><rect x="290" y="190" width="50" height="50"/>
      <rect x="190" y="240" width="50" height="50"/><rect x="240" y="240" width="50" height="50"/><rect x="290" y="240" width="50" height="50"/>
    </g>
  </g>
  <!-- Contour de la figure et trait de découpe -->
  <path d="M90 90 H190 V190 H340 V290 H90 Z" fill="none" stroke="#1A1A2E" stroke-width="8" stroke-linejoin="round"/>
  <line x1="190" y1="190" x2="190" y2="290" stroke="#D94F3D" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round"/>
  <!-- Pastille m² -->
  <g transform="translate(272 118) rotate(8)">
    <rect x="-46" y="-30" width="92" height="60" rx="16" fill="#5B4FCF" stroke="#1A1A2E" stroke-width="6"/>
    <text x="0" y="16" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">m²</text>
  </g>
</svg>
