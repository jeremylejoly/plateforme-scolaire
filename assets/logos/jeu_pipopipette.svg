<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A2E" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="25" y="25" width="350" height="350" rx="36" fill="#FDFBF7" stroke="#1A1A2E" stroke-width="8" filter="url(#shadow)"/>

  <!-- Captured Box 1 (Purple) -->
  <rect x="80" y="80" width="110" height="110" rx="12" fill="#EEF0FF" stroke="#5B4FCF" stroke-width="4"/>
  <circle cx="135" cy="135" r="28" fill="#5B4FCF"/>
  <text x="135" y="145" font-family="'Fredoka', 'Inter', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- Captured Box 2 (Green) -->
  <rect x="210" y="80" width="110" height="110" rx="12" fill="#E2F5EE" stroke="#1A9E75" stroke-width="4"/>
  <circle cx="265" cy="135" r="28" fill="#1A9E75"/>
  <text x="265" y="145" font-family="'Fredoka', 'Inter', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- In-progress Box bottom-left -->
  <rect x="80" y="210" width="110" height="110" rx="8" fill="#FFF9E6" opacity="0.6"/>

  <!-- Active Segments (Purple) -->
  <line x1="80" y1="80" x2="190" y2="80" stroke="#5B4FCF" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="80" y2="190" stroke="#5B4FCF" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="190" x2="190" y2="190" stroke="#5B4FCF" stroke-width="12" stroke-linecap="round"/>

  <!-- Active Segments (Green) -->
  <line x1="190" y1="80" x2="320" y2="80" stroke="#1A9E75" stroke-width="12" stroke-linecap="round"/>
  <line x1="320" y1="80" x2="320" y2="190" stroke="#1A9E75" stroke-width="12" stroke-linecap="round"/>
  <line x1="190" y1="190" x2="320" y2="190" stroke="#1A9E75" stroke-width="12" stroke-linecap="round"/>

  <!-- Divider segment -->
  <line x1="190" y1="80" x2="190" y2="190" stroke="#1A1A2E" stroke-width="10" stroke-linecap="round"/>

  <!-- Bottom pending lines -->
  <line x1="80" y1="190" x2="80" y2="320" stroke="#5B4FCF" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="190" y2="320" stroke="#F59E0B" stroke-width="10" stroke-dasharray="8 8" stroke-linecap="round"/>
  <line x1="190" y1="190" x2="190" y2="320" stroke="#1A9E75" stroke-width="12" stroke-linecap="round"/>

  <!-- Grid Dots (Bold circles) -->
  <circle cx="80" cy="80" r="13" fill="#1A1A2E"/>
  <circle cx="190" cy="80" r="13" fill="#1A1A2E"/>
  <circle cx="320" cy="80" r="13" fill="#1A1A2E"/>

  <circle cx="80" cy="190" r="13" fill="#1A1A2E"/>
  <circle cx="190" cy="190" r="13" fill="#1A1A2E"/>
  <circle cx="320" cy="190" r="13" fill="#1A1A2E"/>

  <circle cx="80" cy="320" r="13" fill="#1A1A2E"/>
  <circle cx="190" cy="320" r="13" fill="#1A1A2E"/>
  <circle cx="320" cy="320" r="13" fill="#1A1A2E"/>

  <!-- White inner highlight dots -->
  <circle cx="78" cy="78" r="4" fill="#FFFFFF"/>
  <circle cx="188" cy="78" r="4" fill="#FFFFFF"/>
  <circle cx="318" cy="78" r="4" fill="#FFFFFF"/>
  <circle cx="78" cy="188" r="4" fill="#FFFFFF"/>
  <circle cx="188" cy="188" r="4" fill="#FFFFFF"/>
  <circle cx="318" cy="188" r="4" fill="#FFFFFF"/>
  <circle cx="78" cy="318" r="4" fill="#FFFFFF"/>
  <circle cx="188" cy="318" r="4" fill="#FFFFFF"/>
  <circle cx="318" cy="318" r="4" fill="#FFFFFF"/>
</svg>
