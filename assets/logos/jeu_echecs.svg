<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E9E4DA" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="52" y="96" width="296" height="272" rx="30"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.2" dy="1.2" stdDeviation="0" flood-color="#1A1A2E"/>
    </filter>
  </defs>

  <!-- Fond crème quadrillé -->
  <rect width="400" height="400" fill="#FDFBF7"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Titre -->
  <g font-family="Fredoka" font-weight="700" font-size="54" text-anchor="middle" stroke="#1A1A2E" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
    <text x="72"  y="74" fill="#5B4FCF">É</text>
    <text x="123" y="74" fill="#1A9E75">C</text>
    <text x="174" y="74" fill="#F59E0B">H</text>
    <text x="225" y="74" fill="#D94F3D">E</text>
    <text x="276" y="74" fill="#3B82F6">C</text>
    <text x="327" y="74" fill="#5B4FCF">S</text>
  </g>

  <!-- Carte échiquier : ombre + cases -->
  <rect x="52" y="96" width="296" height="272" rx="30" fill="#1A1A2E" transform="translate(9 9)"/>
  <g clip-path="url(#card)">
    <rect x="52" y="96" width="296" height="272" fill="#FDFBF7"/>
    <g fill="#1A9E75">
      <rect x="52"  y="96"  width="74" height="68"/><rect x="200" y="96"  width="74" height="68"/>
      <rect x="126" y="164" width="74" height="68"/><rect x="274" y="164" width="74" height="68"/>
      <rect x="52"  y="232" width="74" height="68"/><rect x="200" y="232" width="74" height="68"/>
      <rect x="126" y="300" width="74" height="68"/><rect x="274" y="300" width="74" height="68"/>
    </g>
    <!-- coup possible -->
    <circle cx="237" cy="130" r="13" fill="#1A1A2E" opacity="0.22"/>
    <rect x="126" y="96" width="74" height="68" fill="#F59E0B" opacity="0.55"/>
  </g>
  <rect x="52" y="96" width="296" height="272" rx="30" fill="none" stroke="#1A1A2E" stroke-width="8"/>

  <!-- Cavalier noir (dessin Cburnett agrandi) -->
  <g transform="translate(48 170) scale(4.3)" filter="url(#sh)">
    <g fill="none" fill-rule="evenodd" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#2B2B45"/>
      <path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.820 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3" fill="#2B2B45"/>
      <path d="M9.5 25.5a.5.5 0 1 1-1 0 .5.5 0 1 1 1 0z" fill="#fff" stroke="#fff"/>
      <path d="M24.55 10.4l-.45 1.45.5.15c3.15 1 5.65 2.49 7.9 6.75S35.75 29.06 35.25 39l-.05.5h2.25l.05-.5c.5-10.06-.88-16.85-3.25-21.34-2.37-4.49-5.79-6.64-9.19-7.16l-.51-.1z" fill="#8B84E8" stroke="none"/>
    </g>
    <!-- œil rieur -->
    <circle cx="15.3" cy="16.2" r="1.7" fill="#fff"/>
    <circle cx="15.6" cy="16.4" r="0.9" fill="#1A1A2E"/>
  </g>

  <!-- Roi blanc -->
  <g transform="translate(176 162) scale(4.3)" filter="url(#sh)">
    <g fill="none" fill-rule="evenodd" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22.5 11.63V6M20 8h5" stroke="#F59E0B" stroke-width="2.4" stroke-linejoin="miter"/>
      <path d="M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5" fill="#FFF7D6" stroke-linecap="butt" stroke-linejoin="miter"/>
      <path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-6.5-13.5-3.5-16 4V27v-3.5c-3.5-7.5-13-10.5-16-4-3 6 5 10 5 10V37z" fill="#FFFFFF"/>
      <path d="M11.5 30c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0m-21 3.5c5.5-3 15.5-3 21 0"/>
    </g>
  </g>

  <!-- Étincelles -->
  <g stroke="#1A1A2E" stroke-width="2.5" stroke-linejoin="round">
    <path d="M352 108 Q352 124 336 124 Q352 124 352 140 Q352 124 368 124 Q352 124 352 108Z" fill="#F59E0B"/>
    <path d="M40 300 Q40 311 29 311 Q40 311 40 322 Q40 311 51 311 Q40 311 40 300Z" fill="#5B4FCF"/>
  </g>
</svg>
