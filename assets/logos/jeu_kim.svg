<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Ombre portée 3D rétro -->
    <filter id="retro-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#1A1A2E" />
    </filter>

    <!-- Dégradé de fond -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Dégradé de la lentille -->
    <radialGradient id="lens-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85" />
    </radialGradient>

    <!-- Dégradé doré du sablier -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Dégradé du manche en bois -->
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
  </defs>

  <!-- CARTE DE FOND STYLISÉE -->
  <rect x="25" y="25" width="350" height="350" rx="44" fill="url(#bg-grad)" stroke="#1A1A2E" stroke-width="8" filter="url(#retro-shadow)" />

  <!-- LUEUR CENTRALE -->
  <circle cx="200" cy="190" r="120" fill="#FEF08A" opacity="0.45" />

  <!-- PETITS SYMBOLES HISTORIQUES EN ARRIÈRE-PLAN -->
  <!-- Étoiles de temps étincelantes -->
  <path d="M 90 85 Q 90 100 75 100 Q 90 100 90 115 Q 90 100 105 100 Q 90 100 90 85 Z" fill="#F59E0B" stroke="#1A1A2E" stroke-width="2" />
  <path d="M 315 90 Q 315 102 303 102 Q 315 102 315 114 Q 315 102 327 102 Q 315 102 315 90 Z" fill="#D97706" stroke="#1A1A2E" stroke-width="2" />
  <path d="M 75 285 Q 75 295 65 295 Q 75 295 75 305 Q 75 295 85 295 Q 75 295 75 285 Z" fill="#D97706" stroke="#1A1A2E" stroke-width="2" />

  <!-- Mini colonne antique (haut gauche) -->
  <g transform="translate(68, 125) scale(0.65)" opacity="0.35">
    <rect x="0" y="0" width="40" height="8" rx="2" fill="#1A1A2E" />
    <rect x="5" y="8" width="8" height="50" fill="#1A1A2E" />
    <rect x="16" y="8" width="8" height="50" fill="#1A1A2E" />
    <rect x="27" y="8" width="8" height="50" fill="#1A1A2E" />
    <rect x="0" y="58" width="40" height="8" rx="2" fill="#1A1A2E" />
  </g>

  <!-- Mini créneaux médiévaux (haut droite) -->
  <g transform="translate(295, 125) scale(0.65)" opacity="0.35">
    <path d="M 0 35 L 0 0 L 10 0 L 10 12 L 20 12 L 20 0 L 30 0 L 30 12 L 40 12 L 40 0 L 50 0 L 50 35 Z" fill="#1A1A2E" />
  </g>

  <!-- ============================================== -->
  <!-- LE SABLIER DU TEMPS (HISTORIQUE)              -->
  <!-- ============================================== -->
  <g transform="translate(0, 5)">
    <!-- Base supérieure du sablier -->
    <rect x="125" y="80" width="130" height="18" rx="6" fill="#78350F" stroke="#1A1A2E" stroke-width="6" />
    <rect x="135" y="98" width="110" height="8" rx="2" fill="#B45309" stroke="#1A1A2E" stroke-width="4" />

    <!-- Ampoules de verre -->
    <!-- Ampoule haute -->
    <path d="M 140 106 C 140 155, 180 165, 185 185 L 195 185 C 200 165, 240 155, 240 106 Z" fill="#F8FAFC" opacity="0.75" stroke="#1A1A2E" stroke-width="6" stroke-linejoin="round" />
    <!-- Sable haut -->
    <path d="M 146 120 C 150 145, 185 155, 190 185 L 190 185 C 195 155, 230 145, 234 120 Z" fill="url(#gold-grad)" />

    <!-- Filet d'écoulement du sable -->
    <line x1="190" y1="185" x2="190" y2="235" stroke="#D97706" stroke-width="4" stroke-linecap="round" />

    <!-- Ampoule basse -->
    <path d="M 185 185 C 180 205, 140 215, 140 264 L 240 264 C 240 215, 200 205, 195 185 Z" fill="#F8FAFC" opacity="0.75" stroke="#1A1A2E" stroke-width="6" stroke-linejoin="round" />
    <!-- Monticule de sable bas -->
    <path d="M 144 262 C 155 240, 175 230, 190 230 C 205 230, 225 240, 236 262 Z" fill="url(#gold-grad)" stroke="#1A1A2E" stroke-width="4" />

    <!-- Base inférieure du sablier -->
    <rect x="135" y="264" width="110" height="8" rx="2" fill="#B45309" stroke="#1A1A2E" stroke-width="4" />
    <rect x="125" y="272" width="130" height="18" rx="6" fill="#78350F" stroke="#1A1A2E" stroke-width="6" />

    <!-- Colonnettes en bois latérales -->
    <line x1="133" y1="98" x2="133" y2="272" stroke="#1A1A2E" stroke-width="6" stroke-linecap="round" />
    <line x1="247" y1="98" x2="247" y2="272" stroke="#1A1A2E" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- ============================================== -->
  <!-- LA GRANDE LOUPE D'OBSERVATION (L'ŒIL)          -->
  <!-- ============================================== -->
  <g transform="rotate(-15, 225, 215)">
    <!-- Manche de la loupe -->
    <path d="M 270 270 L 335 335 C 342 342, 342 353, 335 360 C 328 367, 317 367, 310 360 L 245 295 Z" fill="url(#wood-grad)" stroke="#1A1A2E" stroke-width="7" stroke-linejoin="round" />
    <!-- Bague dorée de fixation -->
    <rect x="250" y="278" width="22" height="12" rx="3" transform="rotate(45, 261, 284)" fill="url(#gold-grad)" stroke="#1A1A2E" stroke-width="4" />

    <!-- Cerclage de la loupe avec ombre 3D -->
    <circle cx="195" cy="195" r="76" fill="none" stroke="#1A1A2E" stroke-width="18" />
    <circle cx="195" cy="195" r="76" fill="none" stroke="url(#gold-grad)" stroke-width="12" />

    <!-- Verre grossissant bleuté -->
    <circle cx="195" cy="195" r="68" fill="url(#lens-grad)" />

    <!-- L'ŒIL D'OBSERVATEUR (au centre de la lentille) -->
    <!-- Blanc de l'œil amande -->
    <path d="M 150 195 Q 195 160 240 195 Q 195 230 150 195 Z" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="5" />
    <!-- Iris noisette / or -->
    <circle cx="195" cy="195" r="22" fill="#B45309" stroke="#1A1A2E" stroke-width="4" />
    <circle cx="195" cy="195" r="16" fill="#D97706" />
    <!-- Pupille noire -->
    <circle cx="195" cy="195" r="9" fill="#1A1A2E" />
    <!-- Reflets éclatants dans l'œil -->
    <circle cx="189" cy="189" r="4.5" fill="#FFFFFF" />
    <circle cx="203" cy="201" r="2" fill="#FFFFFF" />

    <!-- Reflet spéculaire courbé sur le verre de la loupe -->
    <path d="M 148 165 C 160 145, 195 138, 220 144" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- PETITES ÉTINCELLES MAGIQUES -->
  <circle cx="280" cy="155" r="4" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="2" />
  <circle cx="115" cy="225" r="3.5" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="2" />
</svg>
