<!DOCTYPE html>
<html lang="fr">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-primary: #e0e7ff;
      --card-bg: #ffffff;
      --text-main: #1e1b4b;
      --text-muted: #4f46e5;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --accent-amber: #fbbf24;
      --accent-amber-hover: #f59e0b;
      --correct-green: #10b981;
      --wrong-red: #ef4444;
      --border-color: #1e1b4b;
      --shadow-color: #1e1b4b;
      --font-display: 'Outfit', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      font-family: var(--font-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .page-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-controls {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
    }

    /* Back Button style */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: 3px solid var(--border-color);
      border-radius: 14px;
      background: var(--card-bg);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-main);
      box-shadow: 3px 3px 0px var(--shadow-color);
      transition: all .15s;
    }
    .back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--shadow-color);
    }
    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    /* Central Game Card container */
    .container {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 6px 6px 0px var(--shadow-color);
      width: 100%;
      padding: 24px;
      position: relative;
    }

    /* Card Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 16px;
    }

    .title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-badge {
      background: var(--accent-amber);
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
      font-family: var(--font-display);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    /* Progress indicators */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-bar-bg {
      background: #f1f5f9;
      border: 2px solid var(--border-color);
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      background: var(--accent-purple);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Sentence / Paragraph Container box (flows naturally as text) */
    .sentence-card {
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      font-size: 1.25rem;
      line-height: 2.2;
      font-weight: 600;
      text-align: center;
    }
    .sentence-card.left {
      text-align: left;
    }

    .sentence-card-title {
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      font-family: var(--font-display);
      line-height: 1.2;
    }

    /* ===== CLICKABLE INLINE WORDS ===== */
    .clickable-word {
      font-family: var(--font-body);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      border-bottom: 2.5px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
      display: inline-block;
    }
    .clickable-word:hover {
      background-color: #f1f5f9;
      border-bottom-color: var(--text-muted);
    }

    /* Selected state: Highlighter yellow */
    .clickable-word.highlighted {
      background-color: #fef08a; /* Yellow-200 */
      border-bottom-color: var(--accent-amber);
      color: var(--text-main);
    }

    /* Correct state: Highlighter green */
    .clickable-word.correct {
      background-color: #d1fae5; /* Green-100 */
      border-bottom-color: var(--correct-green);
      color: #065f46;
      cursor: default;
    }

    /* Wrong state: Highlighter red */
    .clickable-word.wrong {
      background-color: #ffe4e6; /* Rose-100 */
      border-bottom-color: var(--wrong-red);
      color: #9f1239;
      animation: shake 0.3s ease;
      cursor: default;
    }

    /* Missed state: Highlighter orange dashed */
    .clickable-word.missed {
      background-color: #ffedd5; /* Amber-100 */
      border-bottom: 2.5px dashed var(--accent-amber);
      color: #92400e;
      cursor: default;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Punctuation styles */
    .punc-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      user-select: none;
      display: inline-block;
    }

    /* Detailed correction panel */
    .feedback-panel {
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease forwards;
    }
    .feedback-panel.perfect {
      background-color: #ecfdf5;
      border-color: var(--correct-green);
    }
    .feedback-panel.errors {
      background-color: #fff1f2;
      border-color: var(--wrong-red);
    }

    .feedback-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-list {
      list-style: none;
      padding-left: 0;
    }
    .feedback-list li {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-main);
    }

      justify-content: flex-end;
      align-items: center;
      border-top: 2px solid var(--border-color);
      padding-top: 20px;

    .action-btn-secondary {

      border: 2px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-main);
      box-shadow: 2px 2px 0px var(--shadow-color);
      transition: all 0.1s ease;
    }
    .action-btn-secondary:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--shadow-color);
    }
    .action-btn-secondary:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    .action-btn-primary {
      padding: 12px 24px;
      border: 3px solid var(--border-color);
      background: var(--accent-purple);
      border-radius: 14px;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      color: white;
      box-shadow: 3px 3px 0px var(--shadow-color);
      transition: all 0.1s ease;
    }
    .action-btn-primary:hover {
      background: var(--accent-purple-hover);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--shadow-color);
    }
    .action-btn-primary:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }
    .action-btn-primary.green {
      background: var(--correct-green);
    }
    .action-btn-primary.green:hover {
      background: #059669;
    }

    .menu-intro {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .menu-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 12px;
    }

    .menu-option-btn {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--shadow-color);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }
    .menu-option-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--shadow-color);
      background: #fafafa;
    }
    .menu-option-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

      font-size: 1.6rem;
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      box-shadow: 2px 2px 0px var(--shadow-color);

      display: flex;
      flex-direction: column;

    .menu-option-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-main);
    }
    .menu-option-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.4;
    }

    /* Confetti animation */
    .confetti {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      animation: confettiFall 2s ease-out forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

</head>

    // MENU SCREEN RENDERER
    function renderMenu() {
      state.level = null;

      const container = document.getElementById('gram-adv-body');
      if (!container) return;

      container.className = "animate-fadeIn";
      container.innerHTML = `
        <div class="top-bar">
          <div class="title">🎯 Le Défi des Adverbes</div>
          <div class="score-badge" style="opacity: 0.5">Score : -</div>
        </div>

        <div class="menu-intro">
          Sélectionnez votre niveau de difficulté pour démarrer l'entraînement d'identification des adverbes.
        </div>

        <div class="menu-cards-grid">
          <button class="menu-option-btn" id="btn-lvl-1">
            <div class="menu-option-icon font-display font-black">N1</div>
            <div class="menu-option-details">
              <span class="menu-option-title">Niveau 1 : Phrases simples</span>
              <span class="menu-option-desc">Trouvez tous les adverbes dans 10 phrases courtes de difficulté progressive.</span>
            </div>
          </button>

          <button class="menu-option-btn" id="btn-lvl-2">
            <div class="menu-option-icon font-display font-black">N2</div>
            <div class="menu-option-details">
              <span class="menu-option-title">Niveau 2 : Courts paragraphes</span>
              <span class="menu-option-desc">Trouvez tous les adverbes répartis dans 5 petits textes de 4 à 5 phrases.</span>
            </div>
          </button>
        </div>
      `;

      document.getElementById('btn-lvl-1').addEventListener('click', () => startExercise(1));
      document.getElementById('btn-lvl-2').addEventListener('click', () => startExercise(2));
    }

    // GAME INITIALIZER
    function startExercise(levelNum) {
      state.level = levelNum;
      
      let pool = (levelNum === 1) ? BANK_LEVEL_1 : BANK_LEVEL_2;
      let targetCount = (levelNum === 1) ? 10 : 5;
      
      const selected = shuffleArray(pool).slice(0, targetCount);

      gameState = {
        questions: selected,
        currentIndex: 0,
        score: 0,
        answers: Array(selected[0].tokens.length).fill(0),
        statusTracker: Array(selected.length).fill('unreached'),
        submitted: false
      };

      renderQuestion();
    }

    // QUESTION RENDERER
    function renderQuestion() {
      const container = document.getElementById('gram-adv-body');
      if (!container) return;

      const question = gameState.questions[gameState.currentIndex];
      if (!question) return;

      container.className = "animate-fadeIn";

      const pctProgress = Math.round((gameState.currentIndex / gameState.questions.length) * 100);

      // Render inline clickable words instead of block buttons
      const tokensHtml = question.tokens.map((token, idx) => {
        if (token.punctuation === true) {
          let spacingBefore = (token.text === ',' || token.text === '.') ? "" : " ";
          return `${spacingBefore}<span class="punc-text">${token.text}</span>`;
        }

        const isSelected = gameState.answers[idx]; // 0 or 1
        let highlightClass = "";

        if (!gameState.submitted) {
          if (isSelected === 1) highlightClass = "highlighted";
        } else {
          const isAdv = (token.cat === 'adv');
          if (isAdv) {
            if (isSelected === 1) highlightClass = "correct";
            else highlightClass = "missed";
          } else {
            if (isSelected === 1) highlightClass = "wrong";
          }
        }

        // Determine trailing spacing: none if contraction apostrophe
        let spacingAfter = (token.text.endsWith("'") || token.text.endsWith("’")) ? "" : " ";

        return `
          <span
            ${gameState.submitted ? '' : `onclick="toggleSelectWord(${idx})"`}
            class="clickable-word ${highlightClass}"
          >${token.text}</span>${spacingAfter}
        `;
      }).join('');

      let actionBtn = "";
      if (!gameState.submitted) {
        actionBtn = `
          <button class="btn-verify action-btn-primary">
            Vérifier ma réponse
          </button>
        `;
      } else {
        const isLast = (gameState.currentIndex >= gameState.questions.length - 1);
        actionBtn = `
          <button class="btn-next action-btn-primary green">
            ${isLast ? 'Voir les résultats ➔' : 'Continuer ➔'}
          </button>
        `;
      }

      const qLabel = (state.level === 1) ? "Phrase" : "Texte";

      // Render pill-like score track indicator
      const starsPanelHtml = gameState.statusTracker.map((s, i) => {
        let pillClass = "progress-pill";
        if (s === 'correct') pillClass += " correct";
        if (s === 'mistake') pillClass += " mistake";
        if (i === gameState.currentIndex) pillClass += " current";
        return `<div class="${pillClass}"></div>`;
      }).join(' ');

      container.innerHTML = `
        <div class="top-bar">
          <div class="title">🎯 Le Défi des Adverbes</div>
          <div class="score-badge">Score : ${gameState.score}</div>
        </div>

        <div class="progress-container">
          <div class="progress-text">
            <span>${qLabel} ${gameState.currentIndex + 1} sur ${gameState.questions.length}</span>
            <span>Exercice</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${pctProgress}%"></div>
          </div>
        </div>

        <!-- TARGET PHRASE/TEXT IN INLINE FLOW FORMAT -->
        <div class="sentence-card ${state.level === 1 ? 'centered' : 'left'}">
          <div class="sentence-card-title">Sélectionnez les adverbes dans la phrase ci-dessous :</div>
          <div style="width: 100%; display: inline-block;">
            ${tokensHtml}
          </div>
        </div>

        <!-- EXPLANATION PANEL -->
        <div id="corr-panel"></div>

        <!-- BOTTOM BUTTON BAR -->
        <div class="actions-bar">
          ${actionBtn}
        </div>
      `;

      // Verify
      const verifyBtn = container.querySelector('.btn-verify');
      if (verifyBtn) {
        verifyBtn.addEventListener('click', (e) => {
          e.preventDefault();
          verifyAnswer();
        });
      }

      // Next
      const nextBtn = container.querySelector('.btn-next');
      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          nextQuestion();
        });
      }
    }

    // STATE UPDATER : WORD CLICK
    function toggleSelectWord(idx) {
      if (gameState.submitted) return;
      gameState.answers[idx] = (gameState.answers[idx] === 0) ? 1 : 0;
      renderQuestion();
    }

    // VALIDATOR & DETAILED CORRECTIONS PANEL
    function verifyAnswer() {
      if (gameState.submitted) return;

      const question = gameState.questions[gameState.currentIndex];
      const errors = [];

      question.tokens.forEach((token, idx) => {
        if (token.punctuation === true) return;

        const isSelected = gameState.answers[idx]; // 0 or 1
        const isAdv = (token.cat === 'adv');

        if (isAdv) {
          if (isSelected === 0) {
            errors.push(`Vous avez oublié l'adverbe « <strong>${token.text}</strong> ».`);
          }
        } else {
          if (isSelected === 1) {
            const label = catLabels[token.cat] || "un mot d'une autre classe";
            errors.push(`Le mot « <strong>${token.text}</strong> » est <strong>${label}</strong>, ce n'est pas un adverbe.`);
          }
        }
      });

      gameState.submitted = true;
      const isPerfect = (errors.length === 0);

      if (isPerfect) {
        gameState.score++;
        gameState.statusTracker[gameState.currentIndex] = 'correct';
        launchMiniConfetti();
      } else {
        gameState.statusTracker[gameState.currentIndex] = 'mistake';
      }

      renderQuestion();

      // Render corrections panel
      const corrPanel = document.getElementById('corr-panel');
      if (!corrPanel) return;

      if (isPerfect) {
        corrPanel.innerHTML = `
          <div class="feedback-panel perfect">
            <div class="feedback-title" style="color: #065f46">
              <span>🏆</span>
              <span>Parfait ! Tout est correct.</span>
            </div>
          </div>
        `;
      } else {
        const errItems = errors.map(err => `<li>• ${err}</li>`).join('');
        corrPanel.innerHTML = `
          <div class="feedback-panel errors">
            <div class="feedback-title" style="color: #9f1239">
              <span>💡</span>
              <span>Analyse de vos réponses :</span>
            </div>
            <ul class="feedback-list">
              ${errItems}
            </ul>
          </div>
        `;
      }
    }

    // NEXT SLIDE
    function nextQuestion() {
      gameState.currentIndex++;
      if (gameState.currentIndex < gameState.questions.length) {
        const nextQ = gameState.questions[gameState.currentIndex];
        gameState.answers = Array(nextQ.tokens.length).fill(0);
        gameState.submitted = false;
        renderQuestion();
      } else {
        showResults();
      }
    }

    // RESULTS SCREEN RENDERER
    function showResults() {
      const container = document.getElementById('gram-adv-body');
      if (!container) return;

      const score = gameState.score;
      const total = gameState.questions.length;

      let title = "";
      let msg = "";
      let emoji = "";

      if (score === total) {
        title = "Score parfait !";
        msg = "Excellent travail, vous maîtrisez parfaitement l'identification des adverbes sur ce niveau.";
        emoji = "🏆";
        launchConfetti();
      } else if (score >= total * 0.8) {
        title = "Très bon travail !";
        msg = "Vous avez évité la plupart des pièges de la leçon. Presque un sans-faute !";
        emoji = "🌟";
        launchConfetti();
      } else if (score >= total * 0.5) {
        title = "Bon travail !";
        msg = "C'est un résultat satisfaisant. Prenez le temps de revoir les erreurs pour viser le score maximal.";
        emoji = "👍";
      } else {
        title = "Entraînez-vous encore";
        msg = "Recommencez l'exercice pour progresser et acquérir les automatismes.";
        emoji = "📝";
      }

      container.className = "animate-fadeIn";
      container.innerHTML = `
        <div class="top-bar">
          <div class="title">🎯 Fin de l'exercice</div>
          <div class="score-badge">Score : ${score} / ${total}</div>
        </div>

        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 4.5rem; margin-bottom: 12px; select-none">${emoji}</div>
          <h2 class="font-display" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: var(--text-main);">${title}</h2>
          
          <div style="display: inline-block; background: #f8fafc; border: 2px solid var(--border-color); padding: 12px 24px; border-radius: 16px; margin: 16px 0; box-shadow: 2px 2px 0px var(--shadow-color)">
            <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); tracking: 0.05em; display: block; margin-bottom: 2px;">Taux de réussite</span>
            <span class="font-display" style="font-size: 2.25rem; font-weight: 900; color: var(--text-main);">${Math.round((score / total) * 100)}%</span>
          </div>

          <p style="font-size: 0.9rem; font-weight: 500; color: var(--text-muted); line-height: 1.6; max-width: 320px; margin: 0 auto 24px;">${msg}</p>

          <div style="display: flex; gap: 12px; justify-content: center; max-width: 340px; margin: 0 auto;">
            <button class="btn-restart action-btn-primary" style="flex: 1; padding: 10px; font-size: 0.85rem;">
              Recommencer
            </button>
            <button class="btn-menu action-btn-secondary" style="flex: 1; padding: 10px; font-size: 0.85rem;">
              Menu principal
            </button>
          </div>
        </div>
      `;

      container.querySelector('.btn-restart').addEventListener('click', (e) => {
        e.preventDefault();
        startExercise(state.level);
      });

      container.querySelector('.btn-menu').addEventListener('click', (e) => {
        e.preventDefault();
        renderMenu();
      });
    }

    // FULL CONFETTI CELEBRATION
    function launchConfetti() {
      const colors = ['#4f46e5', '#10b981', '#f43f5e', '#f59e0b', '#3b82f6'];
      for (let i = 0; i < 45; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 1.5 + 's';
        confetti.style.transform = `scale(${Math.random() * 0.8 + 0.5})`;
        document.body.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 2500);
      }
    }

    // MINI CONFETTI BURST (ON PERFECT ANSWER)
    function launchMiniConfetti() {
      const colors = ['#4f46e5', '#10b981', '#f59e0b'];
      for (let i = 0; i < 15; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = 35 + Math.random() * 30 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.3 + 's';
        confetti.style.transform = `scale(${Math.random() * 0.6 + 0.4})`;
        document.body.appendChild(confetti);
        
        setTimeout(() => confetti.remove(), 2000);
      }
    }

    // INIT
    renderMenu();
  </script>
</body>
</html>
