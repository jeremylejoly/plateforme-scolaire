<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM — Le squelette</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false,
      },
      theme: {
        extend: {
          borderWidth: {
            '3': '3px',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --encre: #0f172a;
      --ardoise: #475569;
      --papier: #f8fafc;
      --papier-2: #ffffff;
      --ligne: #e2e8f0;
      
      --squelette: #6366f1;
      --squelette-fonce: #4338ca;
      --squelette-clair: #e0e7ff;
      
      --vert: #10b981;
      --vert-clair: #ecfdf5;
      --rouge: #ef4444;
      --rouge-clair: #fef2f2;
      
      --border: #0f172a;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--encre);
      background: var(--papier);
      line-height: 1.5;
      padding: 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    /* CARD STYLE */
    .card-premium {
      background: #ffffff;
      border: 3px solid var(--encre);
      border-radius: var(--radius);
      padding: 20px;
      margin: 12px 0;
      box-shadow: 4px 4px 0px rgba(15, 23, 42, 0.1);
    }

    /* FLAT 3D BUTTON */
    .btn-3d {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      border: 3px solid var(--encre) !important;
      box-shadow: 3px 3px 0px var(--encre);
      transition: all 0.1s ease;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-3d:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--encre);
    }

    /* SCORE PANEL */
    .geo-score-panel {
      background: var(--vert-clair);
      border: 3px solid var(--vert);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-top: 16px;
      box-shadow: 4px 4px 0px var(--vert);
    }
    .score-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--vert);
      margin-bottom: 6px;
    }
    .score-msg {
      font-weight: 700;
      font-size: 1.05rem;
      color: #065f46;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card-premium bg-indigo-50 border-indigo-200" style="margin-top: 0;">
    <p class="text-xs md:text-sm font-bold text-indigo-900 m-0">
      Réponds aux 10 questions suivantes. Une seule réponse est correcte par question.
    </p>
  </div>
  
  <div id="qcm-questions-container" class="mt-4"></div>
  <div id="qcm-msg" style="display:none;margin-top:1rem;padding:.6rem .9rem;border-radius:8px;background:#fff7ed;border:1.5px solid #f59e0b;color:#92400e;font-size:.85rem;font-weight:700;text-align:center"></div>

  <button id="qcm-validate-btn" class="btn-3d w-full py-3.5 bg-indigo-500 text-white rounded-xl text-sm font-bold mt-4" style="width:100%;margin-top:1rem;padding:.85rem;background:#6366f1;color:#fff;border-radius:12px;" onclick="validateQCM()">
    ✅ Valider mes réponses
  </button>
  <div id="qcm-score" style="display:none" class="geo-score-panel"></div>
</div>

<script>
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // Banque : la bonne réponse est notée en premier (correct: 0), les propositions sont mélangées à l'affichage.
  // k = famille : jamais deux questions de la même famille dans une série (elles se donneraient la réponse).
  const QCM_DATA = [
    { k: "crane", q: "Quel os protège notre cerveau ?", opts: ["Le crâne", "Le fémur", "Le sternum", "La colonne vertébrale"], correct: 0 },
    { k: "femur", q: "Quel est l'os le plus long du corps humain ?", opts: ["Le fémur", "L'humérus", "Le tibia", "La colonne vertébrale"], correct: 0 },
    { k: "femur", q: "Quel est l'os unique de notre cuisse ?", opts: ["Le fémur", "Le tibia", "L'humérus", "Le péroné"], correct: 0 },
    { k: "rotule", q: "Où se situe la rotule ?", opts: ["Dans le genou", "Dans l'épaule", "Dans le coude", "Dans le pied"], correct: 0 },
    { k: "cage", q: "Quelle partie du squelette protège le cœur et les poumons ?", opts: ["La cage thoracique", "Le bassin", "Le crâne", "La colonne vertébrale"], correct: 0 },
    { k: "articulation", q: "Qu'est-ce qu'une articulation ?", opts: ["L'endroit où deux os se rejoignent et peuvent bouger", "Le cordon qui attache un muscle à un os", "Un muscle qui sert à plier le bras", "La partie molle et spongieuse à l'intérieur d'un os"], correct: 0 },
    { k: "cartilage", q: "Quel tissu lisse recouvre le bout des os dans une articulation ?", opts: ["Le cartilage", "Le tendon", "La moelle osseuse", "Le ligament"], correct: 0 },
    { k: "liens", q: "Qu'est-ce qui relie les os entre eux au niveau des articulations ?", opts: ["Les ligaments", "Les tendons", "Les cartilages", "Les muscles"], correct: 0 },
    { k: "liens", q: "Qu'est-ce qui attache les muscles aux os ?", opts: ["Les tendons", "Les ligaments", "Les articulations", "Le cartilage"], correct: 0 },
    { k: "antagonistes", q: "Comment appelle-t-on deux muscles qui travaillent en sens opposé ?", opts: ["Des muscles antagonistes", "Des muscles collaborateurs", "Des muscles symétriques", "Des muscles jumeaux"], correct: 0 },
    { k: "contraction", q: "Quand un muscle se contracte, comment change-t-il ?", opts: ["Il raccourcit et gonfle", "Il s'allonge et s'amincit", "Il change seulement de couleur", "Il se détache de son tendon"], correct: 0 },
    { k: "flexion", q: "Quand on plie le bras (flexion), que font les muscles ?", opts: ["Le biceps se contracte, le triceps se relâche", "Le triceps se contracte, le biceps se relâche", "Le biceps et le triceps se contractent ensemble", "Le biceps et le triceps se relâchent ensemble"], correct: 0 },
    { k: "flexion", q: "Quand on déplie le bras (extension), que font les muscles ?", opts: ["Le triceps se contracte, le biceps se relâche", "Le biceps se contracte, le triceps se relâche", "Le biceps et le triceps s'allongent ensemble", "Le triceps se détache de l'os du bras"], correct: 0 },
    { k: "flexion", q: "Quel muscle, à l'arrière du haut du bras, s'étire quand on plie le bras ?", opts: ["Le triceps", "Le biceps", "Le deltoïde", "Le pectoral"], correct: 0 },
    { k: "mouvements", q: "Comment appelle-t-on le mouvement qui déplie un membre (comme tendre la jambe) ?", opts: ["L'extension", "La flexion", "La rotation", "La contraction"], correct: 0 },
    { k: "mouvements", q: "Comment appelle-t-on le mouvement qui plie un membre (comme ramener la main vers l'épaule) ?", opts: ["La flexion", "L'extension", "La rotation", "La contraction"], correct: 0 },
    { k: "mandibule", q: "Quel os forme notre mâchoire inférieure ?", opts: ["La mandibule", "Le sternum", "La clavicule", "L'omoplate"], correct: 0 },
    { k: "calcium", q: "Quels éléments rendent les os durs et solides ?", opts: ["Le calcium et la vitamine D", "Le fer et la vitamine C", "Le sucre et les graisses animales", "Le sel et la vitamine E"], correct: 0 },
    { k: "calcium", q: "Que risque-t-on avec un grave manque de calcium et de vitamine D ?", opts: ["Des os fragiles qui cassent facilement", "Une peau qui change de couleur", "Des trous de mémoire", "Des problèmes pour respirer"], correct: 0 },
    { k: "calcium", q: "Quelle maladie des os est due à un manque de vitamine D chez l'enfant qui grandit ?", opts: ["Le rachitisme", "La grippe", "L'asthme", "L'angine"], correct: 0 },
    { k: "vitd", q: "Comment notre corps fabrique-t-il surtout la vitamine D ?", opts: ["Grâce au soleil sur la peau", "En mangeant des pâtes", "En buvant beaucoup d'eau", "Pendant le sommeil"], correct: 0 },
    { k: "aliments", q: "Parmi ces aliments, lequel est le plus riche en calcium ?", opts: ["Le fromage", "Les pâtes", "La viande rouge", "Les pommes de terre"], correct: 0 },
    { k: "blessures", q: "Comment appelle-t-on un ligament trop étiré ou déchiré ?", opts: ["Une entorse", "Une luxation", "Une fracture", "Une crampe"], correct: 0 },
    { k: "blessures", q: "Qu'est-ce qu'une fracture ?", opts: ["Un os fêlé ou cassé", "Une articulation déboitée", "Un muscle froissé", "Un tendon coupé"], correct: 0 },
    { k: "blessures", q: "Qu'est-ce qu'une luxation ?", opts: ["Un os sorti de son articulation", "Un ligament déchiré", "Un manque de calcium dans les os", "Une mauvaise posture"], correct: 0 },
    { k: "posture", q: "Pourquoi une mauvaise posture prolongée peut-elle faire mal au dos ?", opts: ["Elle déforme la colonne vertébrale", "Elle fait battre le cœur trop vite", "Elle détruit le calcium des os", "Elle empêche les muscles de bouger"], correct: 0 },
    { k: "vertebres", q: "Combien de vertèbres compte environ la colonne vertébrale ?", opts: ["33 vertèbres", "12 vertèbres", "60 vertèbres", "100 vertèbres"], correct: 0 },
    { k: "vertebres", q: "Qu'est-ce que la colonne vertébrale ?", opts: ["Une pile de petits os, les vertèbres", "Un seul long os d'un seul bloc", "Un muscle qui tient le dos droit", "Un tendon très solide qui descend dans le dos"], correct: 0 },
    { k: "paires", q: "Quels sont les deux os de l'avant-bras ?", opts: ["Le radius et le cubitus", "Le tibia et le péroné", "L'humérus et la clavicule", "Le fémur et la rotule"], correct: 0 },
    { k: "paires", q: "Quels sont les deux os de la jambe, sous le genou ?", opts: ["Le tibia et le péroné", "Le radius et le cubitus", "L'humérus et le sternum", "Le bassin et le fémur"], correct: 0 },
    { k: "synovial", q: "À quoi sert le liquide synovial dans une articulation ?", opts: ["À faire glisser les os sans usure", "À transporter l'oxygène aux cellules", "À souder les os après une fracture", "À transmettre les ordres du cerveau"], correct: 0 },
    { k: "moelle", q: "Que protège la colonne vertébrale ?", opts: ["La moelle épinière", "Les poumons et le cœur", "Le cerveau", "Les reins"], correct: 0 },
    { k: "moelle", q: "Quel os protège la moelle épinière ?", opts: ["La colonne vertébrale", "Le crâne", "Le fémur", "Le bassin"], correct: 0 },
    { k: "fonctions", q: "Quelles sont les trois grandes fonctions du squelette ?", opts: ["Soutenir, protéger et permettre de bouger", "Digérer, respirer et faire circuler le sang", "Produire de la chaleur, de la salive et de la sueur", "Penser, garder l'équilibre et entendre"], correct: 0 },
    { k: "sternum", q: "Quel os plat, au milieu de la poitrine, ferme la cage thoracique ?", opts: ["Le sternum", "L'omoplate", "La clavicule", "La mandibule"], correct: 0 },
    { k: "sternum", q: "Parmi ces os, lequel fait partie de la cage thoracique ?", opts: ["Le sternum", "La rotule", "Le bassin", "Le cubitus"], correct: 0 },
    { k: "clavicule", q: "Quel os relie le haut du sternum à l'épaule ?", opts: ["La clavicule", "Le radius", "L'omoplate", "L'humérus"], correct: 0 },
    { k: "omoplate", q: "Où se trouve l'omoplate ?", opts: ["Dans le haut du dos", "Dans le bas de la mâchoire", "Dans la cuisse", "Dans le genou"], correct: 0 },
    { k: "types", q: "Quel type d'os est l'omoplate ?", opts: ["Un os plat", "Un os long", "Un os court", "Un os rond"], correct: 0 },
    { k: "types", q: "Quel type d'os est le fémur ?", opts: ["Un os long", "Un os court", "Un os plat", "Un os rond"], correct: 0 },
    { k: "types", q: "Quel type d'os sont les vertèbres ?", opts: ["Des os courts", "Des os longs", "Des os plats", "Des os mous et souples"], correct: 0 },
    { k: "nombre", q: "Combien d'os possède environ un adulte ?", opts: ["Environ 206 os", "Environ 100 os", "Environ 350 os", "Environ 600 os"], correct: 0 },
    { k: "nombre", q: "Pourquoi un bébé a-t-il plus d'os qu'un adulte ?", opts: ["Certains de ses os se soudent en grandissant", "Il perd des os en grandissant", "Ses os sont plus grands que ceux d'un adulte", "C'est faux, il a autant d'os qu'un adulte"], correct: 0 },
    { k: "oreille", q: "Où se trouvent les plus petits os du corps (marteau, enclume, étrier) ?", opts: ["Dans l'oreille", "Dans le nez", "Dans le pied", "Dans les doigts de la main"], correct: 0 },
    { k: "commande", q: "Quel organe commande nos mouvements volontaires ?", opts: ["Le cerveau", "Le cœur", "La moelle osseuse", "Les poumons"], correct: 0 },
    { k: "commande", q: "Comment l'ordre du cerveau arrive-t-il aux muscles du bras ?", opts: ["Par les nerfs", "Par le sang", "Par la salive", "Par les tendons"], correct: 0 },
    { k: "sport", q: "Pourquoi le sport est-il bon pour le squelette ?", opts: ["Il renforce les os et les muscles", "Il diminue le nombre d'os", "Il remplace le cartilage par de l'os", "Il empêche de transpirer"], correct: 0 },
    { k: "moelle_osseuse", q: "Quelle partie de l'os fabrique les cellules du sang ?", opts: ["La moelle osseuse", "Le cartilage", "La couche de calcium", "Le tendon"], correct: 0 },
    { k: "muscles_nb", q: "Combien de muscles possède environ le corps humain ?", opts: ["Plus de 600 muscles", "Moins de 50 muscles", "Environ 200 muscles", "Exactement 206 muscles"], correct: 0 }
  ];

  const NB = 10;
  let qcmActiveQuestions = [];
  let qcmAnswers = [];
  let qcmValidated = false, saved = false, lastClick = 0;

  function initQCMGame() {
    const vus = new Set(), picked = [];
    shuffle([...QCM_DATA]).forEach(q => { if (picked.length < NB && !vus.has(q.k)) { vus.add(q.k); picked.push(q); } });
    qcmActiveQuestions = picked.map(q => {
      const bonne = q.opts[q.correct];
      const opts = shuffle([...q.opts]);
      return { q: q.q, opts, correct: opts.indexOf(bonne) };
    });
    qcmAnswers = new Array(qcmActiveQuestions.length).fill(-1);
    qcmValidated = false; saved = false; lastClick = 0;
    document.getElementById('qcm-score').style.display = 'none';
    document.getElementById('qcm-msg').style.display = 'none';
    document.getElementById('qcm-validate-btn').style.display = 'inline-flex';
    renderQCMHtml();
    window.scrollTo(0, 0);
  }

  function renderQCMHtml() {
    const container = document.getElementById('qcm-questions-container');
    let html = '';
    qcmActiveQuestions.forEach((q, qIdx) => {
      html += `
        <div class="card-premium mt-0 mb-4">
          <p class="font-bold text-slate-800 text-sm md:text-base mb-3" style="font-weight:700;margin:0 0 .6rem;">${qIdx + 1}. ${q.q}</p>
          <div class="flex flex-col gap-2" style="display:flex;flex-direction:column;gap:8px;">`;
      q.opts.forEach((opt, optIdx) => {
        const isSelected = qcmAnswers[qIdx] === optIdx;
        let border = 'var(--border)', bg = '#ffffff', color = 'inherit', mark = '', weight = '500';
        if (qcmValidated) {
          if (optIdx === q.correct) {
            if (isSelected) { border = 'var(--vert)'; bg = 'var(--vert-clair)'; mark = ' ✅'; }
            else { border = '#1f5fbf'; bg = '#eaf1fc'; color = '#1f5fbf'; mark = ' ➜'; weight = '800'; }
          } else if (isSelected) { border = 'var(--rouge)'; bg = 'var(--rouge-clair)'; mark = ' ❌'; }
        } else if (isSelected) {
          border = 'var(--squelette-fonce)'; bg = 'var(--squelette-clair)';
        }
        html += `
          <button onclick="${qcmValidated ? '' : `selectQcmAnswer(${qIdx}, ${optIdx})`}"
            class="text-left py-2.5 px-4 rounded-xl text-xs md:text-sm font-sans font-medium transition-all"
            style="text-align:left;padding:10px 14px;border-radius:12px;font-size:.88rem;border: 2px solid ${border}; background: ${bg}; color:${color}; font-weight:${weight}; cursor: ${qcmValidated ? 'default' : 'pointer'};">${opt}${mark}</button>`;
      });
      html += `
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function selectQcmAnswer(qIdx, optIdx) {
    if (qcmValidated) return;
    qcmAnswers[qIdx] = optIdx;
    document.getElementById('qcm-msg').style.display = 'none';
    const y = window.scrollY;
    renderQCMHtml();
    window.scrollTo(0, y);
  }

  function validateQCM() {
    const now = Date.now();
    if (qcmValidated || now - lastClick < 600) return;
    lastClick = now;
    const manque = qcmAnswers.map((a, i) => a < 0 ? i + 1 : 0).filter(Boolean);
    const msg = document.getElementById('qcm-msg');
    if (manque.length) {
      msg.textContent = manque.length === 1 ? 'Réponds d\'abord à la question ' + manque[0] + '.' : 'Réponds d\'abord à toutes les questions (il en reste ' + manque.length + ').';
      msg.style.display = 'block';
      return;
    }
    msg.style.display = 'none';
    qcmValidated = true;
    const total = qcmActiveQuestions.length;
    let score = 0;
    qcmActiveQuestions.forEach((q, i) => { if (qcmAnswers[i] === q.correct) score++; });
    renderQCMHtml();
    document.getElementById('qcm-validate-btn').style.display = 'none';

    const panel = document.getElementById('qcm-score');
    panel.style.display = 'block';
    const pct = Math.round((score / total) * 100);
    panel.innerHTML = `
      <div class="score-title">${score} / ${total}</div>
      <div class="score-msg">${pct === 100 ? 'Parfait ! 🏆 Un vrai sans faute d\'expert !' : pct >= 70 ? 'Bien joué ! 👍 Tu as de très solides bases.' : 'Recommence pour améliorer ton score ! 💪'}</div>
      ${score < total ? '<div class="score-msg" style="font-size:.85rem;margin-top:4px">Après une erreur, la bonne réponse est en <span style="color:#1f5fbf">bleu</span>.</div>' : ''}
      <button class="btn-3d px-4 py-2 mt-3 bg-white text-slate-800 rounded-xl" style="margin-top:.8rem;padding:.5rem 1rem;background:#fff;border-radius:12px;" onclick="initQCMGame()">🔄 Recommencer</button>
    `;
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    if (!saved) {
      saved = true;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.saveResult === 'function') {
          window.parent.saveResult({
            activity: 'sci_sq_qcm',
            bookTitle: 'Le squelette — QCM de récapitulation',
            score: score, total: total, pct: pct,
            date: new Date().toLocaleDateString('fr-BE'),
            time: new Date().toLocaleTimeString('fr-BE', {hour: '2-digit', minute: '2-digit'})
          });
        }
      } catch (e) {}
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || (e.target && e.target.tagName === 'BUTTON')) return;
    e.preventDefault();
    if (qcmValidated) initQCMGame(); else validateQCM();
  });

  window.onload = initQCMGame;
</script>

</body>
</html>
