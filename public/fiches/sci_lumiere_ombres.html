<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ombres et Lumière — Exercice Scientifique</title>
  
  <!-- Google Fonts: Fredoka & Nunito -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ────────────────────────────────────────────────────────────────
       COMMON & RESET STYLES
       ──────────────────────────────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header styling with Fredoka font */
    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #facc15;
      text-shadow: 0 3px 0 #0f172a;
      letter-spacing: 0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 1.05rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* ────────────────────────────────────────────────────────────────
       FLAT 3D NEOPRAGMATIC LAYOUT
       ──────────────────────────────────────────────────────────────── */
    .grid-container {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 1.5rem;
      width: 100%;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* Flat 3D Card Style */
    .flat-card {
      background-color: #151c2c;
      border: 3px solid #0f172a;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 6px 6px 0px #020617;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: relative;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px dashed #334155;
      padding-bottom: 0.75rem;
    }

    /* ────────────────────────────────────────────────────────────────
       INTERACTIVE SVG LAB ROOM
       ──────────────────────────────────────────────────────────────── */
    .svg-wrapper {
      background-color: #090d16;
      border: 3px solid #0f172a;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      touch-action: none; /* disables default scrolling when dragging on touch devices */
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .flashlight-interactive {
      cursor: grab;
      transition: opacity 0.2s;
    }
    .flashlight-interactive:active {
      cursor: grabbing;
    }

    /* Toggles and Controls */
    .controls-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #1e293b;
      padding: 1rem;
      border: 2px solid #0f172a;
      border-radius: 12px;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    /* Material Toggles (Flat 3D Buttons) */
    .material-toggle {
      display: flex;
      gap: 10px;
    }

    .btn-toggle {
      padding: 8px 14px;
      background-color: #334155;
      color: #94a3b8;
      border: 2px solid #0f172a;
      border-radius: 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 0 #0f172a;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s, color 0.2s;
    }

    .btn-toggle:hover {
      background-color: #475569;
      color: #cbd5e1;
    }

    .btn-toggle.active {
      background-color: #3b82f6;
      color: #ffffff;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0f172a;
    }

    /* Range Slider Styling */
    .slider-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-input {
      flex: 1;
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background-color: #090d16;
      border: 1px solid #334155;
      border-radius: 5px;
      outline: none;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background-color: #facc15;
      border: 2px solid #0f172a;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 0 #0f172a;
      transition: transform 0.1s;
    }

    .range-input::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    /* ────────────────────────────────────────────────────────────────
       QCM CARD & INTERFACE
       ──────────────────────────────────────────────────────────────── */
    .qcm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .qcm-step-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #a855f7;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #0f172a;
      background-color: #334155;
      transition: background-color 0.2s;
    }

    .progress-dot.active {
      background-color: #facc15;
    }

    .progress-dot.correct {
      background-color: #22c55e;
    }

    .progress-dot.incorrect {
      background-color: #ef4444;
    }

    .question-box {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f1f5f9;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background-color: #1e293b;
      color: #f8fafc;
      border: 3px solid #0f172a;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #334155;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0f172a;
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f172a;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .option-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background-color: #334155;
      border: 2px solid #0f172a;
      border-radius: 50%;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #f8fafc;
      flex-shrink: 0;
    }

    /* Answer States */
    .option-btn.correct {
      background-color: #166534 !important;
      border-color: #0f172a;
      color: #ffffff;
    }

    .option-btn.correct .option-letter {
      background-color: #22c55e;
    }

    .option-btn.incorrect {
      background-color: #991b1b !important;
      border-color: #0f172a;
      color: #ffffff;
    }

    .option-btn.incorrect .option-letter {
      background-color: #ef4444;
    }

    .option-btn.neutral-disabled {
      background-color: #0f172a;
      opacity: 0.45;
    }

    /* Explanation & Feedback box */
    .feedback-box {
      border: 3px solid #0f172a;
      border-radius: 14px;
      padding: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-box.correct {
      background-color: rgba(6, 78, 59, 0.6);
      border-color: #059669;
      color: #a7f3d0;
    }

    .feedback-box.incorrect {
      background-color: rgba(127, 29, 29, 0.6);
      border-color: #dc2626;
      color: #fca5a5;
    }

    .feedback-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Action Button (Next / Finish) */
    .action-btn {
      width: 100%;
      padding: 12px;
      background-color: #facc15;
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn:hover {
      background-color: #fde047;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0f172a;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f172a;
    }

    /* ────────────────────────────────────────────────────────────────
       FINAL SCORE SCREEN
       ──────────────────────────────────────────────────────────────── */
    .score-screen {
      display: none;
      text-align: center;
      animation: zoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .big-emoji {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .score-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #facc15;
      text-shadow: 0 4px 0 #0f172a;
      margin: 0.5rem 0;
    }

    .score-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
      padding: 0 1rem;
    }

    .btn-restart {
      padding: 12px 24px;
      background-color: #a855f7;
      color: #ffffff;
      border: 3px solid #0f172a;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #0f172a;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
    }

    .btn-restart:hover {
      background-color: #c084fc;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0f172a;
    }

    .btn-restart:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0f172a;
    }

    /* ────────────────────────────────────────────────────────────────
       CONFETTI SHOWER EFFECT (CSS ONLY)
       ──────────────────────────────────────────────────────────────── */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -15px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall 3s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg) translateX(50px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>💡 Ombres & Lumière</h1>
    <div class="subtitle">Expérimente la propagation rectiligne de la lumière et la formation des ombres</div>
  </header>

  <!-- Main Game Panel -->
  <div class="grid-container" id="main-panel">
    
    <!-- Left Column: Interactive Simulation -->
    <div class="flat-card">
      <div class="card-title">
        <span>🔬 Labo d'Optique</span>
      </div>
      
      <!-- Interactive SVG Chambre Noire -->
      <div class="svg-wrapper" id="svg-wrapper">
        <svg id="sim-svg" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
          
          <!-- Defs for lighting effects and ball textures -->
          <defs>
            <!-- Light beam gradient -->
            <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65" />
              <stop offset="100%" stop-color="#fef08a" stop-opacity="0.1" />
            </linearGradient>
            
            <!-- Wood sphere gradient -->
            <radialGradient id="woodGradient" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#fb923c" />
              <stop offset="60%" stop-color="#d97706" />
              <stop offset="100%" stop-color="#78350f" />
            </radialGradient>
            
            <!-- Glass sphere gradient -->
            <radialGradient id="glassGradient" cx="30%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.5" />
              <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
            </radialGradient>
          </defs>
          
          <!-- Background of the dark room -->
          <rect width="700" height="300" fill="#090d16" />
          
          <!-- Flat 3D Floor Grid -->
          <polygon points="0,240 700,240 700,300 0,300" fill="#0d1424" />
          <line x1="0" y1="240" x2="700" y2="240" stroke="#1e293b" stroke-width="3" />
          
          <!-- ── STATIC WALL/SCREEN ── -->
          <!-- Screen Board (unlit) -->
          <rect x="600" y="30" width="16" height="200" rx="4" fill="#1e293b" stroke="#090d16" stroke-width="2" />
          
          <!-- Illuminated area on the screen -->
          <rect id="lit-screen" x="600" y="30" width="16" height="200" rx="4" fill="#fef08a" opacity="0.9" />
          
          <!-- Shadow area on the screen -->
          <rect id="screen-shadow" x="600" y="100" width="16" height="60" rx="2" fill="#1e293b" />
          
          <!-- ── DYNAMIC LIGHTS & BEAMS ── -->
          <!-- Light Cone Polygon -->
          <polygon id="light-beam" points="115,120 600,20 600,240 115,140" fill="url(#lightGradient)" />
          
          <!-- Shadow Cone Polygon (drawn in dark room background color to hide yellow light) -->
          <polygon id="shadow-cone" points="0,0 0,0 0,0 0,0" fill="#090d16" />
          
          <!-- Ray Lines (Tangent Grazing Rays) -->
          <line id="ray-top" x1="0" y1="0" x2="0" y2="0" stroke="#facc15" stroke-dasharray="6,4" stroke-width="1.5" opacity="0.6" />
          <line id="ray-bottom" x1="0" y1="0" x2="0" y2="0" stroke="#facc15" stroke-dasharray="6,4" stroke-width="1.5" opacity="0.6" />
          
          <!-- ── LAB LABELS ── -->
          <text x="150" y="25" fill="#64748b" font-family="Fredoka" font-size="11" font-weight="600" text-anchor="middle">🔦 SOURCE DE LUMIÈRE</text>
          <text id="obj-label" x="400" y="25" fill="#64748b" font-family="Fredoka" font-size="11" font-weight="600" text-anchor="middle">🪵 OBJET (BALLE EN BOIS)</text>
          <text x="600" y="25" fill="#64748b" font-family="Fredoka" font-size="11" font-weight="600" text-anchor="middle">🧱 ÉCRAN (MUR)</text>
          
          <!-- ── DRAG INSTRUCTIONS ── -->
          <text id="drag-tooltip" x="180" y="275" fill="#94a3b8" font-family="Fredoka" font-size="12" font-weight="500" text-anchor="middle" opacity="0.8">🖱️ Fais glisser la lampe de gauche à droite !</text>
          
          <!-- ── THE OBJECT (BALL) ── -->
          <circle id="ball" cx="400" cy="130" r="25" fill="url(#woodGradient)" stroke="#451a03" stroke-width="2" />
          
          <!-- Glass reflection shine curve overlay -->
          <path id="glass-shine" d="M 385 118 A 20 20 0 0 1 410 112 A 23 23 0 0 0 385 125 Z" fill="#ffffff" opacity="0.75" display="none" pointer-events="none" />
          
          <!-- ── THE SOURCE (FLASHLIGHT) ── -->
          <g id="flashlight" class="flashlight-interactive" transform="translate(200, 130)">
            <!-- Bezel glow outline -->
            <polygon points="12,-16 28,-26 28,26 12,16" fill="#fef08a" opacity="0.35" />
            <!-- Handle -->
            <rect x="-55" y="-9" width="45" height="18" rx="4" fill="#3b4252" stroke="#2e3440" stroke-width="2" />
            <!-- Body -->
            <rect x="-10" y="-13" width="22" height="26" rx="2" fill="#2e3440" stroke="#1c212b" stroke-width="2" />
            <!-- Head / Lens Bezel -->
            <polygon points="-10,-13 15,-22 15,22 -10,13" fill="#434c5e" stroke="#2e3440" stroke-width="2" />
            <!-- Glass Lens -->
            <ellipse cx="15" cy="0" rx="3" ry="21" fill="#fef08a" />
            <!-- Switch -->
            <rect x="-38" y="-13" width="10" height="4" rx="1" fill="#bf616a" />
            <!-- Visual arrows indicators for dragging -->
            <g transform="translate(-25, -28)" opacity="0.8">
              <circle cx="0" cy="0" r="10" fill="#facc15" stroke="#0f172a" stroke-width="1.5" />
              <path d="M-6,0 L6,0 M-3,-3 L-6,0 L-3,3 M3,-3 L6,0 L3,3" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </g>
          
        </svg>
      </div>

      <!-- Controls Panel -->
      <div class="controls-group">
        <div class="control-row">
          <span class="control-label">Type d'objet sur le support :</span>
          <div class="material-toggle">
            <button class="btn-toggle active" id="btn-material-wood" onclick="toggleMaterial('wood')">🪵 Bois (Opaque)</button>
            <button class="btn-toggle" id="btn-material-glass" onclick="toggleMaterial('glass')">💎 Verre (Transparent)</button>
          </div>
        </div>
        
        <div class="slider-container">
          <span class="control-label">Distance :</span>
          <input type="range" class="range-input" id="light-slider" min="80" max="300" value="200" oninput="onSliderChange(this.value)">
        </div>
      </div>
      
    </div>
    
    <!-- Right Column: Interactive Quiz -->
    <div class="flat-card" id="quiz-card">
      <div class="qcm-header">
        <span class="qcm-step-title" id="qcm-step-title">Question 1 sur 4</span>
        <div class="progress-dots" id="progress-dots">
          <!-- Dots dynamically rendered -->
        </div>
      </div>
      
      <!-- Question Section -->
      <div class="question-box" id="question-text">
        <!-- Text dynamically updated -->
      </div>
      
      <!-- Options Button List -->
      <div class="options-list" id="options-container">
        <!-- Options dynamically rendered -->
      </div>
      
      <!-- Feedback Alert Box -->
      <div class="feedback-box" id="feedback-box">
        <div class="feedback-title" id="feedback-title"></div>
        <div id="feedback-explanation"></div>
      </div>
      
      <!-- Next/Finish Button -->
      <button class="action-btn" id="btn-action" style="display: none;" onclick="onActionButtonClick()">
        <span id="btn-action-text">Valider</span>
        <span>👉</span>
      </button>
      
    </div>

    <!-- Final Score Screen (Hidden initially) -->
    <div class="flat-card score-screen" id="score-card">
      <div class="big-emoji" id="final-emoji">🏆</div>
      <h1>Activité terminée !</h1>
      <div class="score-badge" id="final-score-badge">4 / 4</div>
      <div class="score-text" id="final-details-text">
        Félicitations ! Tu as réussi avec brio toutes les épreuves scientifiques sur les ombres !
      </div>
      <div>
        <button class="btn-restart" onclick="restartExercise()">🔄 Recommencer l'activité</button>
      </div>
    </div>

  </div>

</div>

<script>
  // ────────────────────────────────────────────────────────────────
  // EXERCISE STATE & QUESTIONS DATABASE
  // ────────────────────────────────────────────────────────────────
  const questions = [
    {
      num: 1,
      text: "Plus la source de lumière est proche de l'objet, plus l'ombre sur l'écran est...",
      options: [
        { text: "Grande", correct: true, letter: "A" },
        { text: "Petite", correct: false, letter: "B" },
        { text: "Identique", correct: false, letter: "C" }
      ],
      explanation: "En rapprochant la lampe de l'objet, l'angle des rayons lumineux qui contournent la balle s'élargit. Par conséquent, l'ombre projetée sur le mur s'agrandit."
    },
    {
      num: 2,
      text: "Comment se propage la lumière dans l'air ?",
      options: [
        { text: "En ligne droite", correct: true, letter: "A" },
        { text: "En courbes", correct: false, letter: "B" },
        { text: "En zigzag", correct: false, letter: "C" }
      ],
      explanation: "La lumière se propage toujours en ligne droite (propagation rectiligne) dans un milieu homogène et transparent comme l'air. C'est ce qui explique la forme nette et géométrique de l'ombre."
    },
    {
      num: 3,
      text: "Un objet qui ne laisse pas passer la lumière et à travers lequel on ne voit rien est dit...",
      options: [
        { text: "Opaque", correct: true, letter: "A" },
        { text: "Transparent", correct: false, letter: "B" },
        { text: "Translucide", correct: false, letter: "C" }
      ],
      explanation: "Un objet opaque (comme le bois) arrête complètement la lumière. Un objet transparent (comme le verre) la laisse passer sans la bloquer, tandis qu'un objet translucide (comme le papier calque) laisse passer la lumière mais diffuse les rayons, empêchant de voir nettement à travers."
    },
    {
      num: 4,
      text: "Si je remplace la balle en bois par une balle en verre transparent, qu'advient-il de l'ombre ?",
      options: [
        { text: "Elle disparaît ou devient presque invisible", correct: true, letter: "A" },
        { text: "Elle reste identique", correct: false, letter: "B" },
        { text: "Elle devient plus noire", correct: false, letter: "C" }
      ],
      explanation: "La balle en verre transparent laisse passer la lumière. Les rayons lumineux la traversent donc pour atteindre l'écran, ce qui fait disparaître l'ombre projetée (ou la rend presque invisible)."
    }
  ];

  let currentQuestionIdx = 0;
  let score = 0;
  let userAnswers = []; // records boolean true/false for each step
  let selectedOptionIdx = null;
  let questionAnswered = false;
  let ballMaterial = 'wood'; // 'wood' or 'glass'
  
  // ────────────────────────────────────────────────────────────────
  // WEB AUDIO SYNTHESIZER (Web Audio API)
  // ────────────────────────────────────────────────────────────────
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    try {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'success_step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'success_final') {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);

        osc.type = 'triangle';
        osc2.type = 'sine';

        const freqs = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        const step = 0.07;

        freqs.forEach((f, i) => {
          osc.frequency.setValueAtTime(f, now + i * step);
          osc2.frequency.setValueAtTime(f * 1.5, now + i * step);
        });

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.setValueAtTime(0.15, now + freqs.length * step);
        gain.gain.exponentialRampToValueAtTime(0.001, now + freqs.length * step + 0.6);

        gain2.gain.setValueAtTime(0.06, now);
        gain2.gain.setValueAtTime(0.08, now + freqs.length * step);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + freqs.length * step + 0.6);

        osc.start(now);
        osc.stop(now + freqs.length * step + 0.6);
        osc2.start(now);
        osc2.stop(now + freqs.length * step + 0.6);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.28);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      }
    } catch (e) {
      console.warn("Audio synthesis error:", e);
    }
  }

  // ────────────────────────────────────────────────────────────────
  // SVG SIMULATION GEOMETRY CALCULATIONS
  // ────────────────────────────────────────────────────────────────
  const x_ball = 400;
  const y_ball = 130;
  const r_ball = 25;
  const x_screen = 600;

  function updateSimulation(x_light) {
    const flashlight = document.getElementById('flashlight');
    flashlight.setAttribute('transform', `translate(${x_light}, 130)`);
    
    // 1. Update yellow light beam cone coordinates
    const lightBeam = document.getElementById('light-beam');
    // Front aperture points of flashlight (lens at x_light + 15, height +/- 21)
    lightBeam.setAttribute('points', `${x_light + 15},109 600,20 600,240 ${x_light + 15},151`);
    
    const shadowCone = document.getElementById('shadow-cone');
    const screenShadow = document.getElementById('screen-shadow');
    const rayTop = document.getElementById('ray-top');
    const rayBottom = document.getElementById('ray-bottom');
    
    if (ballMaterial === 'wood') {
      // Show shadows and rays
      shadowCone.setAttribute('display', 'block');
      screenShadow.setAttribute('display', 'block');
      rayTop.setAttribute('display', 'block');
      rayBottom.setAttribute('display', 'block');
      
      const d = x_ball - x_light;
      const L = Math.sqrt(d * d - r_ball * r_ball);
      
      // Compute tangent coordinates on the ball
      const x_tan_top = x_ball - (r_ball * r_ball) / d;
      const y_tan_top = y_ball - (r_ball * L) / d;
      const x_tan_bottom = x_ball - (r_ball * r_ball) / d;
      const y_tan_bottom = y_ball + (r_ball * L) / d;
      
      // Compute project coordinates on the screen wall
      const y_shadow_top = y_ball - (x_screen - x_light) * (r_ball / L);
      const y_shadow_bottom = y_ball + (x_screen - x_light) * (r_ball / L);
      
      // Update SVG Shadow Cone behind the ball
      shadowCone.setAttribute('points', `${x_tan_top},${y_tan_top} ${x_screen},${y_shadow_top} ${x_screen},${y_shadow_bottom} ${x_tan_bottom},${y_tan_bottom}`);
      
      // Update screen shadow rectangle
      screenShadow.setAttribute('y', y_shadow_top);
      screenShadow.setAttribute('height', y_shadow_bottom - y_shadow_top);
      
      // Update light rays
      rayTop.setAttribute('x1', x_light);
      rayTop.setAttribute('y1', y_ball);
      rayTop.setAttribute('x2', x_screen);
      rayTop.setAttribute('y2', y_shadow_top);
      
      rayBottom.setAttribute('x1', x_light);
      rayBottom.setAttribute('y1', y_ball);
      rayBottom.setAttribute('x2', x_screen);
      rayBottom.setAttribute('y2', y_shadow_bottom);
      
    } else {
      // Glass material: Light propagates straight without shadows
      shadowCone.setAttribute('none', 'none'); // Trigger redraw
      shadowCone.setAttribute('display', 'none');
      screenShadow.setAttribute('display', 'none');
      rayTop.setAttribute('display', 'none');
      rayBottom.setAttribute('display', 'none');
    }
  }

  // Handle manual input of the horizontal range slider
  function onSliderChange(val) {
    updateSimulation(parseInt(val));
  }

  // Toggle Wood Opaque vs Glass Transparent Ball
  function toggleMaterial(material) {
    playSound('click');
    ballMaterial = material;
    
    const btnWood = document.getElementById('btn-material-wood');
    const btnGlass = document.getElementById('btn-material-glass');
    const ballElement = document.getElementById('ball');
    const glassShine = document.getElementById('glass-shine');
    const objLabel = document.getElementById('obj-label');
    
    if (material === 'wood') {
      btnWood.classList.add('active');
      btnGlass.classList.remove('active');
      ballElement.setAttribute('fill', 'url(#woodGradient)');
      ballElement.setAttribute('stroke', '#451a03');
      glassShine.setAttribute('display', 'none');
      objLabel.textContent = '🪵 OBJET (BALLE EN BOIS)';
    } else {
      btnWood.classList.remove('active');
      btnGlass.classList.add('active');
      ballElement.setAttribute('fill', 'url(#glassGradient)');
      ballElement.setAttribute('stroke', '#bae6fd');
      glassShine.setAttribute('display', 'block');
      objLabel.textContent = '💎 OBJET (BALLE EN VERRE)';
    }
    
    // Refresh simulation coordinates
    const slider = document.getElementById('light-slider');
    updateSimulation(parseInt(slider.value));
  }

  // ────────────────────────────────────────────────────────────────
  // SVG DRAG AND DROP MECHANICS
  // ────────────────────────────────────────────────────────────────
  let dragging = false;
  const flashlightG = document.getElementById('flashlight');
  const slider = document.getElementById('light-slider');
  const svgEl = document.getElementById('sim-svg');
  const tooltipText = document.getElementById('drag-tooltip');

  flashlightG.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', drag);
  window.addEventListener('mouseup', stopDrag);

  flashlightG.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('touchmove', drag, { passive: false });
  window.addEventListener('touchend', stopDrag);

  function startDrag(e) {
    initAudio();
    dragging = true;
    playSound('click');
    tooltipText.setAttribute('opacity', '0'); // Hide tooltip when active dragging starts
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }

  function drag(e) {
    if (!dragging) return;
    
    const rect = svgEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    
    // Translate screen mouse X to SVG coordinate space (box scale 700px width)
    const svgX = ((clientX - rect.left) / rect.width) * 700;
    
    // Constrain flashlight range horizontally to [80, 300]
    let newX = Math.round(svgX);
    if (newX < 80) newX = 80;
    if (newX > 300) newX = 300;
    
    // Update slider position & simulation
    slider.value = newX;
    updateSimulation(newX);
    
    e.preventDefault();
  }

  function stopDrag() {
    if (dragging) {
      dragging = false;
      document.body.style.userSelect = '';
    }
  }

  // ────────────────────────────────────────────────────────────────
  // QUIZ CONTROL & SYSTEM LOGIC
  // ────────────────────────────────────────────────────────────────
  
  function initQuiz() {
    currentQuestionIdx = 0;
    score = 0;
    userAnswers = [];
    renderQuestion();
    renderProgressDots();
  }

  function renderProgressDots() {
    const dotsContainer = document.getElementById('progress-dots');
    dotsContainer.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'progress-dot';
      if (i === currentQuestionIdx) {
        dot.classList.add('active');
      } else if (i < userAnswers.length) {
        dot.classList.add(userAnswers[i] ? 'correct' : 'incorrect');
      }
      dotsContainer.appendChild(dot);
    }
  }

  function renderQuestion() {
    questionAnswered = false;
    selectedOptionIdx = null;
    
    const q = questions[currentQuestionIdx];
    document.getElementById('qcm-step-title').textContent = `Question ${q.num} sur ${questions.length}`;
    document.getElementById('question-text').textContent = q.text;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.onclick = () => selectOption(idx);
      
      const letter = document.createElement('span');
      letter.className = 'option-letter';
      letter.textContent = opt.letter;
      
      const text = document.createElement('span');
      text.textContent = opt.text;
      
      btn.appendChild(letter);
      btn.appendChild(text);
      optionsContainer.appendChild(btn);
    });
    
    // Hide Action button & feedback box initially
    document.getElementById('btn-action').style.display = 'none';
    document.getElementById('feedback-box').style.display = 'none';
  }

  function selectOption(idx) {
    if (questionAnswered) return;
    
    playSound('click');
    selectedOptionIdx = idx;
    
    // Visually toggle focus on option buttons
    const optionsContainer = document.getElementById('options-container');
    const buttons = optionsContainer.getElementsByClassName('option-btn');
    
    for (let i = 0; i < buttons.length; i++) {
      if (i === idx) {
        buttons[i].style.backgroundColor = '#334155';
        buttons[i].style.borderColor = '#3b82f6';
      } else {
        buttons[i].style.backgroundColor = '#1e293b';
        buttons[i].style.borderColor = '#0f172a';
      }
    }
    
    // Display validate button
    const btnAction = document.getElementById('btn-action');
    document.getElementById('btn-action-text').textContent = "Valider";
    btnAction.style.display = 'flex';
  }

  function onActionButtonClick() {
    if (!questionAnswered) {
      validateAnswer();
    } else {
      nextQuestion();
    }
  }

  function validateAnswer() {
    questionAnswered = true;
    
    const q = questions[currentQuestionIdx];
    const isCorrect = q.options[selectedOptionIdx].correct;
    
    if (isCorrect) {
      score++;
      userAnswers.push(true);
      playSound('success_step');
    } else {
      userAnswers.push(false);
      playSound('error');
    }
    
    // Update progress dots instantly
    renderProgressDots();
    
    // Disable all options and show colors
    const optionsContainer = document.getElementById('options-container');
    const buttons = optionsContainer.getElementsByClassName('option-btn');
    
    q.options.forEach((opt, idx) => {
      buttons[idx].disabled = true;
      if (opt.correct) {
        buttons[idx].className = 'option-btn correct';
      } else if (idx === selectedOptionIdx) {
        buttons[idx].className = 'option-btn incorrect';
      } else {
        buttons[idx].className = 'option-btn neutral-disabled';
      }
    });
    
    // Render Explanation Box
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackExplanation = document.getElementById('feedback-explanation');
    
    feedbackBox.style.display = 'block';
    if (isCorrect) {
      feedbackBox.className = 'feedback-box correct';
      feedbackTitle.innerHTML = '✨ Correct ! Excellent travail';
    } else {
      feedbackBox.className = 'feedback-box incorrect';
      feedbackTitle.innerHTML = '❌ Oups, ce n\'est pas tout à fait ça';
    }
    feedbackExplanation.textContent = q.explanation;
    
    // Update action button for navigation
    const isLast = currentQuestionIdx === questions.length - 1;
    document.getElementById('btn-action-text').textContent = isLast ? "Voir mon résultat" : "Question suivante";
  }

  function nextQuestion() {
    if (currentQuestionIdx < questions.length - 1) {
      currentQuestionIdx++;
      renderQuestion();
      renderProgressDots();
    } else {
      showFinalScore();
    }
  }

  function showFinalScore() {
    // Hide active play components
    document.getElementById('quiz-card').style.display = 'none';
    
    const scoreCard = document.getElementById('score-card');
    scoreCard.style.display = 'block';
    
    const percent = Math.round((score / questions.length) * 100);
    document.getElementById('final-score-badge').textContent = `${score} / ${questions.length}`;
    
    const emojiEl = document.getElementById('final-emoji');
    const detailsEl = document.getElementById('final-details-text');
    
    if (score === questions.length) {
      emojiEl.textContent = '🏆';
      detailsEl.innerHTML = "Félicitations ! Tu as résolu correctement toutes les étapes de l'exercice. Tu es un vrai scientifique de la lumière ! 🌟";
      // Perfect score confettis
      playSound('success_final');
      triggerConfettiShower();
    } else if (score >= 2) {
      emojiEl.textContent = '👏';
      detailsEl.innerHTML = `Pas mal du tout ! Tu as obtenu un score de <strong>${percent}%</strong>. Recommence l'activité pour obtenir le score parfait de 4/4 !`;
      playSound('success_step');
    } else {
      emojiEl.textContent = '💪';
      detailsEl.innerHTML = `Tu as obtenu un score de ${score}/${questions.length}. Relis bien les explications et essaye à nouveau, tu vas y arriver !`;
      playSound('error');
    }
    
    // Persist result on the school server
    if (window.parent && window.parent.saveResult) {
      window.parent.saveResult({
        activity: 'sci_lumiere_ombres',
        bookTitle: "Sciences — Ombres et Lumière",
        score: score,
        total: questions.length,
        pct: percent,
        date: new Date().toLocaleDateString('fr-BE'),
        time: new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })
      });
    }
  }

  function restartExercise() {
    playSound('click');
    
    // Show play elements
    document.getElementById('quiz-card').style.display = 'flex';
    document.getElementById('score-card').style.display = 'none';
    
    // Reset simulation
    toggleMaterial('wood');
    const slider = document.getElementById('light-slider');
    slider.value = 200;
    updateSimulation(200);
    
    // Re-initialize quiz database
    initQuiz();
  }

  // ────────────────────────────────────────────────────────────────
  // CSS CONFETTI SHOWER GENERATOR
  // ────────────────────────────────────────────────────────────────
  function triggerConfettiShower() {
    const colors = ['#facc15', '#38bdf8', '#a855f7', '#22c55e', '#ec4899', '#f43f5e', '#fb923c'];
    const totalConfettiCount = 100;
    
    for (let i = 0; i < totalConfettiCount; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDelay = Math.random() * 1.8 + 's';
      
      // Randomized sizes and speeds
      const sizeVal = Math.random() * 6 + 6;
      confetti.style.width = sizeVal + 'px';
      confetti.style.height = sizeVal + 'px';
      confetti.style.transform = `scale(${Math.random() * 0.8 + 0.4})`;
      confetti.style.animationDuration = Math.random() * 2 + 1.8 + 's';
      
      document.body.appendChild(confetti);
      
      // Auto cleanup elements to prevent DOM leakage
      setTimeout(() => {
        confetti.remove();
      }, 4000);
    }
  }

  // ────────────────────────────────────────────────────────────────
  // WINDOW LOAD
  // ────────────────────────────────────────────────────────────────
  window.onload = () => {
    // Initialise simulation to center
    updateSimulation(200);
    initQuiz();
    
    // Auto-adjust paths for stand-alone mode inside subfolders
    if (window.location.pathname.includes('/fiches/')) {
      document.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('../') && !src.startsWith('/') && !src.startsWith('data:')) {
          img.setAttribute('src', '../' + src);
        }
      });
    }
  };
</script>
