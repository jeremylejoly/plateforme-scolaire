<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le trajet de l'air — dans l'ordre</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:wght@300..800&family=Nunito:wght@300..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #EEF0FF;
      --purple-mid: #C7C2F5;
      --green: #1A9E75;
      --green-light: #E2F5EE;
      --red: #D94F3D;
      --red-light: #FDECEA;
      --amber: #C97B1A;
      --amber-light: #FEF3E2;
      --bg: #FDFBF7;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --muted: #6B7080;
      --border: #1A1A2E;
      --r: 14px;
      --rsm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .card {
      background: var(--surface);
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--border);
      border-radius: var(--r);
      padding: 2rem;
      max-width: 680px;
      width: 100%;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .instr {
      border: 2px solid var(--purple-mid);
      background: var(--purple-light);
      border-radius: var(--rsm);
      padding: 0.8rem 1.2rem;
      color: var(--purple);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .step-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0;
    }

    .step-num {
      min-width: 32px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--purple);
      font-family: 'Fredoka', sans-serif;
      text-align: right;
      flex-shrink: 0;
    }

    .given-card {
      flex: 1;
      background: var(--green-light);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      border-radius: var(--rsm);
      padding: 0.75rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Nunito', sans-serif;
    }

    .given-badge {
      background: var(--green);
      color: white;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .drag-card {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      border-radius: var(--rsm);
      padding: 0.75rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
      transition: opacity 0.15s, border-color 0.15s, background-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .drag-card:active { cursor: grabbing; }
    .drag-card.dragging { opacity: 0.3; }
    
    .drag-card.card-correct {
      border-color: var(--green);
      background: var(--green-light);
      color: #166534;
      box-shadow: 2px 2px 0px var(--green);
    }
    .drag-card.card-wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: #991b1b;
      box-shadow: 2px 2px 0px var(--red);
    }

    .drag-handle {
      color: var(--muted);
      font-size: 1.2rem;
      flex-shrink: 0;
      font-weight: bold;
    }

    .insert-line {
      height: 4px;
      border-radius: 2px;
      background: var(--purple);
      margin-left: 44px;
      display: none;
    }
    .insert-line.visible { display: block; margin-top: 4px; margin-bottom: 4px; }

    .btn-verify {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border-radius: var(--r);
      border: 3px solid var(--border);
      background: var(--purple);
      color: white;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border);
      transition: all 0.15s ease;
    }
    .btn-verify:hover {
      background: #4a3fb8;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--border);
    }
    .btn-verify:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px var(--border);
    }

    .btn-reset {
      width: 100%;
      margin-top: 12px;
      padding: 0.6rem;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border-radius: var(--r);
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border);
      transition: all 0.15s ease;
    }
    .btn-reset:hover {
      background: var(--bg);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }
    .btn-reset:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border);
    }

    .result-msg {
      margin-top: 1.5rem;
      padding: 22px;
      border-radius: var(--r);
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0px var(--border);
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      display: none;
    }
    .result-msg.success {
      display: block;
      background: var(--green-light);
      border-color: var(--green);
      box-shadow: 6px 6px 0px var(--green);
      color: #166534;
    }
    .drag-card.selected { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .drag-card.locked { cursor: default; }
    .fix { display:block; margin-top:4px; font-size:0.85rem; font-weight:800; color:#1f5fbf; }
    .msg-info { display:none; margin-top:1rem; padding:.6rem .9rem; border-radius:8px; background:#fff7ed; border:1.5px solid #f59e0b; color:#92400e; font-size:.9rem; font-weight:700; text-align:center; }
    @media (max-width: 480px) {
      body { padding: 1rem .5rem; }
      .card { padding: 1.1rem .9rem; box-shadow: 4px 4px 0px var(--border); }
      h1 { font-size: 1.3rem; gap: 8px; }
      .step-row { gap: 8px; }
      .step-num { min-width: 24px; font-size: 1rem; }
      .drag-card, .given-card { padding: .6rem .7rem; font-size: .9rem; gap: 8px; }
      .insert-line { margin-left: 32px; }
    }
    .result-msg.partial {
      display: block;
      background: var(--amber-light);
      border-color: var(--amber);
      box-shadow: 6px 6px 0px var(--amber);
      color: #7a5000;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🫁 Le trajet de l'air — dans l'ordre</h1>
  <div class="instr">Remets les étapes du trajet de l'air dans le bon ordre : fais-les glisser, ou touche une étape puis l'endroit où elle doit aller.</div>

  <div class="step-row">
    <div class="step-num">1.</div>
    <div class="given-card">
      <div class="given-badge">1</div>
      L'air entre par le nez ou la bouche
    </div>
  </div>

  <div id="list-container"></div>

  <button class="btn-verify" id="btn-verify" onclick="verify()">✅ Vérifier l'ordre</button>
  <button class="btn-reset" id="btn-reset" onclick="init()">↺ Mélanger à nouveau</button>
  <div class="result-msg" id="result"></div>
</div>

<script>
  const STEPS = [
    "L'air passe par la gorge (pharynx, puis larynx)",
    "L'air descend dans la trachée",
    "L'air passe dans les deux bronches, une pour chaque poumon",
    "L'air circule dans les bronchioles, de plus en plus fines",
    "L'air arrive dans les alvéoles pulmonaires",
    "Dans les alvéoles, l'oxygène passe dans le sang et le dioxyde de carbone passe du sang dans l'air",
    "L'air chargé de dioxyde de carbone remonte par les bronchioles, les bronches et la trachée",
    "L'air sort par le nez ou la bouche"
  ];
  const N = STEPS.length;

  let order = [];
  let dragSrcIdx = null;
  let insertIdx = null;
  let highlights = null;
  let done = false, saved = false, lastClick = 0, sel = null;

  // Touch state
  let touchStartIdx = null;
  let touchActiveEl = null;
  let touchClone = null;
  let touchInsertIdx = null;
  let touchX = 0, touchY = 0, touchMoved = false;

  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      let j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    // jamais déjà (presque) en ordre : au moins la moitié des étapes déplacées
    if (a.filter((v, i) => v === arr[i]).length > Math.floor(arr.length / 2) - 1) return shuffle(arr);
    return a;
  }

  function init() {
    order = shuffle(STEPS);
    highlights = null; done = false; saved = false; sel = null;
    document.getElementById('result').style.display = 'none';
    document.getElementById('result').className = 'result-msg';
    document.getElementById('btn-verify').style.display = '';
    document.getElementById('btn-reset').textContent = '↺ Mélanger à nouveau';
    render();
  }

  function moveItem(from, insertBefore) {
    if (insertBefore === from || insertBefore === from + 1) return false;
    const item = order.splice(from, 1)[0];
    order.splice(insertBefore > from ? insertBefore - 1 : insertBefore, 0, item);
    return true;
  }

  function cardClick(i) {
    if (done) return;
    if (sel === null) { sel = i; render(); return; }
    if (sel === i) { sel = null; render(); return; }
    // l'étape choisie prend la place de l'étape touchée
    const item = order.splice(sel, 1)[0];
    order.splice(i, 0, item);
    sel = null;
    render();
  }

  function render() {
    const old = document.getElementById('list-container');
    const container = old.cloneNode(false); // nouveau conteneur = pas d'écouteurs empilés
    old.replaceWith(container);

    order.forEach((text, i) => {
      const line = document.createElement('div');
      line.className = 'insert-line';
      line.dataset.insertBefore = i;
      container.appendChild(line);

      const row = document.createElement('div');
      row.className = 'step-row';
      row.dataset.idx = i;

      const num = document.createElement('div');
      num.className = 'step-num';
      num.textContent = (i + 2) + '.';

      const card = document.createElement('div');
      card.className = 'drag-card';
      if (highlights) card.classList.add(highlights[i] ? 'card-correct' : 'card-wrong', 'locked');
      if (sel === i) card.classList.add('selected');
      card.draggable = !done;
      card.dataset.idx = i;
      card.innerHTML = done
        ? `<span>${highlights[i] ? '✅ ' : '❌ '}${text}${highlights[i] ? '' : `<span class="fix">➜ ${STEPS[i]}</span>`}</span>`
        : `<span class="drag-handle">☰</span><span>${text}</span>`;

      if (!done) {
        card.addEventListener('dragstart', e => {
          dragSrcIdx = i;
          insertIdx = null;
          sel = null;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(i));
          setTimeout(() => card.classList.add('dragging'), 0);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          clearInsertLines();
          dragSrcIdx = null;
          insertIdx = null;
        });
        card.addEventListener('click', () => cardClick(i));
        card.addEventListener('touchstart', handleTouchStart, { passive: false });
        card.addEventListener('touchmove', handleTouchMove, { passive: false });
        card.addEventListener('touchend', handleTouchEnd, { passive: false });
        card.addEventListener('touchcancel', handleTouchCancel);
      }

      row.appendChild(num);
      row.appendChild(card);
      container.appendChild(row);
    });

    const lastLine = document.createElement('div');
    lastLine.className = 'insert-line';
    lastLine.dataset.insertBefore = order.length;
    container.appendChild(lastLine);

    if (done) return;
    container.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrcIdx === null) return;
      e.dataTransfer.dropEffect = 'move';
      const newInsert = insertFromY(e.clientY);
      if (newInsert !== insertIdx) { insertIdx = newInsert; showInsertLine(insertIdx); }
    });
    container.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrcIdx === null || insertIdx === null) return;
      moveItem(dragSrcIdx, insertIdx);
      clearInsertLines();
      dragSrcIdx = null;
      insertIdx = null;
      render();
    });
    container.addEventListener('dragleave', e => {
      if (!container.contains(e.relatedTarget)) { clearInsertLines(); insertIdx = null; }
    });
  }

  function insertFromY(y) {
    const rows = [...document.querySelectorAll('#list-container .step-row')];
    for (let j = 0; j < rows.length; j++) {
      const rect = rows[j].getBoundingClientRect();
      if (y < rect.top + rect.height / 2) return j;
    }
    return order.length;
  }

  // Toucher : glisser pour déplacer, ou simple toucher pour sélectionner
  function handleTouchStart(e) {
    if (done) return;
    const card = e.currentTarget;
    touchStartIdx = parseInt(card.dataset.idx);
    touchActiveEl = card;
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY; touchMoved = false; touchInsertIdx = null;
  }

  function handleTouchMove(e) {
    if (touchActiveEl === null) return;
    const t = e.touches[0];
    if (!touchMoved && Math.abs(t.clientX - touchX) < 8 && Math.abs(t.clientY - touchY) < 8) return;
    e.preventDefault();
    if (!touchMoved) {
      touchMoved = true; sel = null;
      touchActiveEl.classList.remove('selected');
      touchClone = touchActiveEl.cloneNode(true);
      touchClone.style.position = 'fixed';
      touchClone.style.zIndex = '9999';
      touchClone.style.width = touchActiveEl.offsetWidth + 'px';
      touchClone.style.opacity = '0.9';
      touchClone.style.pointerEvents = 'none';
      document.body.appendChild(touchClone);
      touchActiveEl.classList.add('dragging');
    }
    touchClone.style.left = (t.clientX - touchClone.offsetWidth / 2) + 'px';
    touchClone.style.top = (t.clientY - 20) + 'px';
    const newInsert = insertFromY(t.clientY);
    if (newInsert !== touchInsertIdx) { touchInsertIdx = newInsert; showInsertLine(touchInsertIdx); }
  }

  function handleTouchEnd(e) {
    if (touchActiveEl === null) return;
    if (!touchMoved) { touchActiveEl = null; return; } // simple toucher → l'événement click gère la sélection
    e.preventDefault();
    if (touchClone) { touchClone.remove(); touchClone = null; }
    touchActiveEl.classList.remove('dragging');
    clearInsertLines();
    if (touchInsertIdx !== null) moveItem(touchStartIdx, touchInsertIdx);
    touchStartIdx = null; touchActiveEl = null; touchInsertIdx = null;
    render();
  }

  function handleTouchCancel() {
    if (touchClone) { touchClone.remove(); touchClone = null; }
    if (touchActiveEl) touchActiveEl.classList.remove('dragging');
    clearInsertLines();
    touchStartIdx = null; touchActiveEl = null; touchInsertIdx = null;
  }

  function showInsertLine(idx) {
    const lines = document.querySelectorAll('#list-container .insert-line');
    lines.forEach(l => l.classList.remove('visible'));
    if (lines[idx]) lines[idx].classList.add('visible');
  }

  function clearInsertLines() {
    document.querySelectorAll('.insert-line').forEach(l => l.classList.remove('visible'));
  }

  function verify() {
    const now = Date.now();
    if (done || now - lastClick < 600) return;
    lastClick = now;
    done = true; sel = null;
    highlights = order.map((text, i) => text === STEPS[i]);
    render();
    const correct = highlights.filter(Boolean).length;
    const pct = Math.round(correct / N * 100);
    const msg = document.getElementById('result');
    if (correct === N) {
      msg.className = 'result-msg success';
      msg.innerHTML = '🎉 Bravo ! Toutes les étapes sont dans le bon ordre !';
    } else {
      msg.className = 'result-msg partial';
      msg.innerHTML = `${correct}/${N} étapes à la bonne place.<br><span style="font-size:1rem">La bonne étape est écrite en <span style="color:#1f5fbf">bleu</span> sous chaque case rouge.</span>`;
    }
    msg.style.display = 'block';
    document.getElementById('btn-verify').style.display = 'none';
    document.getElementById('btn-reset').textContent = '🔄 Recommencer';

    if (!saved) {
      saved = true;
      try {
        if (window.parent && window.parent !== window && typeof window.parent.saveResult === 'function') {
          window.parent.saveResult({
            activity: 'sci_resp_ordre',
            bookTitle: "Respiratoire — Remettre dans l'ordre",
            score: correct,
            total: N,
            pct: pct,
            date: new Date().toLocaleDateString('fr-BE'),
            time: new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })
          });
        }
      } catch (e) {}
    }
    msg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (done) init(); else verify();
  });

  init();
</script>
</body>
</html>
