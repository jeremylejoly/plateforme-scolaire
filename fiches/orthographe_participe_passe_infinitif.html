<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Du verbe à l'infinitif au participe passé</title>
  <style>
    :root {
      --bg: #f8fafc; --foreground: #0f172a; --primary: #8b5cf6; --primary-hover: #7c3aed;
      --border-color: #0f172a; --card-bg: #ffffff; --shadow-color: #000000;
      --accent-red: #ef4444; --accent-green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', 'Outfit', sans-serif; }
    body { background-color: var(--bg); color: var(--foreground); padding: 1.5rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .game-container { width: 100%; max-width: 600px; background-color: var(--card-bg); border: 4px solid var(--border-color); border-radius: 24px; padding: 2rem; box-shadow: 8px 8px 0px var(--shadow-color); text-align: center; }
    .game-title { font-size: 2rem; font-weight: 900; color: var(--primary); margin-bottom: 1rem; }
    .verb-display { font-size: 3rem; font-weight: bold; margin: 2rem 0; color: var(--border-color); }
    .input-box { width: 100%; font-size: 2rem; padding: 1rem; border: 4px solid var(--border-color); border-radius: 12px; text-align: center; margin-bottom: 1rem; }
    .btn { width: 100%; padding: 1rem; font-size: 1.5rem; font-weight: 800; background-color: var(--primary); color: white; border: 4px solid var(--border-color); border-radius: 12px; cursor: pointer; box-shadow: 4px 4px 0px var(--shadow-color); transition: 0.2s; }
    .btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px var(--shadow-color); }
    .feedback { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; min-height: 2rem; }
    .error { color: var(--accent-red); }
    .success { color: var(--accent-green); }
    .progress { font-weight: bold; margin-bottom: 1rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-title">✍️ Du verbe à l'infinitif au participe passé</div>
    <div style="font-size:1.05rem;color:#475569;margin-bottom:1rem;"><strong>Consigne :</strong> voici un verbe à l'infinitif. Écris son <strong>participe passé</strong> (au masculin singulier).</div>
    <div class="progress" id="progress">Verbe 1 / 10</div>
    <div class="verb-display" id="verb"></div>
    <input type="text" id="answer" class="input-box" placeholder="Participe passé..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="feedback" id="feedback"></div>
    <button class="btn" id="btn" onclick="checkAnswer()">Valider</button>
  </div>

  <script>
    const verbsBank = {
      // 1er groupe (10 verbes)
      "aimer":"aimé", "chanter":"chanté", "donner":"donné", "trouver":"trouvé", "passer":"passé",
      "commencer":"commencé", "appeler":"appelé", "jeter":"jeté", "acheter":"acheté", "manger":"mangé",
      
      // 2ème groupe
      "finir":"fini", "choisir":"choisi", "grandir":"grandi", "réussir":"réussi", "rougir":"rougi",
      "obéir":"obéi", "agir":"agi", "punir":"puni", "remplir":"rempli", "franchir":"franchi",
      "nourrir":"nourri", "fournir":"fourni", "saisir":"saisi", "blanchir":"blanchi", "ralentir":"ralenti",
      
      // 3ème groupe
      "aller":"allé", "faire":"fait", "dire":"dit", "prendre":"pris", "mettre":"mis", "voir":"vu",
      "pouvoir":"pu", "vouloir":"voulu", "devoir":"dû", "savoir":"su", "venir":"venu", "tenir":"tenu",
      "lire":"lu", "boire":"bu", "croire":"cru", "attendre":"attendu", "répondre":"répondu", 
      "entendre":"entendu", "perdre":"perdu", "écrire":"écrit", "conduire":"conduit", "construire":"construit",
      "peindre":"peint", "craindre":"craint", "éteindre":"éteint", "ouvrir":"ouvert", "offrir":"offert",
      "découvrir":"découvert", "souffrir":"souffert", "courir":"couru", "mourir":"mort", "rire":"ri",
      "sourire":"souri", "naitre":"né", "être":"été", "avoir":"eu", "pleuvoir":"plu", "recevoir":"reçu",
      "décevoir":"déçu", "apercevoir":"aperçu", "vivre":"vécu", "suivre":"suivi", "assoir":"assis",
      "partir":"parti", "sortir":"sorti", "sentir":"senti", "mentir":"menti", "fuir":"fui",
      "accueillir":"accueilli", "cueillir":"cueilli", "couvrir":"couvert", "valoir":"valu",
      "falloir":"fallu", "plaire":"plu", "suffire":"suffi", "coudre":"cousu",
      "résoudre":"résolu", "vaincre":"vaincu", "conclure":"conclu",
      "battre":"battu", "connaitre":"connu", "paraitre":"paru", "disparaitre":"disparu",
      "traduire":"traduit",
      "produire":"produit", "détruire":"détruit", "instruire":"instruit", "joindre":"joint",
      "rejoindre":"rejoint", "atteindre":"atteint", "plaindre":"plaint", "mordre":"mordu",
      "tordre":"tordu"
    };

    let selectedVerbs = [];
    let currentIndex = 0;
    let attempts = 0;
    let score = 0;
    let resultSaved = false;

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function groupe(v) {
      if (v === 'aller') return 3;
      if (v.endsWith('er')) return 1;
      const g2 = ["finir","choisir","grandir","réussir","rougir","obéir","agir","punir","remplir","franchir","nourrir","fournir","saisir","blanchir","ralentir"];
      return g2.includes(v) ? 2 : 3;
    }
    function initGame() {
      // Tirage équilibré : 2 verbes du 1er groupe, 3 du 2e, 5 du 3e, dans un ordre mélangé
      const all = Object.keys(verbsBank);
      const pick = (g, n) => shuffleArray(all.filter(v => groupe(v) === g)).slice(0, n);
      selectedVerbs = shuffleArray([...pick(1, 2), ...pick(2, 3), ...pick(3, 5)]);
      currentIndex = 0;
      score = 0;
      resultSaved = false;
      loadVerb();
    }
    function saveScore() {
      if (resultSaved) return;
      resultSaved = true;
      try {
        if (window.parent && window.parent.saveResult) {
          window.parent.saveResult({
            activity: 'ortho_participe_infinitif',
            bookTitle: "Participe passé — Du verbe à l'infinitif au participe passé",
            score: score,
            total: 10,
            pct: score * 10,
            date: new Date().toLocaleDateString('fr-BE'),
            time: new Date().toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' })
          });
        }
      } catch (e) {}
    }

    function loadVerb() {
      if (currentIndex >= 10) {
        document.querySelector('.game-container').innerHTML = `
          <div class="game-title">🏆 Bravo !</div>
          <div style="font-size: 1.5rem; margin-bottom: 1rem;">Tu as transformé les 10 verbes.</div>
          <div style="font-size: 2rem; font-weight: bold; margin-bottom: 0.5rem;">Score : ${score} / 10</div>
          <div style="font-size: 1rem; color: #64748b; margin-bottom: 2rem;">Un point par verbe réussi du premier coup.</div>
          <button class="btn" onclick="location.reload()" style="background-color: var(--accent-green);">Recommencer avec 10 autres verbes</button>
        `;
        saveScore();
        return;
      }
      attempts = 0;
      document.getElementById('progress').innerText = `Verbe ${currentIndex + 1} / 10`;
      document.getElementById('verb').innerText = selectedVerbs[currentIndex];
      document.getElementById('answer').value = "";
      document.getElementById('answer').disabled = false;
      document.getElementById('feedback').innerText = "";
      document.getElementById('answer').focus();
      const btn = document.getElementById('btn');
      btn.innerText = "Valider";
      btn.onclick = checkAnswer;
      btn.style.backgroundColor = 'var(--primary)';
    }

    function checkAnswer() {
      const verb = selectedVerbs[currentIndex];
      const correct = verbsBank[verb];
      const answer = document.getElementById('answer').value.normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase();
      const fb = document.getElementById('feedback');

      if (answer === '') {
        fb.innerText = "✏️ Écris d'abord le participe passé.";
        fb.className = "feedback error";
        return;
      }
      if (answer === correct) {
        if (attempts === 0) score++;
        fb.innerText = attempts === 0 ? "✅ Exact !" : "✅ Exact (au deuxième essai) !";
        fb.className = "feedback success";
        document.getElementById('answer').disabled = true;
        showNext();
      } else {
        attempts++;
        if (attempts === 1) {
          fb.innerText = "❌ Faux, essaie encore !";
          fb.className = "feedback error";
        } else {
          fb.innerHTML = `❌ Toujours faux. La bonne réponse était : <strong>${correct}</strong>`;
          fb.className = "feedback error";
          document.getElementById('answer').value = correct;
          document.getElementById('answer').disabled = true;
          showNext();
        }
      }
    }

    function showNext() {
      const btn = document.getElementById('btn');
      btn.innerText = "Suivant ➔";
      btn.style.backgroundColor = 'var(--accent-green)';
      btn.onclick = () => {
        currentIndex++;
        loadVerb();
      };
    }
    
    document.getElementById('answer').addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById('btn').click();
      }
    });

    window.onload = initGame;
  </script>
</body>
</html>
