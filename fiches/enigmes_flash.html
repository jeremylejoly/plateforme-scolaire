<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Énigmes flash</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --purple: #5B4FCF; --purple-light: #EEF0FF;
    --green: #1A9E75; --green-light: #E2F5EE;
    --red: #D94F3D; --red-light: #FDECEA;
    --amber: #C97B1A; --amber-light: #FEF3E2;
    --blue: #1A6FA0; --blue-light: #E2F0FA;
    --bg: #FDFBF7; --surface: #FFFFFF;
    --text: #1A1A2E; --muted: #6B7080; --border: #1A1A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body { font-family: 'Nunito', sans-serif; color: var(--text); padding: 10px 14px 14px; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; touch-action: manipulation; color: var(--text); }
  .container { max-width: 860px; margin: 0 auto; }
  .hidden { display: none !important; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--amber-light); border: 3px solid var(--border); border-radius: 16px;
    padding: 6px 12px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--border);

  h1 { font-family: 'Fredoka', sans-serif; font-size: 21px; font-weight: 700; }
  .subtitle { font-size: 13px; color: var(--muted); font-weight: 700; }
  .hud { font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; white-space: nowrap; }

  .btn {
    border: 2.5px solid var(--border); border-radius: 12px; padding: 8px 16px; font-size: 15px; font-weight: 800;
    background: var(--surface); box-shadow: 3px 3px 0 var(--border); cursor: pointer;
  }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--border); }
  .btn-primary { background: var(--purple); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--border); }

  /* Menu */
  .intro { background: var(--surface); border: 2.5px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: 15px; line-height: 1.45; }
  .niveaux { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .niveaux { grid-template-columns: 1fr 1fr 1fr; } }
  .carte-niveau {
    background: var(--surface); border: 3px solid var(--border); border-radius: 16px; padding: 12px; text-align: left;
    cursor: pointer; box-shadow: 4px 4px 0 var(--border); display: flex; flex-direction: column; gap: 6px;
  }
  .carte-niveau:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--border); }
  .carte-niveau .badge { font-family: 'Fredoka', sans-serif; font-size: 19px; font-weight: 700; }
  .carte-niveau .desc { font-size: 14px; color: var(--muted); font-weight: 700; line-height: 1.35; }
  .carte-niveau .record { font-size: 14px; font-weight: 800; }
  .n1 { background: var(--green-light); } .n2 { background: var(--blue-light); } .n3 { background: var(--purple-light); }

  /* Énigme */
  .texte {
    background: var(--surface); border: 3px solid var(--border); border-radius: 16px; padding: 12px 16px;
    font-size: 17px; line-height: 1.55; box-shadow: 4px 4px 0 var(--border); margin-bottom: 10px;
  }
  .texte .titre-enigme { font-family: 'Fredoka', sans-serif; font-size: 15px; color: var(--amber); font-weight: 700; margin-bottom: 4px; }
  .phrase { border-radius: 6px; padding: 1px 2px; transition: background .15s; }
  .texte.preuve-mode .phrase { cursor: pointer; background: #FFF6D6; box-shadow: inset 0 -2px 0 #E8C766; }
  .texte.preuve-mode .phrase.faux { background: var(--red-light); box-shadow: inset 0 -2px 0 var(--red); }
  .phrase.juste { background: #BDEBD9 !important; box-shadow: inset 0 -2px 0 var(--green) !important; font-weight: 700; }
  .ligne-dialogue { display: block; }

  .question { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; margin: 2px 0 8px; }
  .options { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 10px; }
  .option {
    text-align: left; background: var(--surface); border: 2.5px solid var(--border); border-radius: 12px; padding: 8px 12px;
    font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--border);
  }
  .option.choisie { background: var(--purple-light); border-color: var(--purple); box-shadow: 3px 3px 0 var(--purple); }
  .option.bonne { background: var(--green-light); border-color: var(--green); box-shadow: 3px 3px 0 var(--green); }
  .option:disabled { cursor: default; }
  .options.fige .option:not(.bonne) { opacity: .45; }

  .barre { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .message { flex: 1; min-width: 200px; font-size: 15px; font-weight: 700; line-height: 1.4; border-radius: 12px; padding: 8px 12px; border: 2.5px solid transparent; }
  .message:empty { display: none; }
  .message.info { background: var(--blue-light); border-color: var(--blue); }
  .message.erreur { background: var(--red-light); border-color: var(--red); }
  .message.indice { background: var(--amber-light); border-color: var(--amber); }
  .message.bravo { background: var(--green-light); border-color: var(--green); }

  /* Fin */
  .fin { text-align: center; background: var(--surface); border: 3px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 4px 4px 0 var(--border); }
  .fin .etoiles { font-size: 34px; margin: 8px 0; }
  .fin p { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>🔎 Énigmes flash</h1>
      <div class="subtitle">Lis, devine… et prouve-le !</div>
    </div>
    <div class="hud" id="hud"></div>
  </header>

  <!-- MENU -->
  <section id="ecran-menu">
    <div class="intro">
      Chaque énigme est un petit texte. La réponse n'est <b>jamais écrite</b> : il faut la <b>deviner grâce aux indices</b>.<br>
      Ensuite, tu dois <b>prouver ta réponse</b> en touchant la phrase du texte qui la montre. 🕵️
    </div>
    <div class="niveaux" id="niveaux"></div>
  </section>

  <!-- ÉNIGME -->
  <section id="ecran-jeu" class="hidden">
    <div class="texte" id="texte"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="barre">
      <button class="btn" id="btn-menu">← Niveaux</button>
      <div class="message" id="message"></div>
      <button class="btn btn-primary" id="btn-valider" disabled>Valider</button>
      <button class="btn btn-green hidden" id="btn-suivant">Énigme suivante →</button>
    </div>
  </section>

  <!-- FIN -->
  <section id="ecran-fin" class="hidden">
    <div class="fin">
      <h1 id="fin-titre">Bravo, détective !</h1>
      <div class="etoiles" id="fin-etoiles"></div>
      <p id="fin-texte"></p>
      <button class="btn btn-primary" id="btn-fin-menu">Choisir un niveau</button>
    </div>
  </section>
</div>

<script>
/* ===================================================================

   indice   : après 2 erreurs sur la question (guide, ne donne pas la réponse)
   preuves  : numéros des phrases qui prouvent la réponse (0 = 1re phrase)
   pieges   : message pour une phrase tentante mais qui ne prouve pas assez

const NIVEAUX_INFO = {
  1: { nom: "Niveau 1", desc: "Indices faciles à repérer : un lieu, un moment, un métier…", cls: "n1", emoji: "🟢" },
  2: { nom: "Niveau 2", desc: "Lire entre les lignes : phrases pièges, sentiments cachés, menteurs…", cls: "n2", emoji: "🔵" },
  3: { nom: "Niveau 3", desc: "Textes plus longs, réponses qui se ressemblent… et 2 preuves à trouver !", cls: "n3", emoji: "🟣" }
};

const PAR_PARTIE = 5;    // nombre d'énigmes par partie (tirées au hasard dans le niveau)
const CLE_RECORDS = "lcml_enigmes_flash_records";
// Dans le site, chaque niveau est une activité à part : fiches/enigmes_flash.html?niveau=1 (2, 3)
const NIVEAU_SITE = (() => { const n = parseInt(new URLSearchParams(location.search).get("niveau"), 10); return [1, 2, 3].includes(n) ? n : null; })();

/* ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
let partie = null;   // {niveau, liste, index, etoiles}
let etat = null;     // état de l'énigme en cours

function lireRecords() { try { return JSON.parse(localStorage.getItem(CLE_RECORDS)) || {}; } catch (e) { return {}; } }
function ecrireRecords(r) { try { localStorage.setItem(CLE_RECORDS, JSON.stringify(r)); } catch (e) {} }
function melange(t) { const a = t.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function montrer(id) { ["ecran-menu", "ecran-jeu", "ecran-fin"].forEach(e => $(e).classList.toggle("hidden", e !== id)); }
function msg(texte, type) { const m = $("message"); m.textContent = texte || ""; m.className = "message " + (type || ""); }

/* ----- Menu ----- */
function afficherMenu() {
  const rec = lireRecords();
  $("hud").textContent = "";
  $("niveaux").innerHTML = "";
  [1, 2, 3].forEach(n => {
    const info = NIVEAUX_INFO[n], total = Math.min(PAR_PARTIE, ENIGMES[n].length) * 2;
    const b = document.createElement("button");
    b.className = "carte-niveau " + info.cls;
    b.innerHTML = `<span class="badge">${info.emoji} ${info.nom}</span>
      <span class="desc">${info.desc}</span>
      <span class="record">${rec[n] !== undefined ? "Meilleur score : ⭐ " + rec[n] + " / " + total : PAR_PARTIE + " énigmes par partie"}</span>`;
    b.addEventListener("click", () => demarrer(n));
    $("niveaux").appendChild(b);
  });
  montrer("ecran-menu");
}

/* ----- Partie ----- */
function demarrer(n) {
  partie = { niveau: n, liste: melange(ENIGMES[n]).slice(0, PAR_PARTIE), index: 0, etoiles: 0 };
  afficherEnigme();
  montrer("ecran-jeu");
}

function majHud() {
  $("hud").textContent = `${NIVEAUX_INFO[partie.niveau].emoji} ${partie.index + 1} / ${partie.liste.length}   ⭐ ${partie.etoiles}`;
}

function afficherEnigme() {
  const e = partie.liste[partie.index];
  etat = { e, etape: "question", choix: null, erreursQ: 0, erreursP: 0, trouvees: [], nb: e.nbPreuves || 1, ordre: melange(e.options.map((t, i) => ({ t, bonne: i === 0 }))) };
  majHud();

  const tx = $("texte");
  tx.className = "texte";
  tx.innerHTML = `<div class="titre-enigme">${e.titre}</div>`;
  e.phrases.forEach((p, i) => {
    const s = document.createElement("span");
    s.className = "phrase" + (e.dialogue ? " ligne-dialogue" : "");
    s.textContent = p;
    s.dataset.i = i;
    s.addEventListener("click", () => toucherPhrase(i, s));
    tx.appendChild(s);
    if (!e.dialogue) tx.appendChild(document.createTextNode(" "));
  });

  $("question").textContent = "❓ " + e.question;
  const op = $("options");
  op.className = "options"; op.innerHTML = "";
  etat.ordre.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "option"; b.textContent = o.t;
    b.addEventListener("click", () => {
      if (etat.etape !== "question") return;
      etat.choix = k;
      op.querySelectorAll(".option").forEach((x, j) => x.classList.toggle("choisie", j === k));
      $("btn-valider").disabled = false;
    });
    op.appendChild(b);
  });

  $("btn-valider").classList.remove("hidden");
  $("btn-valider").disabled = true;
  $("btn-valider").textContent = "Valider";
  $("btn-suivant").classList.add("hidden");
  msg("Lis bien le texte, puis choisis ta réponse.", "info");
}

function validerQuestion() {
  if (etat.etape !== "question" || etat.choix === null) return;
  const o = etat.ordre[etat.choix];
  if (o.bonne) {
    if (etat.erreursQ === 0) partie.etoiles++;
    etat.etape = "preuve";
    const op = $("options");
    op.classList.add("fige");
    op.querySelectorAll(".option").forEach((x, j) => { x.disabled = true; x.classList.remove("choisie"); if (j === etat.choix) x.classList.add("bonne"); });
    $("btn-valider").classList.add("hidden");
    $("texte").classList.add("preuve-mode");
    majHud();
    msg(etat.nb === 1 ? "✅ Bonne réponse ! Maintenant, prouve-le : touche une phrase du texte qui le montre."
                      : "✅ Bonne réponse ! Maintenant, prouve-le : touche " + etat.nb + " phrases différentes du texte qui le montrent.", "bravo");
  } else {
    etat.erreursQ++;
    if (etat.erreursQ === 1) msg("❌ Ce n'est pas ça. Relis bien le texte et cherche les indices…", "erreur");
    else msg("💡 Indice : " + etat.e.indice, "indice");
  }
}

function toucherPhrase(i, span) {
  if (etat.etape !== "preuve") return;
  const e = etat.e;
  if (etat.trouvees.includes(i)) { msg("👍 Tu as déjà choisi cette phrase. Trouve une autre preuve.", "info"); return; }
  if (e.preuves.includes(i)) {
    etat.trouvees.push(i);
    span.classList.remove("faux"); span.classList.add("juste");
    if (etat.trouvees.length < etat.nb) {
      msg("✅ Bonne preuve ! Il en faut encore " + (etat.nb - etat.trouvees.length) + " : touche une autre phrase.", "bravo");
      return;
    }
    if (etat.erreursP === 0) partie.etoiles++;
    etat.etape = "fini";
    $("texte").classList.remove("preuve-mode");
    $("texte").querySelectorAll(".phrase").forEach(s => s.classList.remove("faux"));
    span.classList.add("juste");
    majHud();
    msg("🎉 Bien prouvé ! " + e.explication, "bravo");
    const suiv = $("btn-suivant");
    suiv.textContent = partie.index + 1 < partie.liste.length ? "Énigme suivante →" : "Voir mon score →";
    suiv.classList.remove("hidden");
  } else {
    etat.erreursP++;
    span.classList.add("faux");
    let t = (e.pieges && e.pieges[i]) ? "🤔 " + e.pieges[i] : "❌ Cette phrase ne prouve pas ta réponse. Relis le texte.";
    if (etat.erreursP >= 2) t += "  💡 Indice : " + e.indicePreuve;
    msg(t, etat.erreursP >= 2 ? "indice" : "erreur");
  }
}

function suivant() {
  partie.index++;
  if (partie.index < partie.liste.length) { afficherEnigme(); return; }
  // Fin du niveau
  const n = partie.niveau, total = partie.liste.length * 2, rec = lireRecords();
  envoyerResultat(n, partie.etoiles, total);
  if (rec[n] === undefined || partie.etoiles > rec[n]) { rec[n] = partie.etoiles; ecrireRecords(rec); }
  $("hud").textContent = "";
  $("fin-etoiles").textContent = "⭐ " + partie.etoiles + " / " + total;
  const ratio = partie.etoiles / total;
  $("fin-titre").textContent = ratio === 1 ? "Détective de génie ! 🏆" : ratio >= 0.7 ? "Bravo, détective ! 🕵️" : "Enquête terminée ! 🔎";
  $("fin-texte").textContent = "Tu gagnes une étoile quand tu trouves la réponse du premier coup, et une autre quand tu trouves les preuves sans te tromper.";
  montrer("ecran-fin");
}

/* Résultat envoyé au site (page enseignant, plan de travail) */
function envoyerResultat(n, score, total) {
  try {
    if (window.parent && window.parent !== window && window.parent.saveResult) {
      window.parent.saveResult({ activity: "enigmes_flash_n" + n, bookTitle: "Énigmes flash — Niveau " + n,
        score, total, pct: Math.round(score / total * 100), date: new Date().toLocaleDateString("fr-BE"),
        time: new Date().toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" }) });
    }
  } catch (e) { /* page ouverte hors du site */ }
}

$("btn-valider").addEventListener("click", validerQuestion);
$("btn-suivant").addEventListener("click", suivant);
$("btn-menu").addEventListener("click", afficherMenu);
$("btn-fin-menu").addEventListener("click", () => NIVEAU_SITE ? demarrer(NIVEAU_SITE) : afficherMenu());

if (NIVEAU_SITE) {
  // Mode site : pas de menu des niveaux, on commence directement le niveau demandé
  $("btn-menu").classList.add("hidden");
  $("btn-fin-menu").textContent = "🔁 Rejouer (5 nouvelles énigmes)";
  document.querySelector(".subtitle").textContent = "Niveau " + NIVEAU_SITE + " — Lis, devine… et prouve-le !";
  window.lcmlOnLeave = () => demarrer(NIVEAU_SITE);
  demarrer(NIVEAU_SITE);
} else {
  window.lcmlOnLeave = afficherMenu;
  afficherMenu();
}
</script>
