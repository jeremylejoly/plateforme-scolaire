<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Remplaçant - Défi Pronominalisation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #e0e7ff;
      --card-bg: #ffffff;
      --text-main: #1e1b4b;
      --text-muted: #4f46e5;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --accent-amber: #fbbf24;
      --accent-amber-hover: #f59e0b;
      --correct-green: #10b981;
      --wrong-red: #ef4444;
      --border-color: #1e1b4b;
      --shadow-color: #1e1b4b;
      --font-display: 'Outfit', 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      font-family: var(--font-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Core container */
    .container {
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 6px 6px 0px var(--shadow-color);
      width: 100%;
      max-width: 680px;
      padding: 24px;
      position: relative;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 16px;
    }

    .title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-badge {
      background: var(--accent-amber);
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
      font-family: var(--font-display);
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    /* Progress bar */
    .progress-container {
      margin-bottom: 24px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-family: var(--font-display);
    }

    .progress-bar-bg {
      background: #f1f5f9;
      border: 2px solid var(--border-color);
      height: 14px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      background: var(--accent-purple);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Source sentence card */
    .sentence-card {
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      font-size: 1.15rem;
      line-height: 1.6;
      font-weight: 500;
      text-align: center;
    }

    .sentence-card p {
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sentence-display {
      font-weight: 700;
    }

    .highlight {
      background-color: #fef08a;
      border-bottom: 3px dashed var(--accent-amber);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .highlight2 {
      background-color: #fed7aa;
      border-bottom: 3px dashed #f97316;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Reconstruction Zone */
    .reconstruct-zone {
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      background: #fafafa;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .reconstruct-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .reconstruct-sentence {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 6px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 2.2;
    }

    .word-text {
      padding: 2px 4px;
    }

    .sentence-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      height: 38px;
      border: 2px dashed #a5b4fc;
      background: #f5f3ff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: var(--accent-purple);
      font-size: 1.1rem;
      font-family: var(--font-display);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .sentence-slot:hover {
      background: #e0e7ff;
      border-color: var(--accent-purple);
    }

    .sentence-slot.filled {
      background: var(--accent-amber);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .sentence-slot.filled:hover {
      background: var(--accent-amber-hover);
    }

    .sentence-slot.correct-match {
      background: var(--correct-green);
      color: white;
      border-color: var(--border-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .sentence-slot.wrong-match {
      background: var(--wrong-red);
      color: white;
      border-color: var(--border-color);
      animation: slot-shake 0.3s ease;
    }

    @keyframes slot-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Pronoun selection pool */
    .pool-zone {
      margin-bottom: 24px;
      text-align: center;
    }

    .pool-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .pool-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .pronoun-badge {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--shadow-color);
      transition: all 0.15s ease;
    }

    .pronoun-badge:hover {
      background: #f8fafc;
      transform: translateY(-2px);
    }

    .pronoun-badge.selected {
      background: var(--accent-purple);
      color: white;
      box-shadow: 1px 1px 0px var(--shadow-color);
      transform: translateY(1px);
    }

    /* Action button */
    .btn-container {
      text-align: center;
      margin-top: 16px;
    }

    .action-btn {
      background: var(--accent-purple);
      color: white;
      border: 3px solid var(--border-color);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      padding: 12px 32px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--shadow-color);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-btn:hover {
      background: var(--accent-purple-hover);
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px var(--shadow-color);
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .action-btn.correct-btn {
      background: var(--correct-green);
    }

    .action-btn.correct-btn:hover {
      background: #059669;
    }

    /* Explanation Panel */
    .explanation-panel {
      background: #ecfdf5;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
      display: none;
      animation: slide-up 0.3s ease;
    }

    @keyframes slide-up {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .explanation-title {
      font-weight: 700;
      color: #065f46;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explanation-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #047857;
    }

    /* Screen shake */
    .shake-container {
      animation: container-shake 0.4s ease;
    }

    @keyframes container-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Results Screen */
    .results-screen {
      display: none;
      text-align: center;
      padding: 24px 8px;
    }

    .results-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .results-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .results-score-text {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .results-score-number {
      font-weight: 800;
      color: var(--accent-purple);
      font-size: 2.5rem;
      font-family: var(--font-display);
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 24px;
    }
  </style>
</head>
<body>
  <div class="container" id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- Game Screen -->
    <div id="game-screen">
      <div class="top-bar">
        <h1 class="title">🎯 Le Remplaçant</h1>
        <div class="score-badge" id="score-badge">Score : 0</div>
      </div>

      <div class="progress-container">
        <div class="progress-text">
          <span id="progress-text">Phrase 1 sur 10</span>
          <span>Exercice</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Phrase source -->
      <div class="sentence-card">
        <p>Phrase d'origine :</p>
        <div class="sentence-display" id="source-sentence"></div>
      </div>

      <!-- Zone de reconstruction -->
      <div class="reconstruct-zone" id="reconstruct-card">
        <div class="reconstruct-title">Reconstruis la phrase après pronominalisation :</div>
        <div class="reconstruct-sentence" id="reconstruct-sentence"></div>
      </div>

      <!-- Banque de badges de pronoms -->
      <div class="pool-zone">
        <div class="pool-title">Sélectionne un pronom et place-le au bon endroit dans la phrase :</div>
        <div class="pool-badges" id="pool-badges"></div>
      </div>

      <!-- Actions -->
      <div class="btn-container">
        <button class="action-btn" id="validate-btn">Valider ➔</button>
        <button class="action-btn correct-btn" id="next-btn" style="display:none">Continuer ➔</button>
      </div>

      <!-- Explications -->
      <div class="explanation-panel" id="explanation-panel">
        <div class="explanation-title">💡 Explication :</div>
        <div class="explanation-text" id="explanation-text"></div>
      </div>
    </div>

    <!-- Results Screen -->
    <div class="results-screen" id="results-screen">
      <div class="results-icon" id="feedback-icon">🏆</div>
      <h2 class="results-title" id="feedback-title">Félicitations !</h2>
      <p class="results-score-text">Tu as obtenu un score de <span class="results-score-number" id="final-score">0 / 10</span></p>
      <p style="margin-bottom: 24px; color: var(--text-muted); font-weight: 500;" id="final-feedback"></p>
      <button class="action-btn" id="restart-btn">Rejouer ↺</button>
    </div>
  </div>

  <script>
    // --- SYNTHÈSE AUDIO (Web Audio API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playCorrect() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        // Note 1 (Mi 5)
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.1, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.15);

        // Note 2 (La 5)
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(880.00, now + 0.08);
        gain2.gain.setValueAtTime(0.1, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.3);
      }
      playWrong() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.25);
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }
    const sounds = new SoundEffects();

    // --- BANQUE DE PHRASES ---
    const QUESTIONS = [
      {
        source: "Le jardinier arrose <span class='highlight'>les plantes du parc</span>.",
        tokens: [
          { type: "text", text: "Le jardinier" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "arrose" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "les",
          slot1: ""
        },
        explanation: "Le groupe nominal féminin pluriel <strong>les plantes du parc</strong> est le COD de la phrase. On le remplace par <strong>les</strong>, placé avant le verbe."
      },
      {
        source: "Nous regardons <span class='highlight'>la télévision</span> tous les soirs.",
        tokens: [
          { type: "text", text: "Nous" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "regardons" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "tous les soirs" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "la",
          slot1: ""
        },
        explanation: "Le groupe nominal féminin singulier <strong>la télévision</strong> est COD. On le remplace par le pronom <strong>la</strong>, placé avant le verbe."
      },
      {
        source: "Tu parles <span class='highlight'>à ton enseignant</span>.",
        tokens: [
          { type: "text", text: "Tu" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "parles" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "lui",
          slot1: ""
        },
        explanation: "Le groupe nominal introduit par à (<strong>à ton enseignant</strong>) est un COI singulier. On le remplace par <strong>lui</strong>, placé avant le verbe."
      },
      {
        source: "Elle écrit <span class='highlight'>à ses amies</span>.",
        tokens: [
          { type: "text", text: "Elle" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "écrit" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "leur",
          slot1: ""
        },
        explanation: "Le groupe nominal pluriel introduit par à (<strong>à ses amies</strong>) est un COI. On le remplace par <strong>leur</strong>, placé avant le verbe."
      },
      {
        source: "Nous allons <span class='highlight'>à la plage</span>.",
        tokens: [
          { type: "text", text: "Nous" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "allons" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "y",
          slot1: ""
        },
        explanation: "Le complément de lieu <strong>à la plage</strong> est introduit par la préposition <strong>à</strong>. On le remplace par le pronom <strong>y</strong>."
      },
      {
        source: "Vous mangez <span class='highlight'>du fromage</span>.",
        tokens: [
          { type: "text", text: "Vous" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "mangez" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "en",
          slot1: ""
        },
        explanation: "Le groupe nominal <strong>du fromage</strong> commence par un partitif. On le remplace par le pronom quantitatif <strong>en</strong>, placé avant le verbe."
      },
      {
        source: "Elle donne <span class='highlight'>le livre</span> <span class='highlight2'>à son frère</span>.",
        tokens: [
          { type: "text", text: "Elle" },
          { type: "slot", id: "slot0" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "donne" },
          { type: "slot", id: "slot2" },
          { type: "slot", id: "slot3" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "le",
          slot1: "lui",
          slot2: "",
          slot3: ""
        },
        explanation: "On remplace le COD (<strong>le livre</strong>) par <strong>le</strong>, et le COI (<strong>à son frère</strong>) par <strong>lui</strong>. Ils se placent tous les deux avant le verbe dans l'ordre : <strong>le lui</strong>."
      },
      {
        source: "Je prête <span class='highlight'>mes jouets</span> <span class='highlight2'>à mes cousins</span>.",
        tokens: [
          { type: "text", text: "Je" },
          { type: "slot", id: "slot0" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "prête" },
          { type: "slot", id: "slot2" },
          { type: "slot", id: "slot3" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "les",
          slot1: "leur",
          slot2: "",
          slot3: ""
        },
        explanation: "Le COD pluriel (<strong>mes jouets</strong>) est remplacé par <strong>les</strong>, et le COI pluriel (<strong>à mes cousins</strong>) par <strong>leur</strong>. Ils se placent avant le verbe : <strong>les leur</strong>."
      },
      {
        source: "Le guide conduit <span class='highlight'>les touristes</span> <span class='highlight2'>au musée</span>.",
        tokens: [
          { type: "text", text: "Le guide" },
          { type: "slot", id: "slot0" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "conduit" },
          { type: "slot", id: "slot2" },
          { type: "slot", id: "slot3" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "les",
          slot1: "y",
          slot2: "",
          slot3: ""
        },
        explanation: "Le COD <strong>les touristes</strong> est remplacé par <strong>les</strong>, et la destination <strong>au musée</strong> par <strong>y</strong>. Ils se placent avant le verbe : <strong>les y</strong>."
      },
      {
        source: "Le boulanger vend <span class='highlight'>du pain</span> <span class='highlight2'>aux clients</span>.",
        tokens: [
          { type: "text", text: "Le boulanger" },
          { type: "slot", id: "slot0" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "vend" },
          { type: "slot", id: "slot2" },
          { type: "slot", id: "slot3" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "leur",
          slot1: "en",
          slot2: "",
          slot3: ""
        },
        explanation: "Le COI pluriel <strong>aux clients</strong> devient <strong>leur</strong>, et le partitif <strong>du pain</strong> devient <strong>en</strong>. Ils se placent avant le verbe : <strong>leur en</strong>."
      },
      {
        source: "Il ne regarde pas <span class='highlight'>ce film</span>.",
        tokens: [
          { type: "text", text: "Il" },
          { type: "text", text: "ne" },
          { type: "slot", id: "slot0" },
          { type: "text", text: "regarde" },
          { type: "slot", id: "slot1" },
          { type: "text", text: "pas" },
          { type: "text", text: "." }
        ],
        correct: {
          slot0: "le",
          slot1: ""
        },
        explanation: "Dans une phrase négative, le pronom se place toujours directement entre <strong>ne</strong> et le verbe."
      },
      {
        source: "Je vais lire <span class='highlight'>cette bande dessinée</span>.",
        tokens: [
          { type: "text", text: "Je" },

    const gameScreen = document.getElementById('game-screen');
    const resultsScreen = document.getElementById('results-screen');

    const reconstructSentence = document.getElementById('reconstruct-sentence');

    const explanationText = document.getElementById('explanation-text');
    const restartBtn = document.getElementById('restart-btn');
    const gameContainer = document.getElementById('game-container');

    // --- UTILS ---
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // --- ACTIONS ---
    function initGame() {
      state.currentIndex = 0;
      state.score = 0;
      state.submitted = false;
      state.incorrectAttempts = 0;
      state.selectedPronoun = null;
      state.questions = shuffle(QUESTIONS).slice(0, 10);

      scoreBadge.textContent = "Score : 0";
      gameScreen.style.display = 'block';
      resultsScreen.style.display = 'none';

      loadQuestion();
    }

    function loadQuestion() {
      state.submitted = false;
      state.incorrectAttempts = 0;
      state.selectedPronoun = null;
      state.slotAnswers = {};
      
      validateBtn.style.display = 'inline-flex';
      nextBtn.style.display = 'none';
      explanationPanel.style.display = 'none';
      gameContainer.classList.remove('shake-container');

      const question = state.questions[state.currentIndex];

      // Progress UI
      progressText.textContent = `Phrase ${state.currentIndex + 1} sur ${state.questions.length}`;
      const pct = (state.currentIndex / state.questions.length) * 100;
      progressFill.style.width = `${pct}%`;

      // Render source
      sourceSentence.innerHTML = question.source;

      // Initialize slotAnswers empty
      question.tokens.forEach(tok => {
        if (tok.type === 'slot') {
          state.slotAnswers[tok.id] = "";
        }
      });

      renderReconstructionZone();
      renderPoolBadges();
    }

    function renderReconstructionZone() {
      reconstructSentence.innerHTML = '';
      const question = state.questions[state.currentIndex];

      question.tokens.forEach(tok => {
        if (tok.type === 'text') {
          const span = document.createElement('span');
          span.className = 'word-text';
          span.textContent = tok.text;
          reconstructSentence.appendChild(span);
        } else if (tok.type === 'slot') {
          // If the exercise has been validated, we hide slots that are supposed to remain empty.
          if (state.submitted && question.correct[tok.id] === "") {
            return;
          }

          const slotVal = state.slotAnswers[tok.id];
          const btn = document.createElement('button');
          btn.className = 'sentence-slot';
          btn.setAttribute('data-slot-id', tok.id);
          
          if (state.submitted) {
            btn.classList.add('correct-match');
            btn.textContent = slotVal;
          } else {
            if (slotVal) {
              btn.classList.add('filled');
              btn.textContent = slotVal;
            } else {
              btn.textContent = '?';
            }

            btn.addEventListener('click', (e) => {
              e.preventDefault();
              handleSlotClick(tok.id, btn);
            });
          }

          reconstructSentence.appendChild(btn);
        }
      });
    }

    function renderPoolBadges() {
      poolBadges.innerHTML = '';
      PRONOUNS.forEach(prn => {
        const btn = document.createElement('button');
        btn.className = 'pronoun-badge';
        btn.textContent = prn;
        if (state.selectedPronoun === prn) {
          btn.classList.add('selected');
        }

        btn.addEventListener('click', (e) => {
          e.preventDefault();
          if (state.submitted) return;
          sounds.playTick();
          if (state.selectedPronoun === prn) {
            state.selectedPronoun = null;
          } else {
            state.selectedPronoun = prn;
          }
          renderPoolBadges();
        });

        poolBadges.appendChild(btn);
      });
    }

    function handleSlotClick(slotId, btnElement) {
      if (state.submitted) return;
      sounds.playTick();

      if (state.selectedPronoun) {
        // Place the pronoun in this slot
        state.slotAnswers[slotId] = state.selectedPronoun;
        state.selectedPronoun = null;
      } else {
        // Clear the slot if clicked without active selection
        state.slotAnswers[slotId] = "";
      }

      renderReconstructionZone();
      renderPoolBadges();
    }

    function handleValidation() {
      if (state.submitted) return;

      const question = state.questions[state.currentIndex];
      
      // Compare state.slotAnswers with question.correct
      let isCorrect = true;
      Object.keys(question.correct).forEach(slotId => {
        const expected = question.correct[slotId];
        const actual = state.slotAnswers[slotId] || "";
        if (expected !== actual) {
          isCorrect = false;
        }
      });

      if (isCorrect) {
        // Success
        state.submitted = true;
        sounds.playCorrect();

        renderReconstructionZone();

        if (state.incorrectAttempts === 0) {
          state.score++;
          scoreBadge.textContent = `Score : ${state.score}`;
        }

        explanationText.innerHTML = question.explanation;
        explanationPanel.style.display = 'block';
        validateBtn.style.display = 'none';
        nextBtn.style.display = 'inline-flex';
      } else {
        // Fail
        sounds.playWrong();
        state.incorrectAttempts++;

        // Shake container card
        gameContainer.classList.remove('shake-container');
        void gameContainer.offsetWidth; // Trigger reflow to restart animation
        gameContainer.classList.add('shake-container');

        // Animation de secousse sur les mauvais slots
        Object.keys(question.correct).forEach(slotId => {
          const expected = question.correct[slotId];
          const actual = state.slotAnswers[slotId] || "";
          if (expected !== actual && actual !== "") {
            const btn = reconstructSentence.querySelector(`[data-slot-id="${slotId}"]`);
            if (btn) {
              btn.classList.add('wrong-match');
              setTimeout(() => {
                btn.classList.remove('wrong-match');
              }, 400);
            }
          }
        });

        // Reset answers completely on fail for retry
        Object.keys(state.slotAnswers).forEach(slotId => {
          state.slotAnswers[slotId] = "";
        });
        state.selectedPronoun = null;

        setTimeout(() => {
          renderReconstructionZone();
          renderPoolBadges();
        }, 500);
      }
    }

    function handleNext() {
      state.currentIndex++;
      if (state.currentIndex < state.questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      gameScreen.style.display = 'none';
      resultsScreen.style.display = 'block';

      const finalScore = document.getElementById('final-score');
      finalScore.textContent = `${state.score} / ${state.questions.length}`;

      const titleEl = document.getElementById('feedback-title');
      const textEl = document.getElementById('final-feedback');
      const iconEl = document.getElementById('feedback-icon');

      if (state.score === state.questions.length) {
        iconEl.textContent = '🏆';
        titleEl.textContent = 'Parfait !';
        textEl.textContent = 'Incroyable ! La pronominalisation n\'a plus aucun secret pour toi !';
        startConfetti();
      } else if (state.score >= 7) {
        iconEl.textContent = '🌟';
        titleEl.textContent = 'Félicitations !';
        textEl.textContent = 'Excellent travail ! Tu maîtrises très bien la place des pronoms compléments.';
        startConfetti();
      } else if (state.score >= 4) {
        iconEl.textContent = '👍';
        titleEl.textContent = 'Bel effort !';
        textEl.textContent = 'C\'est un bon début. Continue de t\'entraîner pour retenir la place des pronoms.';
      } else {
        iconEl.textContent = '🌱';
        titleEl.textContent = 'Continue d\'apprendre !';
        textEl.textContent = 'N\'hésite pas à refaire le jeu. Relis bien les explications pour t\'aider !';
      }
    }

    // --- CONFETTI ANIMATION ---
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const colors = ['#6366f1', '#8b5cf6', '#10b981', '#f43f5e', '#fbbf24'];
      const particles = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * canvas.height,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.random() * 10 - 5,
        tiltAngleIncremental: Math.random() * 0.07 + 0.02,
        tiltAngle: 0
      }));

      let animationId;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, idx) => {
          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
          p.x += Math.sin(p.tiltAngle);
          p.tilt = Math.sin(p.tiltAngle - idx / 3) * 15;

          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
          ctx.stroke();
        });

        const anyInBounds = particles.some(p => p.y < canvas.height);
        if (anyInBounds) {
          animationId = requestAnimationFrame(draw);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      draw();
    }

    // --- ATTACH LISTENERS ---
    validateBtn.addEventListener('click', (e) => {
      e.preventDefault();
      handleValidation();
    });

    nextBtn.addEventListener('click', (e) => {
      e.preventDefault();
      handleNext();
    });

    restartBtn.addEventListener('click', (e) => {
      e.preventDefault();
      initGame();
    });

    // Start
    initGame();
  </script>
</body>
