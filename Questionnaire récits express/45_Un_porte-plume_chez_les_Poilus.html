<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Un porte-plume chez les Poilus - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Un porte-plume chez les Poilus</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "porte_plume",
  "title": "Un porte-plume chez les Poilus",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel est le thème de l'année choisi par madame Cholley ?",
      "options": [
        "Les nouvelles technologies et Internet",
        "La Préhistoire et les hommes des cavernes",
        "La guerre de 1914-1918",
        "Les livres de Harry Potter"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "En 2014, l'école commémore les 100 ans de la Première Guerre mondiale."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi appelle-t-on Gauthier « Platon » ?",
      "options": [
        "Parce que, petit, il disait « platon » au lieu de « plateau »",
        "Parce qu'il a battu deux garçons sur la plage l'été passé",
        "Parce qu'il adore lire les livres des philosophes grecs",
        "Parce que c'est le nom d'un célèbre boxeur russe"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Quand il était petit, il n'arrivait pas à dire « plateau » ; l'histoire du boxeur est un bobard de son frère."
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qui aide Gauthier à faire son arbre généalogique ?",
      "options": [
        "Son frère, qui vient d'avoir son permis",
        "Nona, sa grand-mère passionnée d'ordinateurs",
        "Madame Cholley, pendant le cours d'histoire",
        "Tante Jeanne, qui fait de délicieuses galettes"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Nona, « la geek de la famille », fait les recherches sur Internet avec lui ; ils écrivent sur le mur de son bureau."
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Gauthier choisit-il Gaston Semaille ?",
      "options": [
        "Parce que c'est le plus vieux de tous ses ancêtres",
        "Parce que madame Cholley le lui a imposé",
        "Parce qu'il a trouvé sa photo dans un livre d'histoire",
        "Parce que Gaston est aussi son deuxième prénom"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Il porte Gaston comme deuxième prénom, et c'est le premier ancêtre pour qui il a trouvé toutes les informations."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel travail Gaston faisait-il avant la guerre ?",
      "options": [
        "Il travaillait dans une fabrique de stylos",
        "Il distribuait le courrier à vélo dans le village",
        "Il était militaire, capitaine près de Liège",
        "Il fabriquait des boulons dans une usine"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Il travaillait à la fabrique de stylos ; c'est son père qui était facteur."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pendant la guerre, qu'est-ce qui rend Gaston célèbre parmi les soldats ?",
      "options": [
        "Il est le meilleur tireur de toute l'armée belge au front",
        "Il soigne les blessés qui reviennent du front",
        "Il écrit les lettres des soldats qui ne savent pas écrire",
        "Il cuisine de bons repas pour toute son unité"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "On le surnomme « le porte-plume » : il écrit parfois plus de 20 lettres par jour pour ses camarades."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "De quoi Gaston est-il mort ?",
      "options": [
        "D'une blessure pendant une grande bataille",
        "De la grippe espagnole, peu avant la fin de la guerre",
        "D'un accident avec une arme pendant l'entraînement",
        "D'une chute dans une tranchée pendant la nuit"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Affaibli comme beaucoup de soldats, il meurt de la grippe espagnole."
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle « arme » de Gaston Gauthier montre-t-il à la classe pendant son exposé ?",
      "options": [
        "Une vieille carabine trouvée dans le grenier",
        "Une baïonnette rouillée gardée par tonton Gaston",
        "Un casque kaki avec le lion belge dessus",
        "Un stylo-plume"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Tout le monde s'attend à une arme, mais Gauthier sort le stylo-plume de Gaston."
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Au début, Gauthier est très content du thème de l'année.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : Il aurait préféré les nouvelles technologies ou Harry Potter."
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Tonton Gaston donne à Gauthier le képi de son ancêtre.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : Il le sort d'un coffre dans la remise et le lui offre."
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Dans la famille, il y a un Gaston à chaque génération pour honorer sa mémoire.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : Tonton Gaston est le quatrième, Gauthier le sixième."
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Gaston a reçu une médaille après la guerre.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : L'adjudant voulait demander une décoration, mais elle n'est jamais arrivée."
    },
    {
      "id": "q13",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "On « commémore » la Première Guerre mondiale. Commémorer, c'est…",
      "options": [
        "faire une grande fête joyeuse",
        "se souvenir ensemble d'un événement important",
        "oublier ce qui s'est passé",
        "jouer à la guerre dans la cour de récréation"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Commémorer, c'est rappeler le souvenir d'un événement ; « on ne fête pas une guerre »."
    },
    {
      "id": "q14",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "Les « aïeux », ce sont…",
      "options": [
        "les ancêtres d'une famille",
        "les soldats d'une armée",
        "les élèves d'une même classe",
        "les professeurs d'une école"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Les aïeux sont les grands-parents, arrière-grands-parents… les ancêtres."
    },
    {
      "id": "q15",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "Gaston était « musclé comme un câble de frein ». Cela veut dire qu'il était…",
      "options": [
        "très fort et très costaud",
        "très rapide à vélo",
        "maigre, pas très musclé",
        "toujours en colère"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "L'expression se moque gentiment : Gaston était tout fin, pas du tout musclé."
    },
    {
      "id": "q16",
      "section": "Compréhension globale",
      "type": "synthesis",
      "text": "Quel résumé correspond le mieux à l'histoire ?",
      "options": [
        "En 2014, la classe de Gauthier travaille toute l'année sur la guerre de 1914-1918. Avec l'aide de son grand frère, il construit son arbre généalogique et choisit de parler de Gaston, un ancêtre qui était boxeur avant la guerre. Pendant la guerre, Gaston écrivait les lettres des soldats qui ne savaient pas écrire, d'où son surnom de « porte-plume ». Pendant son exposé, devant toute la classe, Gauthier montre fièrement le vieux fusil de Gaston.",
        "En 2014, la classe de Gauthier travaille toute l'année sur la guerre de 1914-1918. Avec l'aide de sa grand-mère Nona, il construit son arbre généalogique et choisit de parler de Gaston, un ancêtre qui porte le même prénom que son deuxième prénom. Pendant la guerre, Gaston écrivait les lettres des soldats qui ne savaient pas écrire, d'où son surnom de « porte-plume ». Pendant son exposé, Gauthier montre à la classe le stylo-plume de Gaston.",
        "En 2014, la classe de Gauthier travaille toute l'année sur la guerre de 1914-1918. Avec l'aide de sa grand-mère Nona, il construit son arbre généalogique et choisit de parler de Gaston, un ancêtre qui porte le même prénom que son deuxième prénom. Pendant la guerre, Gaston était facteur et apportait le courrier aux soldats dans les tranchées. Pendant son exposé, Gauthier montre la médaille que Gaston a reçue."
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Seul le résumé B est correct. Nona aide Gauthier dans ses recherches. Gaston, ancien ouvrier d'une fabrique de stylos, écrivait les lettres de ses camarades. Il n'a jamais reçu de médaille, et Gauthier montre son stylo-plume."
    }
  ]
};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
