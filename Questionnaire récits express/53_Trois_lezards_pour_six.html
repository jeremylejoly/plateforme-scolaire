<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Trois lézards pour six - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    .progress-bar-wrap {
      background: var(--purple-light);
      height: 8px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .q-section {
      background: var(--purple-light);
      color: var(--purple);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      color: var(--purple-dark);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .opt-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(4px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--purple-light);
      color: var(--purple);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green) !important;
      color: white !important;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red) !important;
      color: white !important;
    }

    .explanation-box {
      background: var(--yellow-light);
      border-left: 4px solid var(--yellow);
      padding: 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.9rem;
      color: var(--yellow-dark);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Trois lézards pour six</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "trois_lezards",
  "title": "Trois lézards pour six",
  "series": "Récits Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle est la particularité de la construction de ce récit écrit par Victoria ?",
      "options": [
        "C'est un échange de SMS entre deux détectives",
        "Il est composé d'articles de blog présentés dans un ordre antichronologique (du vendredi 13 mars au lundi 9 mars)",
        "C'est un recueil d'articles de journaux télévisés",
        "C'est un journal de bord retrouvé dans une bouteille à la mer"
      ],
      "correct": 1,
      "explanation": "Le récit s'ouvre sur le message de fin du vendredi 13 mars à 12h15 et remonte jour après jour jusqu'au premier post explicatif du lundi 9 mars."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Dans le chapitre 1 (vendredi 13 mars, midi), sous quelle apparence les extraterrestres envahissent-ils l'école ?",
      "options": [
        "En policiers municipaux contrôlant les sacs à l'entrée",
        "En équipe d'ouvriers d'entretien pour les ascenseurs, avec boîte à outils et bleus de travail",
        "En nouveaux professeurs remplaçants de sciences",
        "En cuisiniers de la cantine scolaire"
      ],
      "correct": 1,
      "explanation": "Victoria aperçoit trois individus déguisés en techniciens d'ascenseurs (un barbu, un grand à lunettes et un gros avec boîte à outils) dissimulant mal leur queue couverte d'écailles."
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Barthélémy est-il attaqué à la piscine de l'école ?",
      "options": [
        "Il est poussé au fond du grand bassin par un lézard",
        "Un ouvrier sort un pistolet de sa boîte à outils et le désintègre d'un rayon vert fluo au bord de l'eau",
        "Il est téléporté dans les vestiaires à travers un miroir",
        "Il est emmené de force dans un camion d'entretien"
      ],
      "correct": 1,
      "explanation": "Barthélémy, dispensé de natation et lisant au bord du bassin, est visé par le rayon vert du pistolet et disparaît instantanément."
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Victoria et Barthélémy s'étaient-ils déguisés le vendredi matin pour échapper aux regards ?",
      "options": [
        "Victoria en infirmière et Barthélémy en médecin",
        "Victoria avec une perruque brune et des lunettes de soleil, Barthélémy sous un grand poncho rouge de cycliste",

      "correct": 1,
      "explanation": "Pour leur trajet à vélo vers l'école, Victoria porte une perruque brune avec lunettes noires et Barthélémy s'emmitoufle dans un poncho rouge."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment les deux amis neutralisent-ils le motard extraterrestre sur la piste cyclable le long du canal ?",
      "options": [
        "Barthélémy crève les pneus de la moto avec un couteau",
        "Victoria jette son classeur de math, puis ils sautent dans l'herbe ; la moto heurte une poubelle et le pilote plonge dans l'eau",

        "Ils se réfugient dans une péniche amarrée"

      "explanation": "En sautant du vélo, ils provoquent l'accident du motard qui bute contre une poubelle sur le muret et s'envole pour s'écraser dans le canal."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel détail superstitieux obsède Victoria dans son message du vendredi matin (chapitre 3) ?",
      "options": [
        "Un chat noir a traversé la cuisine",

      "correct": 1,
      "explanation": "Victoria panique à l'idée de vivre ses dernières heures un vendredi 13, elle qui scrute chaque matin son horoscope."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que faisaient les adolescents avant l'attaque tragique du car-wash le jeudi soir ?",
      "options": [
        "Ils faisaient leurs devoirs de français dans la véranda",

    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Théo et Léa sont-ils enlevés sous les yeux horrifiés de Victoria et Barthélémy ?",
      "options": [

        "Ils montent volontairement dans une voiture aux vitres teintées"

      "correct": 1,

    },
    {
      "id": "q9",
      "section": "Compréhension (QCM)",

      "text": "Où Victoria et Barthélémy se réfugient-ils pendant plus d'une heure après l'attaque de la voiture ?",

        "Dans le grenier de la maison voisine",

      "explanation": "Terrorisés, ils s'enferment dans le garage et restent cachés derrière le congélateur jusqu'à la tombée de la nuit."

    {
      "id": "q10",
      "section": "Compréhension (QCM)",

    {

      "type": "mcq",

        "Victoria a fait un cauchemar après avoir regardé un film d'horreur",
        "Toute l'histoire est un canular inventé de toutes pièces par Victoria pour prouver qu'on peut faire gober n'importe quelle rumeur aux internautes",
        "Victoria et ses amis ont été transportés dans une autre dimension temporelle",
        "Les lézards étaient des robots créés par le professeur de technologie"
      ],
      "correct": 1,
      "explanation": "Le lundi 9 mars, Victoria explique avoir monté ce faux blog de science-fiction suite à un pari avec Arthur et Jean pour démontrer la crédulité des gens sur Internet."
    }
  ]
};

    let state = {
      student: "",
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function startQuiz() {
      const nameInput = document.getElementById("studentName");
      state.student = nameInput.value.trim() || "Élève";
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen("screen-question");
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById("qSection").textContent = q.section || "Compréhension (QCM)";
      document.getElementById("qCounter").textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById("progressFill").style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById("qText").textContent = q.text;

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";
      document.getElementById("explanationBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      q.options.forEach((optText, i) => {
        const letter = String.fromCharCode(65 + i);
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
        btn.onclick = () => handleAnswer(i, targetCorrect, btn);
        grid.appendChild(btn);
      });
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll(".opt-btn");
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add("correct");
      } else {
        clickedBtn.classList.add("incorrect");
        if (allBtns[correctChoice]) {
          allBtns[correctChoice].classList.add("correct");
        }
      }

      if (q.explanation) {
        const explBox = document.getElementById("explanationBox");
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = "block";
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ""
      });

      const nextBtn = document.getElementById("nextBtn");
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = "Question suivante ➔";
      } else {
        nextBtn.textContent = "Voir mon score 🎉";
      }
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById("resScoreNum").textContent = state.score;

      const details = document.getElementById("resDetails");
      details.innerHTML = '<h3 style="font-family:Nunito,sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement("div");
        item.className = `res-item ${ans.isCorrect ? "is-correct" : "is-incorrect"}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : "";
        item.innerHTML = `
          <span>${ans.isCorrect ? "✅" : "❌"}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById("resTitle").textContent = "🌟 Excellent travail !";
        document.getElementById("resMsg").textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById("resTitle").textContent = "👍 Bon travail !";
        document.getElementById("resMsg").textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById("resTitle").textContent = "💪 À revoir !";
        document.getElementById("resMsg").textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen("screen-results");
    }

    function restart() {
      document.getElementById("studentName").value = "";
      showScreen("screen-start");
    }
  </script>
</body>
</html>
