<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Une vie de robot - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Une vie de robot</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "vie_robot",
  "title": "Une vie de robot",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Jimmy accompagne-t-il son papa au travail ?",
      "options": [
        "Il est malade et ne peut pas rester seul à la maison",
        "Il y a grève à l'école ce jour-là",
        "Il doit faire un exposé sur les robots",
        "Madame Turèche a demandé à le rencontrer"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Grâce à la grève de l'école, Jimmy passe la journée avec son père."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Madame Turèche trouve-t-elle son robot « gravement défectueux » ?",
      "options": [
        "Il n'obéit pas et prend des initiatives, comme sauver une araignée",
        "Il a lancé des tartes aux fraises sur ses invités",
        "Il est tombé en panne et ne s'allume plus du tout",
        "Il a cassé tous les bibelots du salon en faisant le ménage"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Au lieu d'écraser l'araignée, il a dit « J'ai une meilleure idée » et l'a posée dehors."
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que doit faire Futurobow d'un robot dangereux ?",
      "options": [
        "Le vendre moins cher à une autre famille",
        "Le donner à un musée des robots anciens",
        "Le détruire pour éviter tout risque",
        "Le renvoyer chez sa propriétaire après réparation"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Chez Futurobow, on ne prend pas de risque : un robot dangereux est détruit."
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Où Jimmy et Antonin retrouvent-ils Arabella et le robot ?",
      "options": [
        "Au bord du lac de Clairevue",
        "Dans la remise au fond du jardin",
        "Dans l'épicerie de Monsieur Diborno",
        "Dans une cabane en haut d'un arbre, dans la forêt"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Ils grimpent dans un arbre et découvrent la cabane où se cachent Arabella et le robot."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qui a vraiment demandé au robot de casser la chaîne de la remise ?",
      "options": [
        "Arabella, pour le sauver",
        "Le jardinier de Madame Turèche",
        "La robote X1718",
        "Antonin, avec son grille-robot"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Arabella avoue : c'est elle qui lui a donné l'ordre d'ouvrir, pour qu'il ne soit pas détruit."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel nom Arabella a-t-elle donné au robot Y2832 ?",
      "options": [
        "Jiminy",
        "Alfie",
        "Futurobow",
        "Jim"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Elle l'a appelé Alfred, puis Alfie, parce que Y2832 n'est qu'un matricule."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que se passe-t-il quand le papa de Jimmy remet le robot en marche avec de nouveaux circuits ?",
      "options": [
        "Le robot ne sait plus rien faire et reste immobile",
        "Le robot attaque tout le monde dans l'atelier",
        "Le robot demande s'il pourra jouer avec un chien",
        "Le robot se souvient de tout ce qu'il a vécu avec Arabella"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Sa mémoire est effacée, mais sa sensibilité est restée : il rêve de s'occuper d'un chien."
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Alfie peut-il éviter d'être revendu ?",
      "options": [
        "Madame Turèche accepte de le reprendre chez elle",
        "Antonin le cache dans le grenier de son oncle",
        "Arabella l'achète avec son argent de poche",
        "Le papa de Jimmy vend sa voiture de collection pour l'adopter"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Pour sauver Alfie, le papa de Jimmy sacrifie sa voiture de collection."
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Les robots de Futurobow sont très chers : seules les familles riches peuvent en acheter.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : Ils sont à la pointe de la technologie et coûtent très cher."
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Arabella a peur du robot et veut qu'on la libère.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : Elle défend Alfie et se met devant lui pour le protéger."
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Onze ans plus tard, Jimmy vit avec Arabella et Alfie.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : Jimmy, 22 ans, partage son appartement et sa vie avec Arabella ; Alfie vit avec eux."
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Grâce au grille-robot d'Antonin, Jimmy détruit Alfie dans la cabane.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : Arabella oblige Antonin à poser l'arme ; ce sont les policiers qui grillent Alfie plus tard."
    },
    {
      "id": "q13",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "Madame Turèche est « effarée ». Elle est…",
      "options": [
        "très choquée et effrayée",
        "très joyeuse et fière",
        "très fatiguée et endormie",
        "très gourmande et affamée"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Effaré : bouleversé, très choqué par quelque chose."
    },
    {
      "id": "q14",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "Les robots sont censés être « infaillibles ». Cela veut dire qu'ils…",
      "options": [
        "tombent très souvent en panne",
        "ne se trompent jamais",
        "sont très légers",
        "coûtent peu d'argent"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Infaillible : qui ne peut pas se tromper, qui ne fait jamais d'erreur."
    },
    {
      "id": "q15",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "Arabella est « prostrée » sur le canapé. Elle est…",
      "options": [
        "assise bien droite et souriante",
        "debout et en train de danser",
        "abattue, immobile et très triste",
        "en train de dormir profondément"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Prostré : effondré, sans réaction, à cause d'une grande tristesse."
    },
    {
      "id": "q16",
      "section": "Compréhension globale",
      "type": "synthesis",
      "text": "Quel résumé correspond le mieux à l'histoire ?",
      "options": [
        "Un jour de grève, Jimmy accompagne son papa chez Futurobow, une entreprise qui fabrique des robots. Une cliente ramène son robot, qu'elle juge « défectueux » parce qu'il prend des initiatives, et le robot risque d'être détruit. Jimmy et son ami Antonin le retrouvent caché dans une cabane avec Arabella, une petite fille qui l'a appelé Alfie. Jimmy comprend qu'Alfie a une âme, et son papa vend sa voiture de collection pour l'adopter.",
        "Un jour de grève, Jimmy accompagne son papa chez Futurobow, une entreprise qui fabrique des robots. Un robot devenu fou s'enfuit de l'usine en emportant une petite fille, Arabella, qui a très peur de lui. Jimmy et son ami Antonin le retrouvent caché dans une cabane et libèrent Arabella. Le robot est réparé, et Arabella le revend à une famille riche.",
        "Un jour de grève, Jimmy accompagne son papa chez Futurobow, une entreprise qui fabrique des robots. Une cliente ramène son robot, qu'elle juge « défectueux » parce qu'il prend des initiatives, et le robot risque d'être détruit. Jimmy et son ami Antonin le retrouvent caché dans une cabane avec Arabella, une petite fille qui l'a appelé Alfie. Antonin détruit le robot avec son grille-robot, car il pense que c'est le seul moyen de protéger la ville."
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Seul le résumé A est correct. Arabella a aidé Alfie à s'enfuir pour le sauver. Il est grillé par la police, mais le papa de Jimmy le remet en marche : sa sensibilité est restée, et il vend sa voiture pour l'adopter."
    }

};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
