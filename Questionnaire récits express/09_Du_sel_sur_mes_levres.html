<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Du sel sur mes lèvres - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Du sel sur mes lèvres</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "du_sel_sur_mes_levres",
  "title": "Du sel sur mes lèvres",
  "series": "Récits Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Paul appréhende-t-il cette semaine de vacances au camping au début de l'histoire ?",
      "options": [
        "Ses parents lui ont formellement interdit d'aller se baigner dans la mer et à la piscine.",
        "Sa cousine Salomé le délaisse et le considère désormais comme un « petit », ce qui le condamne à l'ennui.",
        "Il a oublié d'emporter ses bandes dessinées et ses raquettes de plage favorites.",
        "Il a peur de dormir seul sous une tente à côté des grands camping-cars."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Paul constate que Salomé a grandi et passe tout son temps avec ses copines. À ses yeux, il n'est plus qu'un petit et il craint de passer une semaine « catastrophique d'ennui ».",
      "correct": 1
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Paul s'invente-t-il le personnage imaginaire de « Super Paulo » ?",
      "options": [
        "Pour impressionner les adultes et obtenir le droit de veiller tard le soir au bar.",
        "Pour se donner du courage, masquer sa timidité et compenser son sentiment d'infériorité face aux grands.",
        "Parce qu'il est officiellement inscrit à un tournoi de raquettes organisé par le camping.",
        "Parce qu'il rêve de devenir comédien et de faire rire sa tante et son oncle."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "« Super Paulo » est l'alter ego héroïque et plein d'assurance que Paul convoque intérieurement pour surmonter sa gêne, son jeune âge et sa timidité.",
      "correct": 1
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle idée originale Paul a-t-il pour surprendre Zélie lors de leur première soirée d'escapade ?",
      "options": [
        "L'emmener boire des cocktails multicolores au bar du camping.",
        "L'aider à grimper sur le toit du cabanon numéro 8 pour contempler la mer et déguster des glaces sous la lune.",
        "Lui faire une démonstration de lancer de frisbee à longue distance sur la plage déserte.",
        "Se faufiler en cachette dans la piscine municipale fermée pour nager dans le grand bassin."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Paul hisse Zélie sur le toit du cabanon numéro 8 pour lui offrir une vue panoramique sur les reflets de la mer et les lumières de la ville, tout en partageant deux glaces.",
      "correct": 1
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qui intervient à la plage pour que Salomé accepte finalement que Paul reste avec le groupe d'adolescents ?",
      "options": [
        "Les parents de Paul qui surveillent discrètement depuis la promenade.",
        "Le maître-nageur sauveteur qui demande aux ados de veiller sur lui.",
        "Lorenzo (le petit ami de Salomé) et Zélie qui prennent la défense de Paul.",
        "Hanna et Louison qui souhaitent jouer avec son frisbee."
      ],
      "answer": 2,
      "points": 1,
      "explanation": "Lorenzo intervient en disant « Laisse-le, c'est ton cousin, il fait pas de mal », suivi de Zélie qui l'invite chaleureusement à rester avec eux.",
      "correct": 2
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Zélie interrompt-elle brusquement la baignade et la partie de raquettes avec Paul à la plage ?",
      "options": [
        "Elle a marché sur une vive dans le sable mouillé et doit se faire soigner.",
        "Elle aperçoit Salomé et les autres arriver et a peur d'être jugée ou moquée par le groupe des ados.",
        "Sa grande sœur Louison lui ordonne sèchement de ranger ses affaires.",
        "Elle est très mauvaise joueuse et ne supporte pas de voir Paul marquer des points."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Zélie panique à l'idée d'être vue en train de jouer avec le « petit cousin » et fuit sur sa serviette pour sauver les apparences et préserver son image de fille « cool ».",
      "correct": 1
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle confidence inattendue Zélie fait-elle à Paul lors de leurs explications le soir ?",
      "options": [
        "Elle habite dans le même quartier que lui et fréquente la même école.",
        "Elle n'est pas plus âgée que lui : elle est dans la même classe et a le même âge, elle est simplement très grande en taille.",
        "Louison n'est pas sa véritable sœur mais une amie d'enfance de sa famille.",
        "Elle a fait semblant de savoir jouer aux raquettes de plage pour lui faire plaisir."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Zélie avoue à Paul qu'elle a le même âge que lui et qu'elle joue les « suiveuses » auprès des grands uniquement par crainte de se retrouver seule pendant les vacances.",
      "correct": 1
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel geste Paul fait-il en échange de la lettre et de la photo que Zélie lui a données ?",
      "options": [
        "Il lui offre son frisbee avec lequel il a battu son record de distance.",
        "Il lui remet une photo d'identité de lui récupérée dans le portefeuille de sa mère pour être « à égalité ».",
        "Il lui achète un coquillage gravé à la boutique de souvenirs du camping.",
        "Il lui écrit un poème sur le dos du plan du camping."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Paul court demander à sa mère la photo de lui qu'elle garde dans son portefeuille et la tend à Zélie en lui disant : « Comme ça, on est à égalité ».",
      "correct": 1
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que signifie la présence de Zélie au pied du cabanon numéro 10 lors du départ en camping-car ?",
      "options": [
        "Elle s'est perdue sur la plage en cherchant le chemin du mobil-home.",
        "Elle confirme que leur histoire continue : après le cabanon 8 et le cabanon 9, le rendez-vous au suivant est pris.",
        "Elle vient réclamer l'adresse postale que Paul a oublié de lui inscrire.",
        "Elle attend l'arrivée de nouveaux vacanciers pour commencer une nouvelle partie."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Zélie salue Paul au pied du cabanon 10 pour lui rappeler leur jeu et leur promesse : leur lien et leurs lettres continueront bien après ces vacances.",
      "correct": 1
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Paul et sa cousine Salomé dorment dans le même camping-car avec leurs parents respectifs.",

      "points": 1,
      "explanation": "C'est FAUX. Les adultes dorment dans les camping-cars, tandis que Paul et Salomé ont chacun leur propre tente sur l'emplacement 359.",
      "correct": false
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Zélie et Louison sont sœurs et résident dans un mobil-home situé dans le camping.",
      "answer": true,
      "points": 1,
      "explanation": "C'est VRAI. Paul observe qu'elles ont un net air de famille et rejoignent le même mobil-home.",
      "correct": true
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Lors de la soirée disco du vendredi, Paul refuse de danser le slow avec Zélie par peur du ridicule.",
      "answer": false,
      "points": 1,
      "explanation": "C'est FAUX. Au contraire, Paul saisit cette occasion pour inviter Zélie et prouver aux autres qu'il ne se dégonfle pas.",
      "correct": false
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "À la fin de l'histoire, Paul a gardé l'habitude de poser des grains de sel sur ses lèvres pour retrouver le souvenir de Zélie.",
      "answer": true,
      "points": 1,
      "explanation": "C'est VRAI. Ce rituel lui rappelle le goût salé de leurs baisers, l'écume de la mer et leur dessert partagé sur le toit du cabanon.",
      "correct": true
    },
    {
      "id": "q13",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Salomé avait déjà pris la tangente et le chemin de la plage. » Dans cette phrase, que signifie l'expression « prendre la tangente » ?",
      "options": [
        "Mesurer un angle précis le long d'une courbe de niveau.",
        "S'éclipser ou s'enfuir discrètement pour échapper à une corvée ou à une présence gênante.",

      "answer": 1,
      "points": 1,

    },
    {
      "id": "q14",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Nous étions tous les deux dans une situation un peu similaire, des « suiveurs ». » Dans ce contexte, que désigne un « suiveur » ?",

        "Une personne qui s'efforce d'imiter et de suivre les autres pour être acceptée dans un groupe, sans imposer ses choix.",

      "answer": 1,
      "points": 1,
      "explanation": "Un « suiveur » est une personne qui se met en retrait et adopte l'attitude des membres dominants d'un groupe pour ne pas être rejetée.",

    {
      "id": "q15",
      "section": "Vocabulaire",

    {

      "text": "Un seul de ces trois résumés est totalement correct. Lequel ?",
      "options": [
        "Résumé A : Paul passe des vacances décevantes au camping car sa cousine Salomé l'ignore pour rester avec ses copines. Pour s'occuper, il participe à un tournoi de frisbee qu'il remporte face à Lorenzo. Tombé amoureux de Louison, une collégienne plus âgée, il tente de l'inviter à la soirée disco mais celle-ci le rejette devant tout le monde.",
        "Résumé B : Délaissé au camping par sa cousine Salomé qui fréquente une bande d'adolescents, Paul fait la rencontre de Zélie. Pensant d'abord qu'elle est plus âgée, il découvre qu'elle a son âge et partage les mêmes doutes face au regard du groupe. De leur complicité nocturne sur les cabanons de plage à la soirée disco, naît leur premier amour de vacances, scellé par une promesse d'adieu.",
        "Résumé C : En vacances à la montagne avec ses parents, Paul passe ses journées à lire des livres sous sa tente. Après une bagarre avec les jeunes du village, il est recueilli par Zélie qui lui apprend à nager dans un lac. Le jour du départ, Paul s'enfuit du camping-car pour rester vivre au village avec son amie."
      ],
      "answer": 1,
      "points": 1,
      "explanation": "Le Résumé B retrace parfaitement l'intrigue, les personnages (Paul, Salomé, Zélie), le cadre (camping en bord de mer), les thèmes clés (peur du regard des autres, passage à l'adolescence) et le dénouement émouvant.",
      "correct": 1
    }
  ]
};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
