<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Au pays des longs nuages blancs - Récit Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récit Express</div>
    <h1>Au pays des longs nuages blancs</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "longs_nuages",
  "title": "Au pays des longs nuages blancs",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Alice et son père partent-ils en Nouvelle-Zélande ?",
      "options": [
        "Sa mère les a invités à la rejoindre pour les vacances de Noël",
        "Son père a toujours rêvé de visiter ce pays avec sa famille",
        "Sa mère a eu un grave accident de parapente et ne peut pas rentrer en France",

      "options": [
        "C'est un pêcheur maori qui protège les eaux de Great Barrier",

    {
      "id": "q3",

      "options": [
        "Il pensait que Bill chassait illégalement dans ses eaux territoriales",
        "Il avait repéré Alice dans son cabanon et voulait la faire fuir de l'île",
        "Il voulait tester son fusil à lunette depuis la falaise qui surplombe la baie",
        "Il ne supportait plus de voir des bateaux de pêche sur les lieux où son dauphin ami avait été tué par des pêcheurs à la dynamite"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel est le cadeau de Noël que Pita offre à Alice ?",
      "options": [
        "Il lui apprend à exécuter le haka, la danse de guerre traditionnelle maorie",
        "Il lui offre une statuette sculptée représentant un dauphin",
        "Il l'emmène en mer assister au passage d'une horde de centaines de dauphins",
        "Il lui prépare un festin de langoustes pêchées avec le vieux Bill"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",

      "text": "Pourquoi Alice ne dit-elle rien de son escapade dans le bush à ses parents ni à Bill ?",
      "options": [
        "Elle ne veut pas inquiéter sa mère qui est encore convalescente",
        "Elle avait promis de ne pas emprunter les sentiers non balisés et avait pénétré dans une propriété privée",
        "Elle pense que personne ne la croirait si elle parlait du Maori tatoué",
        "Elle veut mener elle-même l'enquête sur l'identité de cet homme mystérieux"
      ],
      "answer": 1,
      "points": 1,
      "correct": 1
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que révèle la réaction de Tobby, le chien de Bill, face à Pita Witkaire ?",
      "options": [
        "Que le chien reconnaît Pita comme un habitant régulier de l'île",
        "Qu'il est mal éduqué et réagit de manière imprévisible face aux inconnus",
        "Que Pita inspire une peur instinctive même aux animaux, soulignant le danger qu'il représente",
        "Que le chien a déjà été blessé par cet homme lors d'une rencontre précédente"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qu'est-ce que l'histoire de Pita et de son dauphin Sweety révèle sur la situation des Maoris ?",
      "options": [
        "Que les Maoris préfèrent vivre en isolation totale pour préserver leurs traditions",
        "Que Pita est le seul Maori à encore pratiquer les anciennes coutumes de son peuple",
        "Que les Maoris ont perdu leurs terres et leur mode de vie traditionnel, et que leur lien avec la nature est le dernier vestige de leur identité culturelle",
        "Que les pêcheurs néo-zélandais respectent en général la nature et les coutumes maoies"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Alice écrit-elle à son amie Emma une lettre si détaillée sur les opossums ?",
      "options": [
        "Elle veut impressionner Emma avec ses connaissances scientifiques sur les espèces invasives",
        "Elle partage une réflexion sur l'équilibre naturel et les conséquences désastreuses quand l'homme modifie l'écosystème, un thème qui fait écho à l'histoire de Pita et son dauphin",
        "Elle cherche à décourager Emma de venir la rejoindre en Nouvelle-Zélande",
        "Elle sait qu'Emma adore les animaux et veut lui faire découvrir cette espèce exotique"
      ],
      "answer": 1,
      "points": 1,
      "correct": 1
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Alice et son père arrivent en Nouvelle-Zélande en plein hiver, sous la neige.",
      "answer": false,
      "points": 1,
      "correct": false
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "La mère d'Alice est géographe et se trouve en Nouvelle-Zélande pour une mission professionnelle.",
      "answer": true,
      "points": 1,
      "correct": true
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Pita Witkaire est un simple pêcheur maori qui vit seul sur l'île de Great Barrier.",
      "answer": false,
      "points": 1,
      "correct": false
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "À la fin du roman, Pita et ses amis maoris dansent le haka pour Alice et sa famille avant leur départ.",
      "answer": true,
      "points": 1,
      "correct": true
    },
    {
      "id": "q13",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Le Maori empoigna une sorte de casse-tête, lança un chant guttural et avança d'un pas en brandissant son arme. » Que signifie le mot guttural ?",
      "options": [
        "Très mélodieux et agréable à entendre, comme un chant d'oiseau",
        "Très doux et murmuré, pour ne pas être entendu de loin",
        "Rauque et profond, qui vient du fond de la gorge",
        "Aigu et perçant, qui résonne au loin comme un sifflet"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q14",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Je voulais lui demander s'il n'était pas plus prudent de rester sur ce qui restait du Zodiac, mais Bill ne m'a pas laissée tergiverser : si je me sentais capable de nager jusqu'à la côte, il fallait y aller maintenant. » Que signifie tergiverser ?",
      "options": [
        "Nager rapidement pour se mettre à l'abri",
        "Hésiter, tarder à prendre une décision en cherchant des raisons de ne pas agir",
        "Protester en criant pour exprimer son mécontentement",
        "Demander de l'aide à voix haute pour attirer l'attention"
      ],
      "answer": 1,
      "points": 1,
      "correct": 1
    },
    {
      "id": "q15",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Il avait vu rouge en nous voyant pêcher sur les lieux du crime, mais il ne voulait pas aller jusque là. C'est en nous voyant dériver dangereusement qu'il avait réalisé ce qu'il avait fait. » Que signifie l'expression voir rouge ?",
      "options": [
        "Apercevoir une couleur vive dans son champ de vision à cause du soleil",
        "Regarder la mer avec inquiétude en espérant retrouver quelqu'un",
        "Ressentir une grande tristesse face à une situation injuste",
        "Être envahi par une colère si violente qu'on perd le contrôle de ses actes"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q16",
      "section": "Synthèse",
      "type": "mcq",
      "text": "Un seul de ces trois résumés est totalement correct. Lequel ?",
      "options": [
        "Résumé A : Alice et son père rejoignent sa mère en Nouvelle-Zélande. Lors d'une sortie en mer avec Bill, un pêcheur maori nommé Pita tire sur leur bateau car il les prend pour des braconniers d'opossums. Alice retrouve Pita dans le bush, lui offre une statuette de dauphin sculptée et Pita accepte d'accompagner la famille pour leur retour en France.",
        "Résumé B : Alice et son père rejoignent sa mère convalescente en Nouvelle-Zélande sur l'île de Great Barrier. Lors d'une sortie en mer avec leur voisin Bill, leur Zodiac est pris pour cible par Pita, un chef maori blessé par la mort de son dauphin ami. Alice fait la connaissance de Pita dans le bush, découvre sa culture et apaise sa colère. Pour Noël, Pita lui offre le spectacle d'une horde de dauphins et lui danse un haka d'adieu.",
        "Résumé C : Alice et son père partent en vacances de Noël en Nouvelle-Zélande. Après le naufrage de leur Zodiac provoqué par Pita, Alice avoue immédiatement l'incident à ses parents. Son père et Bill portent plainte auprès des autorités de l'île, mais Alice convainc la police de pardonner à Pita après qu'il lui a appris à danser le haka."

      "points": 1,
      "correct": 1

};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
