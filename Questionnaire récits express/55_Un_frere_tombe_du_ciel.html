<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Un frère tombé du ciel - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    .progress-bar-wrap {
      background: var(--purple-light);
      height: 8px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .q-section {
      background: var(--purple-light);
      color: var(--purple);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      color: var(--purple-dark);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .opt-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(4px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--purple-light);
      color: var(--purple);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green) !important;
      color: white !important;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red) !important;
      color: white !important;
    }

    .explanation-box {
      background: var(--yellow-light);
      border-left: 4px solid var(--yellow);
      padding: 1rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.9rem;
      color: var(--yellow-dark);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Un frère tombé du ciel</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "un_frere_tombe_du_ciel",
  "title": "Un frère tombé du ciel",
  "series": "Récits Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel succès scolaire rend Jessica très fière au tout début de l'histoire ?",
      "options": [
        "Elle a gagné le concours de dictée de l'école",
        "Elle a obtenu un 19/20 en mathématiques et a battu Adrien, le premier de la classe",
        "Elle a été élue déléguée de classe à l'unanimité",
        "Elle a réussi son examen de passage au conservatoire"
      ],
      "correct": 1,
      "explanation": "Jessica commence sa journée en beauté grâce à un 19 en mathématiques qui lui permet de devancer Adrien et son 17."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle grande nouvelle inattendue les parents de Jessica lui annoncent-ils ?",
      "options": [
        "Ils vont déménager dans une grande villa en bord de mer",
        "Démouto, le fils que son père a eu en Afrique avant de venir en France, arrive pour vivre avec eux et partagera sa chambre",
        "Sa mère attend des jumeaux pour le printemps prochain",
        "Son père a été muté pour trois ans à l'étranger"
      ],
      "correct": 1,
      "explanation": "Le père a enfin obtenu les papiers pour faire venir Démouto (qui a 2 ans de plus qu'elle) et demande à Jessica de partager sa chambre avec lui."
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel vêtement convoité Jessica rêve-t-elle de s'offrir dans les Grandes Galeries ?",
      "options": [
        "Une robe de soirée bleue à paillettes",
        "Un pull rose et blanc avec un dessin de panthère sur le devant",
        "Un blouson en cuir noir style motard",
        "Une paire de baskets montantes dorées"
      ],
      "correct": 1,
      "explanation": "Jessica a repéré le pull de ses rêves (rose et blanc avec une panthère) et comptait utiliser sa technique de persuasion pour l'obtenir."
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle première impression Démouto donne-t-il lors de son arrivée à l'aéroport ?",
      "options": [
        "Il est joyeux, bavard et court partout dans le terminal",
        "Il est très maigre, grelotte dans un tee-shirt fluo, semble intimidé et ne parle que lingala avec son père",
        "Il est habillé en costume chic et refuse de saluer son père",
        "Il est accompagné de musiciens traditionnels africains"
      ],
      "correct": 1,
      "explanation": "Épuisé par le voyage, Démouto grelotte dans un tee-shirt trop léger, évite le regard de Jessica et de sa belle-mère et ne parle que sa langue natale."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi la mère de Jessica refuse-t-elle finalement d'acheter le pull panthère lors du shopping ?",
      "options": [
        "Le pull a été vendu à une autre cliente sous ses yeux",
        "Le voyage de Démouto et l'achat de tous ses vêtements d'hiver ont coûté très cher, repoussant l'achat au mois suivant",
        "Jessica a eu une mauvaise note en français le matin même",
        "La couleur du pull ne plaisait pas à son père"
      ],
      "correct": 1,
      "explanation": "Le budget familial étant serré après les frais du voyage et l'achat indispensable d'un manteau chaud pour Démouto, la mère reporte l'achat du pull."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Démouto est-il placé dans la même classe d'école primaire que Jessica ?",
      "options": [
        "Parce que le collège refuse les nouveaux élèves au mois de décembre",
        "Parce qu'il n'a pas été scolarisé ces derniers temps en Afrique et doit consolider son français",
        "Parce qu'il a demandé à rester aux côtés de sa sœur en classe",
        "Parce qu'il est trop jeune pour entrer en sixième"
      ],
      "correct": 1,
      "explanation": "Sa mère n'ayant plus les moyens de l'envoyer à l'école en Afrique, Démouto doit rattraper son retard et perfectionner son français avant d'intégrer le collège."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel camarade de classe désagréable s'en prend à Jessica et Démouto ?",
      "options": [
        "Adrien, jaloux de la note de math de Jessica",
        "Lucas, qui affuble Jessica du sobriquet « Noix de coco » et lance des piques racistes",
        "Jules, le voisin de table de Lucie",
        "Marc, le délégué de classe du premier trimestre"
      ],
      "correct": 1,
      "explanation": "Lucas est le perturbateur de la classe qui se moque des origines de Jessica et Démouto avec des remarques blessantes."
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Jessica réagit-elle lorsque Lucas humilie Démouto en leçon d'éducation civique ?",
      "options": [
        "Elle rit avec les autres pour ne pas se faire remarquer",
        "Elle riposte vivement en remettant Lucas à sa place, ce qui lui vaut d'être collé par la maîtresse",
        "Elle quitte la classe en pleurant",
        "Elle demande à changer de place immédiatement"
      ],
      "correct": 1,
      "explanation": "Indignée par l'attitude de Lucas, Jessica prend fermement la défense de son demi-frère en lançant une réplique cinglante à Lucas."
    },
    {
      "id": "q9",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que dit le père à Jessica lors de leur discussion intime dans la chambre ?",
      "options": [
        "Qu'elle doit cesser de regarder la télévision le soir",
        "Qu'elle doit faire preuve de patience et qu'elle finira par découvrir tout ce qu'elle a en commun avec son frère",
        "Qu'il regrette d'avoir fait venir Démouto en France",
        "Qu'il va renvoyer Démouto vivre chez sa mère"
      ],
      "correct": 1,
      "explanation": "Le père comprend le désarroi de Jessica mais lui demande d'être patiente, persuadé que le temps révélera leurs nombreux points communs fraternels."
    },
    {
      "id": "q10",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que se passe-t-il lorsque les parents sont absents au salon du jouet à Paris ?",
      "options": [
        "Une fuite d'eau inonde l'appartement",
        "Démouto tombe gravement malade avec 39°C de fièvre et s'effondre sur son lit",
        "Lucas vient jeter des cailloux sur les fenêtres",
        "Démouto décide de s'enfuir pour retourner en Afrique"
      ],
      "correct": 1,
      "explanation": "Resté seul avec Jessica, Démouto est pris d'une violente fièvre (39°C), de sueurs froides et de difficultés respiratoires alarmantes."
    },
    {
      "id": "q11",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quels gestes de secours Jessica prodigue-t-elle à Démouto avant l'arrivée des secours ?",
      "options": [
        "Elle lui fait boire du thé brûlant au citron",
        "Elle lui applique des compresses et un gant d'eau fraîche sur le front et la nuque pour apaiser sa fièvre",
        "Elle lui donne des médicaments trouvés dans l'armoire",
        "Elle lui fait faire des exercices de respiration sur le balcon"
      ],
      "correct": 1,
      "explanation": "Imitant ce que fait sa mère lorsqu'elle est malade, Jessica tamponne le front et la nuque de Démouto avec un gant d'eau fraîche pour le soulager."
    },
    {
      "id": "q12",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi le médecin de l'hôpital garde-t-il Démouto sous surveillance médicale stricte ?",
      "options": [
        "Parce qu'il a contracté une maladie tropicale contagieuse",
        "Parce que son organisme n'est pas encore habitué aux virus européens et que la grippe risque d'évoluer en infection pulmonaire",
        "Parce qu'il doit subir une opération chirurgicale au genou",
        "Parce qu'il a fait une grave intoxication alimentaire"
      ],
      "correct": 1,
      "explanation": "Le médecin explique que le système immunitaire d'un enfant venant d'arriver d'Afrique n'a pas les défenses contre les virus hivernaux d'Europe."
    },
    {
      "id": "q13",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle leçon de vie Démouto transmet-il à Jessica lors de leurs discussions à l'hôpital ?",
      "options": [

        "Que la vie en Europe est trop compliquée pour lui"
      ],
      "correct": 1,
      "explanation": "Alors que Jessica doute de son identité métisse (« 50% blanche, 50% noire »), Démouto lui ouvre les yeux sur la chance magnifique de posséder deux cultures."
    },
    {
      "id": "q14",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Démouto aide-t-il Jessica à se coiffer pour l'anniversaire de Lucie ?",

      ],
      "correct": 1,
      "explanation": "Grâce au savoir-faire appris en observant sa mère, Démouto transforme la chevelure rebelle de Jessica en une magnifique coiffure tressée façon Alicia Keys."
    },
    {
      "id": "q15",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle tenue originale Jessica invente-t-elle avec le tissu offert par Démouto ?",
      "options": [
        "Un déguisement de princesse orientale",
        "Un ensemble « jean-pagne » stylé et métissé porté pour un défilé de mode improvisé dans la chambre",

        "Une veste d'hiver rembourrée avec de la laine"
      ],
      "correct": 1,
      "explanation": "Jessica drape le pagne multicolore par-dessus son jean pour créer un look métissé et défile avec fierté sous les rires complices de son frère."

    {
      "id": "q16",

      "type": "mcq",

        "Il lui déclare d'un air très sérieux qu'il est un grand sorcier capable de transformer les enfants malpolis en petits cochons roses",

        "Il quitte la table en claquant la porte de la salle à manger"
      ],
      "correct": 1,
      "explanation": "Démouto fixe Jules sans ciller et lui sort cette réplique magique, pétrifiant le petit moqueur qui s'enfuit sans demander son reste, sous l'admiration de Jessica qui l'appelle enfin « mon frère »."
    }
  ]
};

    let state = {
      student: "",
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function startQuiz() {
      const nameInput = document.getElementById("studentName");
      state.student = nameInput.value.trim() || "Élève";
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen("screen-question");
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById("qSection").textContent = q.section || "Compréhension (QCM)";
      document.getElementById("qCounter").textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById("progressFill").style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById("qText").textContent = q.text;

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";
      document.getElementById("explanationBox").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      q.options.forEach((optText, i) => {
        const letter = String.fromCharCode(65 + i);
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
        btn.onclick = () => handleAnswer(i, targetCorrect, btn);
        grid.appendChild(btn);
      });
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll(".opt-btn");
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add("correct");
      } else {
        clickedBtn.classList.add("incorrect");
        if (allBtns[correctChoice]) {
          allBtns[correctChoice].classList.add("correct");
        }
      }

      if (q.explanation) {
        const explBox = document.getElementById("explanationBox");
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = "block";
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ""
      });

      const nextBtn = document.getElementById("nextBtn");
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = "Question suivante ➔";
      } else {
        nextBtn.textContent = "Voir mon score 🎉";
      }
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById("resScoreNum").textContent = state.score;

      const details = document.getElementById("resDetails");
      details.innerHTML = '<h3 style="font-family:Nunito,sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement("div");
        item.className = `res-item ${ans.isCorrect ? "is-correct" : "is-incorrect"}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : "";
        item.innerHTML = `
          <span>${ans.isCorrect ? "✅" : "❌"}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById("resTitle").textContent = "🌟 Excellent travail !";
        document.getElementById("resMsg").textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById("resTitle").textContent = "👍 Bon travail !";
        document.getElementById("resMsg").textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById("resTitle").textContent = "💪 À revoir !";
        document.getElementById("resMsg").textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen("screen-results");
    }

    function restart() {
      document.getElementById("studentName").value = "";
      showScreen("screen-start");
    }
  </script>
</body>
</html>
