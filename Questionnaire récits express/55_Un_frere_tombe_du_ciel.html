<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Un frère tombé du ciel - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Un frère tombé du ciel</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "un_frere_tombe_du_ciel",
  "title": "Un frère tombé du ciel",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quelle nouvelle les parents annoncent-ils à Jessica ?",
      "options": [
        "Ils vont bientôt déménager dans une maison plus grande",
        "Sa maman attend un bébé pour le printemps",
        "Son papa va partir travailler un an en Afrique",
        "Démouto, le fils de son papa, vient vivre chez eux"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Démouto est le fils que son papa a eu en Afrique. Il a deux ans de plus que Jessica et va partager sa chambre."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Jessica n'a-t-elle pas le pull de ses rêves ?",
      "options": [
        "Il n'y a plus sa taille dans le magasin",
        "Il faut d'abord habiller Démouto pour l'hiver",
        "Elle a eu une très mauvaise note en mathématiques",
        "Son papa trouve que ce pull est trop voyant"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Le voyage de Démouto a coûté cher. Sa maman doit d'abord lui acheter des vêtements chauds et promet le pull pour le mois suivant."
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Démouto va-t-il dans la classe de Jessica ?",
      "options": [
        "Il a demandé à rester à côté de sa sœur",
        "Il est arrivé trop tard pour l'école secondaire",
        "Il n'allait plus à l'école et a du retard",
        "La maîtresse de Jessica parle le lingala"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Sa maman n'avait plus assez d'argent pour l'envoyer à l'école. Il n'a pas encore le niveau pour aller dans l'enseignement secondaire."
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Lucas se moque-t-il de Démouto en classe ?",
      "options": [
        "Démouto cite le premier ministre de son pays",
        "Démouto ne sait pas lire l'heure sur l'horloge",
        "Démouto s'est trompé de classe ce matin-là",
        "Démouto parle lingala avec la maîtresse"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "La maîtresse demande le nom du premier ministre. Démouto donne celui de son pays d'Afrique, et Lucas éclate de rire."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que se passe-t-il quand les parents sont partis au salon du jouet ?",
      "options": [
        "Lucas vient sonner à la porte pour les embêter",
        "Jessica se perd en rentrant de l'école",
        "Démouto s'enfuit pour retourner en Afrique",
        "Démouto tombe malade et a beaucoup de fièvre"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Démouto a chaud, mal à la tête et 39 °C de fièvre. Jessica est seule avec lui et commence à avoir très peur."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Jessica aide-t-elle Démouto avant le retour des parents ?",
      "options": [
        "Elle lui donne des médicaments trouvés dans l'armoire",
        "Elle lui rafraîchit le front avec un gant mouillé",
        "Elle lui prépare un grand bol de soupe chaude",
        "Elle appelle le médecin de la famille"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Jessica fait comme sa maman quand elle est malade : elle tamponne le front et la nuque de Démouto avec un gant de toilette mouillé."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qu'est-ce que Démouto explique à Jessica à l'hôpital ?",
      "options": [
        "Avoir deux cultures, c'est une richesse",
        "Il préfère repartir vivre en Afrique avec sa maman",
        "Il ne veut plus jamais aller à l'école",
        "Il a peur de rester seul à l'hôpital"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Jessica ne sait pas si elle est « blanche ou noire ». Démouto lui dit qu'elle est riche, car elle a deux cultures."
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Démouto fait-il taire le petit cousin Jules ?",
      "options": [
        "Il le dispute très fort devant toute la famille réunie",
        "Il demande à la grand-mère de le punir",
        "Il dit qu'il peut le changer en petit cochon rose",
        "Il quitte la table sans dire un mot"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Démouto dit très sérieusement qu'il est un sorcier. Jules en reste bouche bée et s'en va. Jessica l'appelle alors « mon frère » pour la première fois."
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Au début, Jessica pense dire à ses copines que Démouto est un cousin éloigné.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : elle ne veut pas expliquer qu'elle a un demi-frère. Elle pense même dire qu'il est venu se faire opérer du cœur !"
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Quand il arrive, Démouto parle surtout le lingala avec son papa.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : il est intimidé. Parler sa langue avec son papa le rassure, mais Jessica se sent mise à l'écart."
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Démouto ne sait pas du tout parler le français.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : il parle très bien le français. Il était surtout timide et perdu dans ce nouveau pays."
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Après la dispute en classe, c'est Jessica qui est punie.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : c'est Lucas qui est puni : il doit rester en retenue pendant la récréation."
    },
    {
      "id": "q13",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Il reste planté comme un « i », alors que tout le monde est déjà assis. » Que veut dire « rester planté comme un i » ?",
      "options": [
        "S'asseoir très vite",
        "Rester debout, tout droit, sans bouger",
        "Lever la main pour parler",
        "Écrire la lettre i au tableau"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Comme la lettre i, Démouto reste tout droit et immobile. Il n'ose pas s'asseoir."
    },
    {
      "id": "q14",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Je me pavane avec mon jean-pagne, en secouant mes tresses. » Que veut dire « se pavaner » ?",
      "options": [
        "Marcher fièrement pour se faire admirer",
        "Se cacher parce qu'on a un peu honte",
        "Danser en faisant beaucoup d'erreurs",
        "Courir vite pour ne pas être en retard"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Se pavaner, c'est marcher avec fierté pour qu'on nous admire, comme un paon qui fait la roue."
    },
    {
      "id": "q15",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Je comprends que cette nouvelle te bouleverse. » Que veut dire « bouleverser » ?",
      "options": [
        "Faire rire aux éclats",
        "Rendre très fatigué",
        "Laisser indifférent",
        "Émouvoir très fort"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Une nouvelle qui bouleverse provoque une très forte émotion. Jessica est choquée d'apprendre qu'elle a un frère."
    },
    {
      "id": "q16",
      "section": "Compréhension globale",
      "type": "synthesis",
      "text": "Quel résumé correspond le mieux à l'histoire ?",
      "options": [
        "Jessica apprend que Démouto, le fils que son papa a eu en Afrique, vient vivre chez eux et va partager sa chambre. Au début, elle est jalouse et le rejette, d'autant plus qu'il se retrouve dans sa classe. Un soir, Démouto tombe gravement malade pendant que les parents sont absents, et Jessica s'occupe de lui. Peu à peu, elle apprend à le connaître et finit par l'appeler « mon frère ».",
        "Jessica apprend que Démouto, le fils que son papa a eu en Afrique, vient vivre chez eux et va partager sa chambre. Au début, elle est jalouse et le rejette, d'autant plus qu'il se retrouve dans sa classe. Un soir, Démouto tombe gravement malade pendant que les parents sont absents, et Jessica appelle Lucas à l'aide. Démouto repart ensuite en Afrique, et Jessica ne le revoit plus.",
        "Jessica apprend que Démouto, le fils que son papa a eu en Afrique, vient vivre chez eux et va partager sa chambre. Au début, elle est ravie et le présente fièrement à toutes ses copines. Un soir, Démouto tombe gravement malade pendant que les parents sont absents, et Jessica s'occupe de lui. Mais ils se disputent à l'hôpital, et Démouto demande à changer de chambre."
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Seul le résumé A est correct. Jessica rejette d'abord Démouto. Seule avec lui quand il a de la fièvre, elle le soigne. À l'hôpital, il lui parle de la richesse d'avoir deux cultures ; après l'épisode du cousin Jules, elle l'appelle « mon frère »."
    }
  ]
};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
