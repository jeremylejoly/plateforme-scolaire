<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Papier froissé - Récit Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récit Express</div>
    <h1>Papier froissé</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "papier_froisse",
  "title": "Papier froissé",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "De quelle ville vient Juliette avant son déménagement ?",
      "options": [
        "Paris",
        "Lyon",
        "Lille",
        "Bordeaux"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel est le pseudo de Colombe sur Minecraft ?",
      "options": [
        "Zoey la mécano",
        "ColombeCatacombe",
        "BluePower",
        "PowerGirl"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Quel est le sujet choisi par Juliette et Gabriel pour leur exposé ?",
      "options": [
        "Les jeux vidéo et la violence",
        "La différence et le respect",
        "Le harcèlement à l'école",
        "Les réseaux sociaux"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment s'appelle la meilleure amie de Juliette restée à Lille ?",
      "options": [
        "Fatou",
        "Marion",
        "Gaëlle",
        "Agathe"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Colombe reste-t-elle seule dans son coin depuis la rentrée de septembre ?",
      "options": [
        "Elle a décidé de ne plus parler à personne par timidité naturelle",
        "Madame Bourdelet lui a demandé de rester à l'écart des autres",
        "Elle attend de connaître les élèves avant de se faire des amis",
        "Elle a beaucoup grandi pendant l'été et son changement physique la fait se sentir différente et mal à l'aise au milieu des autres"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Colombe réagit-elle avec agressivité quand Juliette lui demande pourquoi elle se laisse embêter ?",
      "options": [
        "Elle n'aime pas Juliette et veut qu'elle parte",
        "Elle se sent envahie dans son espace et ne fait pas encore confiance à Juliette",
        "Elle est en colère contre Gabriel, pas contre Juliette",
        "Elle pense que Juliette se moque d'elle comme les autres"
      ],
      "answer": 1,
      "points": 1,
      "correct": 1
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que veut montrer l'exercice de la feuille froissée dans l'exposé ?",
      "options": [
        "Que le papier recyclé est utile en classe",
        "Que les excuses suffisent à réparer les erreurs",
        "Que les blessures causées par les mots restent comme des cicatrices, même après les excuses",
        "Que tout le monde peut changer s'il le veut vraiment"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qu'est-ce qui montre que la situation de Colombe s'améliore à la fin du roman ?",
      "options": [
        "Marjorie s'excuse auprès d'elle publiquement",
        "Madame Bourdelet félicite Colombe devant toute la classe",
        "Colombe décide de quitter l'école pour aller au collège",
        "Elle est invitée à un anniversaire, se fait une vraie amie et reçoit un SMS touchant de Gabriel"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Juliette pratique le judo dans son club à Lille.",
      "answer": true,
      "points": 1,
      "correct": true
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Marjorie est jalouse de Colombe parce qu'elle est plus grande qu'elle.",
      "answer": false,
      "points": 1,
      "correct": false
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Gabriel et Colombe se connaissent depuis le CP.",
      "answer": true,
      "points": 1,
      "correct": true
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "À la fin du roman, Colombe n'a toujours jamais parlé à Juliette de ses problèmes avec Marjorie.",
      "answer": false,
      "points": 1,
      "correct": false
    },
    {
      "id": "q13",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Juliette observe ses futurs camarades avec sa figure renfrognée et ses bras croisés. » — Que signifie renfrognée ?",
      "options": [
        "Souriante et accueillante",
        "Distraite et dans les nuages",
        "Fatiguée après un long voyage",
        "Qui exprime la mauvaise humeur, le mécontentement sur le visage"
      ],
      "answer": 3,
      "points": 1,
      "correct": 3
    },
    {
      "id": "q14",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Marjorie est venue s'approcher de Gabriel en minaudant, comme d'habitude. » — Que signifie minauder ?",
      "options": [
        "Parler très fort pour attirer l'attention",
        "Faire des manières, des sourires exagérés pour séduire ou plaire",
        "Chuchoter pour ne pas être entendue",
        "Avancer lentement et en hésitant"
      ],
      "answer": 1,
      "points": 1,
      "correct": 1
    },
    {
      "id": "q15",
      "section": "Vocabulaire",
      "type": "mcq",
      "text": "« Elles sont intarissables : sur l'école, sur Madame Bourdelet, sur les garçons… » — Que signifie intarissables ?",
      "options": [
        "Difficiles à comprendre quand elles parlent",
        "Très discrètes et réservées",
        "Qui ne s'arrêtent pas de parler, comme une source qui ne se tarit jamais",
        "Impolies et irrespectueuses"
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    },
    {
      "id": "q16",
      "section": "Synthèse",
      "type": "mcq",
      "text": "Un seul de ces trois résumés est totalement correct. Lequel ?",
      "options": [
        "Résumé A : C'est Gabriel qui organise les moqueries contre Colombe, pas Marjorie.",
        "Résumé B : Le journal intime de Colombe a été offert par sa maîtresse, pas par sa tante.",
        "Résumé C : Juliette arrive en cours d'année dans une petite école du sud, loin de Lille et de ses amis. Elle remarque vite que Colombe, une camarade grande et solitaire, est la cible de moqueries répétées. Avec Gabriel, elle prépare un exposé sur le harcèlement scolaire, illustré par l'image d'une feuille froissée. Grâce à cela, le regard de la classe sur Colombe commence à changer, et les deux filles deviennent de vraies amies."
      ],
      "answer": 2,
      "points": 1,
      "correct": 2
    }
  ]
};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
