<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire : Le passeur de mémoire - Récits Express</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #F0EEFC;
      --purple-mid: #7C70E2;
      --purple-dark: #372E8A;
      --green: #22C55E;
      --green-light: #DCFCE7;
      --green-dark: #15803D;
      --red: #EF4444;
      --red-light: #FEE2E2;
      --red-dark: #B91C1C;
      --yellow: #F59E0B;
      --yellow-light: #FEF3C7;
      --yellow-dark: #B45309;
      --bg: #F8F9FD;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(91,79,207,0.08), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(91,79,207,0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 100%);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(91,79,207,0.25);
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(91,79,207,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91,79,207,0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--purple-light);
      color: var(--purple);
      margin-top: 0.75rem;
    }

    .btn-secondary:hover {
      background: #E5E1FA;
    }

    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      font-family: 'Nunito Sans', sans-serif;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--purple);
    }

    /* Question Screen */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .q-section {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--purple);
      background: var(--purple-light);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .q-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-bar-wrap {
      background: var(--border);
      height: 6px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--purple-mid), var(--purple));
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .q-text {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .opt-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: all 0.15s ease;
      color: var(--text);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--purple-mid);
      background: var(--purple-light);
      transform: translateX(3px);
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: var(--purple-dark);
    }

    .opt-btn.correct {
      background: var(--green-light) !important;
      border-color: var(--green) !important;
      color: var(--green-dark) !important;
    }
    .opt-btn.correct .opt-letter {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .opt-btn.incorrect {
      background: var(--red-light) !important;
      border-color: var(--red) !important;
      color: var(--red-dark) !important;
    }
    .opt-btn.incorrect .opt-letter {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .explanation-box {
      background: #F1F5F9;
      border-left: 4px solid var(--purple);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text);
      margin-bottom: 1.25rem;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    /* Results Screen */
    .res-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .res-score-badge {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-mid) 0%, var(--purple) 100%);
      color: white;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(91,79,207,0.3);
    }

    .res-score-num {
      font-family: 'Nunito', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .res-score-total {
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0.8;
    }

    .res-item {
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }
    .res-item.is-correct {
      background: var(--green-light);
      border-left: 4px solid var(--green);
      color: var(--green-dark);
    }
    .res-item.is-incorrect {
      background: var(--red-light);
      border-left: 4px solid var(--red);
      color: var(--red-dark);
    }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Récits Express</div>
    <h1>Le passeur de mémoire</h1>
  </header>

  <div class="container">
    <!-- START SCREEN -->
    <div id="screen-start" class="card screen active">
      <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:0.5rem; color:var(--purple-dark);">Prêt pour le questionnaire ?</h2>
      <p style="color:var(--text-muted); margin-bottom:1.25rem;">Ce questionnaire comporte <strong>16 questions</strong> (16 points) pour vérifier ta bonne compréhension du livre.</p>
      
      <label for="studentName" style="display:block; font-weight:700; margin-bottom:0.4rem;">Entre ton prénom :</label>
      <input type="text" id="studentName" class="input-field" placeholder="Ex: Lucas" autofocus>
      
      <button class="btn btn-primary" onclick="startQuiz()">Commencer le test 🚀</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card screen">
      <div class="q-meta">
        <span id="qSection" class="q-section">Section</span>
        <span id="qCounter" class="q-counter">Question 1/16</span>
      </div>
      <div class="progress-bar-wrap">
        <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="qText" class="q-text">Intitulé de la question</div>
      <div id="optionsGrid" class="options-grid"></div>
      <div id="explanationBox" class="explanation-box"></div>
      <button id="nextBtn" class="btn btn-primary" style="display:none;" onclick="nextQuestion()">Question suivante ➔</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="screen-results" class="card screen">
      <div class="res-header">
        <div class="res-score-badge">
          <span id="resScoreNum" class="res-score-num">0</span>
          <span class="res-score-total">/ 16</span>
        </div>
        <h2 id="resTitle" style="font-family:'Nunito',sans-serif; font-weight:900; color:var(--purple-dark);">Résultat</h2>
        <p id="resMsg" style="color:var(--text-muted); margin-top:0.25rem;"></p>
      </div>
      <div id="resDetails" style="margin-bottom: 1.5rem;"></div>
      <button class="btn btn-primary" onclick="restart()">Recommencer 🔄</button>
    </div>
  </div>

  <script>
    const BOOK_DATA = {
  "id": "passeur_de_memoire",
  "title": "Le passeur de mémoire",
  "series": "Récit Express",
  "totalPoints": 16,
  "questions": [
    {
      "id": "q1",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Zaccharie est-il revenu vivre dans son village africain ?",
      "options": [
        "Il veut assister à l'enterrement de Marna Salomé",
        "L'oncle qui l'élevait en France est mort",
        "Il a gagné un voyage en Afrique",
        "Ses parents lui ont demandé de rentrer"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Zaccharie a grandi en France chez un très vieil oncle. À la mort de cet oncle, il a dû rentrer dans son village natal. Il habite chez son ami Léopold."
    },
    {
      "id": "q2",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Zaccharie se comporte-t-il avec le vieux Fetnat, au début de l'histoire ?",
      "options": [
        "Il se moque de son allure et de son nom",
        "Il lui demande de lui raconter toute sa vie",
        "Il a très peur de lui",
        "Il l'aide à porter ses courses"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Zaccharie trouve que le vieil homme a une drôle de « dégaine » et un drôle de nom. Léopold lui reproche de parler ainsi des anciens : « C'est pas bien ! »"
    },
    {
      "id": "q3",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi le vieil homme s'appelle-t-il Fetnat ?",
      "options": [
        "C'est le prénom de son grand-père",
        "Ce nom veut dire « courageux » dans sa langue",
        "Il est né le 14 juillet, le jour de la Fête nationale",
        "C'est le nom d'un grand guerrier de la tribu"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Ses parents lui ont donné le nom inscrit au calendrier ce jour-là : « Fét. nat. ». Ils ne savaient pas que cela voulait dire « Fête nationale » !"
    },
    {
      "id": "q4",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qui est Salimbo ?",
      "options": [
        "Un conteur qui raconte la vie de ceux qui sont morts",
        "Le chef du village, qui a remplacé Mamadou",
        "Le père de Léopold",
        "Le sorcier qui soigne les malades du village"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Quand quelqu'un meurt, Salimbo vient raconter sa vie à toute la tribu, autour du feu. On l'appelle « le passeur de mémoire »."
    },
    {
      "id": "q5",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Comment Fetnat a-t-il sauvé la jeune Salomé ?",
      "options": [
        "Il a combattu seul deux lionnes devant sa case",
        "Il a chassé des voleurs qui l'attaquaient dans la savane",
        "Il l'a sortie d'un fleuve en crue",
        "Il l'a guérie d'une très forte fièvre"
      ],
      "correct": 0,
      "answer": 0,
      "points": 1,
      "explanation": "Salomé dormait dans sa case pendant que des lionnes s'approchaient. Fetnat a tué la première avec sa sagaie, la deuxième à mains nues. Il en garde quatre griffures sur la poitrine."
    },
    {
      "id": "q6",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Pourquoi Fetnat doit-il quitter le village ?",
      "options": [
        "Salomé ne veut plus jamais le revoir",
        "Il part chasser les lions dans la savane",
        "Il veut faire de grandes études dans le Nord",
        "Mamadou, le fils du chef, le fait bannir"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Salomé était promise à Mamadou. Quand elle revient enceinte de Fetnat, Mamadou le fait bannir : il ne doit plus revenir au village, « sous peine de mort »."
    },
    {
      "id": "q7",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Qu'est devenu Youssef, le fils de Salomé et de Fetnat ?",
      "options": [
        "Il est parti vivre avec son père, loin du village",
        "Il est devenu un célèbre acteur à Hollywood",
        "Il est devenu le chef du village",
        "Il a été envoyé faire des études dans une ville du Nord"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Mamadou voulait effacer la trace de sa honte : il a envoyé le petit Youssef étudier dans le Nord. Youssef y a épousé Yasmina."
    },
    {
      "id": "q8",
      "section": "Compréhension (QCM)",
      "type": "mcq",
      "text": "Que découvre Zaccharie à la fin du récit de Salimbo ?",
      "options": [
        "Salimbo est son oncle",
        "Mamadou était son vrai père",
        "Fetnat est son grand-père",
        "Léopold est son frère"
      ],
      "correct": 2,
      "answer": 2,
      "points": 1,
      "explanation": "Youssef et Yasmina étaient les parents de Zaccharie. Le vieil homme dont il se moquait le matin même est donc son grand-père !"
    },
    {
      "id": "q9",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "À la fin, Zaccharie laisse Fetnat rentrer seul chez lui.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : Zaccharie pose ses mains sur ses épaules et lui dit : « Viens, grand-père, on rentre à la maison. »"
    },
    {
      "id": "q10",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Salomé a épousé Fetnat.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : pour obéir à ses parents, Salomé a épousé Mamadou. Ils ont eu quinze enfants, mais elle n'a plus jamais souri."
    },
    {
      "id": "q11",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Zaccharie a grandi en France.",
      "correct": true,
      "answer": true,
      "points": 1,
      "explanation": "VRAI : ses parents sont morts quand il avait quelques mois, et Mamadou ne voulait pas de lui au village. Il a été envoyé en France."
    },
    {
      "id": "q12",
      "section": "Vrai ou Faux",
      "type": "tf",
      "text": "Depuis l'enfance, Salomé était promise à Fetnat.",
      "correct": false,
      "answer": false,
      "points": 1,
      "explanation": "FAUX : Salomé était promise à Mamadou, le fils du chef. C'est pour cela que son amour pour Fetnat était impossible."
    },
    {
      "id": "q13",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Le spectacle de cet émouvant vieillard était cocasse tout autant qu'attristant. » Que veut dire « cocasse » ?",
      "options": [
        "Ennuyeux",
        "Drôle",
        "Effrayant",
        "Magnifique"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Cocasse veut dire drôle, un peu bizarre. Zaccharie trouve le vieil homme à la fois amusant et triste à voir."
    },
    {
      "id": "q14",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Au cœur d'un profond dilemme, Salomé refusait de vivre loin de sa famille. » Qu'est-ce qu'un « dilemme » ?",
      "options": [
        "Une grande fête du village",
        "Un choix très difficile entre deux solutions",
        "Une dispute entre deux familles",
        "Un très long voyage"
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Salomé est dans un dilemme : partir avec Fetnat, qu'elle aime, ou rester avec sa famille. Les deux choix la rendent malheureuse."
    },
    {
      "id": "q15",
      "section": "Vocabulaire en contexte",
      "type": "mcq",
      "text": "« Les balafres, très nettes et légèrement boursouflées, impressionnèrent l'adolescent. » Que sont des « balafres » ?",
      "options": [
        "Des tatouages",
        "Des peintures sur le corps",
        "Des colliers de perles",
        "De longues cicatrices"
      ],
      "correct": 3,
      "answer": 3,
      "points": 1,
      "explanation": "Une balafre est une longue cicatrice laissée par une blessure. Ce sont les griffures de la lionne sur la poitrine de Fetnat."
    },
    {
      "id": "q16",
      "section": "Compréhension globale",
      "type": "synthesis",
      "text": "Quel résumé correspond le mieux à l'histoire ?",
      "options": [
        "Zaccharie, un adolescent qui a grandi en France, revient vivre dans son village africain, mais il s'y ennuie et se moque des anciens, comme le vieux Fetnat. À la mort de Marna Salomé, le conteur Salimbo raconte sa vie : Fetnat l'avait sauvée de deux lionnes et l'aimait, mais il a dû quitter le village. Zaccharie découvre alors que Fetnat est le père de Léopold, et il repart vivre en France.",
        "Zaccharie, un adolescent qui a grandi en France, revient vivre dans son village africain, mais il s'y ennuie et se moque des anciens, comme le vieux Fetnat. À la mort de Marna Salomé, le conteur Salimbo raconte sa vie : Fetnat l'avait sauvée de deux lionnes et l'aimait, mais il a dû quitter le village. Zaccharie découvre alors que Fetnat est son grand-père, et il le ramène à la maison.",
        "Zaccharie, un adolescent qui a grandi en France, revient vivre dans son village africain, où il adore écouter les histoires des anciens, comme le vieux Fetnat. À la mort de Marna Salomé, le conteur Salimbo raconte sa vie : Fetnat l'avait sauvée de deux lionnes, puis l'avait épousée. Zaccharie découvre alors que Mamadou, l'ancien chef, est son grand-père."
      ],
      "correct": 1,
      "answer": 1,
      "points": 1,
      "explanation": "Seul le résumé B est correct. Zaccharie méprise d'abord le village et Fetnat. Grâce au récit de Salimbo, il apprend que Fetnat est le père de Youssef, donc son grand-père, et il retrouve ses racines."
    }
  ]
};

    let state = {
      student: '',
      currentQ: 0,
      score: 0,
      answers: []
    };

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startQuiz() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('Merci d\'entrer ton prénom avant de commencer.');
        return;
      }
      state.student = name;
      state.currentQ = 0;
      state.score = 0;
      state.answers = [];
      showScreen('screen-question');
      renderQuestion();
    }

    function renderQuestion() {
      const q = BOOK_DATA.questions[state.currentQ];
      const total = BOOK_DATA.questions.length;

      document.getElementById('qSection').textContent = q.section || 'Compréhension';
      document.getElementById('qCounter').textContent = `Question ${state.currentQ + 1}/${total}`;
      document.getElementById('progressFill').style.width = `${((state.currentQ) / total) * 100}%`;
      document.getElementById('qText').textContent = q.text;

      const explBox = document.getElementById('explanationBox');
      explBox.style.display = 'none';
      explBox.innerHTML = '';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'none';

      // Read correct answer field robustly (supports both 'correct' and 'answer')
      const targetCorrect = (q.correct !== undefined) ? q.correct : q.answer;

      if (q.type === 'tf') {
        const opts = [
          { text: 'VRAI', val: true, letter: 'V' },
          { text: 'FAUX', val: false, letter: 'F' }
        ];
        opts.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${opt.letter}</span><span>${opt.text}</span>`;
          btn.onclick = () => handleAnswer(opt.val, targetCorrect, btn);
          grid.appendChild(btn);
        });
      } else {
        // MCQ or Synthesis
        q.options.forEach((optText, i) => {
          const letter = String.fromCharCode(65 + i);
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = `<span class="opt-letter">${letter}</span><span>${optText}</span>`;
          btn.onclick = () => handleAnswer(i, targetCorrect, btn);
          grid.appendChild(btn);
        });
      }
    }

    function handleAnswer(userChoice, correctChoice, clickedBtn) {
      const q = BOOK_DATA.questions[state.currentQ];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(btn => btn.disabled = true);

      const isCorrect = (userChoice === correctChoice);
      if (isCorrect) {
        state.score += 1;
        clickedBtn.classList.add('correct');
      } else {
        clickedBtn.classList.add('incorrect');
        if (q.type === 'tf') {
          allBtns.forEach(b => {
            if ((correctChoice === true && b.textContent.includes('VRAI')) ||
                (correctChoice === false && b.textContent.includes('FAUX'))) {
              b.classList.add('correct');
            }
          });
        } else {
          if (allBtns[correctChoice]) {
            allBtns[correctChoice].classList.add('correct');
          }
        }
      }

      // Show explanation if available
      if (q.explanation) {
        const explBox = document.getElementById('explanationBox');
        explBox.innerHTML = `<strong>💡 Explication :</strong> ${q.explanation}`;
        explBox.style.display = 'block';
      }

      state.answers.push({
        qIndex: state.currentQ,
        question: q.text,
        isCorrect: isCorrect,
        userChoice: userChoice,
        correctChoice: correctChoice,
        explanation: q.explanation || ''
      });

      const nextBtn = document.getElementById('nextBtn');
      if (state.currentQ + 1 < BOOK_DATA.questions.length) {
        nextBtn.textContent = 'Question suivante ➔';
      } else {
        nextBtn.textContent = 'Voir mon score 🎉';
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      state.currentQ++;
      if (state.currentQ < BOOK_DATA.questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      const total = BOOK_DATA.questions.length;
      document.getElementById('resScoreNum').textContent = state.score;

      const details = document.getElementById('resDetails');
      details.innerHTML = '<h3 style="font-family:\'Nunito\',sans-serif; margin-bottom:0.75rem;">Détail de tes réponses :</h3>';
      
      state.answers.forEach((ans, i) => {
        const item = document.createElement('div');
        item.className = `res-item ${ans.isCorrect ? 'is-correct' : 'is-incorrect'}`;
        let explHtml = ans.explanation ? `<div style="font-size:0.85rem; margin-top:0.25rem; opacity:0.9;">💡 ${ans.explanation}</div>` : '';
        item.innerHTML = `
          <span>${ans.isCorrect ? '✅' : '❌'}</span>
          <div>
            <strong>Q${i + 1}:</strong> ${ans.question}
            ${explHtml}
          </div>
        `;
        details.appendChild(item);
      });

      const percent = (state.score / total) * 100;
      if (percent >= 85) {
        document.getElementById('resTitle').textContent = '🌟 Excellent travail !';
        document.getElementById('resMsg').textContent = `Félicitations ${state.student}, tu as une excellente compréhension de ce livre !`;
      } else if (percent >= 50) {
        document.getElementById('resTitle').textContent = '👍 Bon travail !';
        document.getElementById('resMsg').textContent = `Bravo ${state.student}, tu as réussi la majorité du questionnaire.`;
      } else {
        document.getElementById('resTitle').textContent = '💪 À revoir !';
        document.getElementById('resMsg').textContent = `Courage ${state.student}, relis attentivement le livre pour mieux le comprendre !`;
      }

      showScreen('screen-results');
    }

    function restart() {
      document.getElementById('studentName').value = '';
      showScreen('screen-start');
    }
  </script>
</body>
</html>
