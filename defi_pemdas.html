<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Défi PEMDAS — L'ordre des opérations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #d6f6ea;
      --bg2: #b9ecd8;
      --teal: #12bd8e;
      --teal-dark: #0c9d76;
      --teal-deep: #0a7d5e;
      --ink: #0f4d40;
      --ink-soft: #3f7a6c;
      --card: #ffffff;
      --field: #eafaf3;
      --line: #cdeede;
      --coral: #ff885c;
      --coral-light: #ffdcd0;
      --yellow: #ffce4a;
      --blue: #3aa0e8;
      --purple: #9a86f0;
      --green: #2ec27e;
      --red: #ef5b6e;
      --shadow: 0 10px 28px rgba(12, 120, 90, 0.16);
      --shadow-sm: 0 4px 12px rgba(12, 120, 90, 0.12);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .f {
      font-family: "Fredoka", "Nunito", sans-serif;
      font-weight: 600;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 18px 60px;
    }

    /* ---------- Boutons ---------- */
    .btn {
      font-family: "Fredoka", sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 18px;
      padding: 14px 22px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
      justify-content: center;
    }
    .btn:active {
      transform: translateY(1px) scale(.99);
    }
    .btn-primary {
      background: var(--teal);
      color: #fff;
      box-shadow: 0 6px 0 var(--teal-deep);
    }
    .btn-primary:hover {
      background: var(--teal-dark);
    }
    .btn-primary:active {
      box-shadow: 0 2px 0 var(--teal-deep);
      transform: translateY(3px);
    }
    .btn-coral {
      background: var(--coral);
      color: #fff;
      box-shadow: 0 6px 0 #d9683f;
    }
    .btn-coral:hover {
      background: #f77d50;
    }
    .btn-coral:active {
      box-shadow: 0 2px 0 #d9683f;
      transform: translateY(3px);
    }
    .btn-home {
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 0.95rem;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .btn-home:hover {
      background: var(--field);
      border-color: var(--teal);
    }

    /* ---------- Écran de départ ---------- */
    #start {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .start-card {
      background: var(--card);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 48px 40px;
      max-width: 620px;
      width: 100%;
      text-align: center;
      border: 3px solid var(--line);
    }
    .start-card h1 {
      font-size: 2.3rem;
      margin: 18px 0 6px;
      color: var(--ink);
    }
    .start-card p.lead {
      color: var(--ink-soft);
      font-size: 1.25rem;
      margin: 0 0 30px;
      font-weight: 600;
    }
    .level-select {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 26px;
    }
    .level-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 16px 20px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .level-btn:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
      background: var(--field);
    }
    .level-btn.active {
      border-color: var(--teal);
      background: var(--field);
      box-shadow: 0 0 0 2px var(--teal);
    }
    .level-num {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--teal-pale, #e2f7ef);
      color: var(--teal-deep);
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .level-info {
      flex: 1;
    }
    .level-title {
      display: block;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--ink);
    }
    .level-desc {
      display: block;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    /* ---------- Barre de progression / Topbar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .topbar h2 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--ink);
    }
    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-dots {
      display: flex;
      gap: 8px;
    }
    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 2px rgba(12, 80, 64, 0.18);
      transition: all 0.2s ease;
    }
    .progress-dot.current {
      box-shadow: inset 0 0 0 3px var(--coral);
      background: var(--coral-light);
      transform: scale(1.15);
    }
    .progress-dot.correct {
      background: var(--green);
      box-shadow: none;
    }
    .progress-dot.mistake {
      background: var(--coral);
      box-shadow: none;
    }
    .score-chip {
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      background: #fff;
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: var(--shadow-sm);
      color: var(--ink);
      font-size: 1.05rem;
    }

    /* ---------- Carte d'exercice ---------- */
    .game-card {
      background: var(--card);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 38px 40px;
      margin-bottom: 24px;
      border: 3px solid var(--line);
      text-align: center;
      position: relative;
    }
    .prompt {
      font-family: "Fredoka", sans-serif;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--ink-soft);
      margin-top: 0;
      margin-bottom: 15px;
    }
    .expression-display {
      font-family: "Nunito", sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--ink);
      margin: 24px 0;
      min-height: 70px;
      user-select: none;
    }

    /* ---------- Zone de Choix (QCM) ---------- */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 480px;
      margin: 0 auto 20px;
    }
    .choice-btn {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 16px 24px;
      font-family: "Fredoka", sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .choice-btn:hover {
      border-color: var(--teal);
      background: var(--field);
      transform: translateY(-2px);
    }
    .choice-btn:active {
      transform: translateY(1px);
    }
    .choice-btn.correct-choice {
      background: var(--green) !important;
      color: #fff !important;
      border-color: var(--green) !important;
      box-shadow: none;
    }
    .choice-btn.wrong-choice {
      background: var(--coral) !important;
      color: #fff !important;
      border-color: var(--coral) !important;
      box-shadow: none;
    }

    /* ---------- Zone de Saisie Libre ---------- */
    .input-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 20px;
    }
    .answer-input-wrapper {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .answer-input {
      flex: 1;
      font-family: "Fredoka", sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--ink);
      background: var(--field);
      border: 3px solid var(--line);
      border-radius: 20px;
      padding: 10px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .answer-input:focus {
      border-color: var(--teal);
    }

    /* Clavier Numérique Virtuel */
    .virtual-keyboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 240px;
      margin-top: 10px;
    }
    .key-btn {
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      font-family: "Fredoka", sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.1s ease;
      box-shadow: var(--shadow-sm);
      user-select: none;
    }
    .key-btn:hover {
      background: var(--field);
      border-color: var(--teal);
    }
    .key-btn:active {
      transform: scale(0.95);
    }

    /* ---------- Feedback Box ---------- */
    .feedback-box {
      display: none;
      align-items: flex-start;
      gap: 16px;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
      box-shadow: var(--shadow-sm);
      border-left: 6px solid transparent;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .feedback-box.wrong {
      border-left-color: var(--coral);
      background: #fff6e3;
    }
    .feedback-box.correct {
      border-left-color: var(--green);
      background: #e8fbf1;
    }
    .feedback-icon {
      font-size: 1.8rem;
      line-height: 1;
    }
    .feedback-content {
      flex: 1;
    }
    .feedback-content h4 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      color: var(--ink);
    }
    .feedback-content p {
      margin: 0;
      font-size: 0.98rem;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .step-resolution-list {
      margin: 10px 0 0 0;
      padding-left: 20px;
      font-family: "Nunito", sans-serif;
      font-size: 0.95rem;
      color: var(--ink-soft);
    }
    .step-resolution-list li {
      margin-bottom: 4px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .feedback-box.shake {
      animation: shake 0.4s ease;
    }

    /* ---------- Action Bar ---------- */
    .actions-bar {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    /* ---------- Écran de fin ---------- */
    .end-card-container {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .end-card {
      background: var(--card);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 48px 40px;
      max-width: 620px;
      width: 100%;
      text-align: center;
      border: 3px solid var(--line);
    }
    .trophy-img {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      display: block;
      object-fit: contain;
    }
    .end-card h1 {
      font-size: 2.4rem;
      margin: 0 0 10px 0;
      color: var(--ink);
    }
    .end-card p.lead {
      color: var(--ink);
      font-size: 1.3rem;
      margin: 0 0 8px 0;
      font-weight: 700;
    }
    .end-comment {
      color: var(--ink-soft);
      font-size: 1.1rem;
      margin: 0 0 30px 0;
      font-weight: 600;
    }
    .results-summary {
      background: var(--field);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Nunito", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .summary-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .summary-q {
      font-family: "Fredoka", sans-serif;
      color: var(--ink);
      font-size: 0.95rem;
      width: 90px;
    }
    .summary-expr {
      flex: 1;
      color: var(--ink-soft);
      font-weight: 800;
      font-size: 1.1rem;
    }
    .summary-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-family: "Fredoka", sans-serif;
    }
    .summary-status.good {
      color: var(--green);
    }
    .summary-status.mistake {
      color: var(--coral);
    }

    @media (max-width: 600px) {
      .wrap {
        padding: 10px 10px 40px;
      }
      .game-card {
        padding: 24px 18px;
      }
      .expression-display {
        font-size: 2rem;
        margin: 18px 0;
      }
      .start-card, .end-card {
        padding: 30px 20px;
      }
      .start-card h1 {
        font-size: 1.8rem;
      }
      .topbar h2 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 1. ECRAN DE DEPART -->
    <div id="start">
      <div class="start-card">
        <h1>Défi PEMDAS</h1>
        <p class="lead">Trouve le bon résultat des formules complexes !</p>
        
        <div class="level-select">
          <button class="level-btn" data-level="1">
            <div class="level-num">1</div>
            <div class="level-info">
              <span class="level-title">QCM simple</span>
              <span class="level-desc">Priorités simples sans parenthèses (3 propositions)</span>
            </div>
          </button>
          
          <button class="level-btn" data-level="2">
            <div class="level-num">2</div>
            <div class="level-info">
              <span class="level-title">QCM moyen</span>
              <span class="level-desc">Parenthèses et priorités simples (3 propositions)</span>
            </div>
          </button>
          
          <button class="level-btn" data-level="3">
            <div class="level-num">3</div>
            <div class="level-info">
              <span class="level-title">QCM compliqué</span>
              <span class="level-desc">Formules complexes combinées (3 propositions)</span>
            </div>
          </button>
          
          <button class="level-btn" data-level="4">
            <div class="level-num" style="background: var(--coral-light); color: var(--coral);">4</div>
            <div class="level-info">
              <span class="level-title">Saisie libre</span>
              <span class="level-desc">Calculs complexes où tu saisis toi-même la réponse</span>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. ECRAN DE JEU -->
    <div id="play" style="display:none;">
      
      <!-- Barre d'état supérieure -->
      <div class="topbar">
        <button class="btn-home" id="quitGameBtn">↩️ Niveaux</button>
        <h2 id="levelTitleText">Niveau 1 : QCM simple</h2>
        
        <div class="progress-container">
          <div class="progress-dots" id="progressDots">
            <!-- dots will be injected here -->
          </div>
          <div class="score-chip" id="scoreChip">Score : 0 / 5</div>
        </div>
      </div>
      
      <!-- Carte principale de l'exercice -->
      <div class="game-card">
        <p class="prompt" id="gamePrompt">Choisis la bonne réponse :</p>
        
        <!-- Affichage de l'expression arithmétique -->
        <div class="expression-display" id="expressionDisplay">
          3 + 5 × 4
        </div>
        
        <!-- Zone QCM -->
        <div class="choices-container" id="choicesContainer">
          <!-- Dynamically generated choice buttons -->
        </div>

        <!-- Zone Saisie Libre (Niveau 4) -->
        <div class="input-container" id="inputContainer" style="display:none;">
          <div class="answer-input-wrapper">
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="answer-input" id="answerInput" placeholder="?" readonly>
            <button class="btn btn-primary" id="validateInputBtn" style="border-radius:20px; padding: 10px 24px;">Valider</button>
          </div>

          <!-- Clavier Virtuel pour faciliter le tactile en classe -->
          <div class="virtual-keyboard" id="virtualKeyboard">
            <button class="key-btn" data-val="1">1</button>
            <button class="key-btn" data-val="2">2</button>
            <button class="key-btn" data-val="3">3</button>
            <button class="key-btn" data-val="4">4</button>
            <button class="key-btn" data-val="5">5</button>
            <button class="key-btn" data-val="6">6</button>
            <button class="key-btn" data-val="7">7</button>
            <button class="key-btn" data-val="8">8</button>
            <button class="key-btn" data-val="9">9</button>
            <button class="key-btn" data-val="C" style="color: var(--red);">C</button>
            <button class="key-btn" data-val="0">0</button>
            <button class="key-btn" data-val="back">⌫</button>
          </div>
        </div>
        
        <!-- Boîte de retours (correct/erreur) -->
        <div class="feedback-box wrong" id="feedbackBox">
          <span class="feedback-icon" id="feedbackIcon">⚠️</span>
          <div class="feedback-content">
            <h4 id="feedbackTitle">Oups, ce n'est pas tout à fait ça !</h4>
            <p id="feedbackText">La multiplication est prioritaire sur l'addition.</p>
            <ul class="step-resolution-list" id="feedbackSteps">
              <!-- steps will be injected here -->
            </ul>
          </div>
        </div>
        
        <!-- Bouton Suivant -->
        <div class="actions-bar">
          <button class="btn btn-coral" id="nextBtn" style="display:none;">
            <span>Question suivante</span> ➡️
          </button>
        </div>
      </div>
      
    </div>
    
    <!-- 3. ECRAN DE FIN -->
    <div id="end" style="display:none;" class="end-card-container">
      <div class="end-card">
        <img src="../trophy_success.jpg" alt="Trophée" class="trophy-img" id="trophyImg">
        <h1>Défi Réussi !</h1>
        <p class="lead" id="endScoreText">Tu as obtenu 5 / 5 !</p>
        <p class="end-comment" id="endCommentText">Félicitations !</p>
        
        <div class="results-summary" id="resultsSummary">
          <!-- Detailed list of questions and mistakes -->
        </div>
        
        <button class="btn btn-primary" id="restartGameBtn" style="width: 100%;">
          <span>Rejouer ou changer de niveau</span> 🔄
        </button>
      </div>
    </div>

  </div>

  <script>
    // Database of questions with pre-calculated values and distractions
    const questionsDatabase = {
      1: [ // QCM Simple
        {
          expr: "3 + 5 × 4",
          correct: 23,
          options: [23, 32, 15],
          desc: "La multiplication est prioritaire sur l'addition.",
          steps: ["3 + 5 × 4", "= 3 + 20", "= 23"]
        },
        {
          expr: "18 − 3 × 4",
          correct: 6,
          options: [6, 60, 11],
          desc: "La multiplication est prioritaire sur la soustraction.",
          steps: ["18 − 3 × 4", "= 18 − 12", "= 6"]
        },
        {
          expr: "10 + 15 : 5",
          correct: 13,
          options: [13, 5, 10],
          desc: "La division est prioritaire sur l'addition.",
          steps: ["10 + 15 : 5", "= 10 + 3", "= 13"]
        },
        {
          expr: "24 − 8 : 2",
          correct: 20,
          options: [20, 8, 12],
          desc: "La division est prioritaire sur la soustraction.",
          steps: ["24 − 8 : 2", "= 24 − 4", "= 20"]
        },
        {
          expr: "7 + 2 × 5",
          correct: 17,
          options: [17, 45, 14],
          desc: "La multiplication est prioritaire sur l'addition.",
          steps: ["7 + 2 × 5", "= 7 + 10", "= 17"]
        },
        {
          expr: "15 − 6 : 3",
          correct: 13,
          options: [13, 3, 11],
          desc: "La division est prioritaire sur la soustraction.",
          steps: ["15 − 6 : 3", "= 15 − 2", "= 13"]
        },
        {
          expr: "4 × 5 + 6",
          correct: 26,
          options: [26, 44, 20],
          desc: "La multiplication s'effectue avant l'addition de droite.",
          steps: ["4 × 5 + 6", "= 20 + 6", "= 26"]
        },
        {
          expr: "30 : 5 − 2",
          correct: 4,
          options: [4, 10, 6],
          desc: "La division s'effectue avant la soustraction de droite.",
          steps: ["30 : 5 − 2", "= 6 − 2", "= 4"]
        },
        {
          expr: "8 + 12 : 4",
          correct: 11,
          options: [11, 5, 15],
          desc: "La division est prioritaire sur l'addition.",
          steps: ["8 + 12 : 4", "= 8 + 3", "= 11"]
        },
        {
          expr: "6 × 3 − 5",
          correct: 13,
          options: [13, 12, 8],
          desc: "La multiplication s'effectue avant la soustraction de droite.",
          steps: ["6 × 3 − 5", "= 18 − 5", "= 13"]
        },
        {
          expr: "20 − 4 × 3",
          correct: 8,

      // Get 5 random questions for the selected level
      const sourceSet = questionsDatabase[lvl];
      activeQuestions = [...sourceSet].sort(() => 0.5 - Math.random()).slice(0, 5);

      // Build top status bar
      const titles = {
        1: "Niveau 1 : QCM simple",
        2: "Niveau 2 : QCM moyen",
        3: "Niveau 3 : QCM compliqué",
        4: "Niveau 4 : Saisie libre"
      };
      document.getElementById('levelTitleText').textContent = titles[lvl];

      const dotsContainer = document.getElementById('progressDots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.id = `progressDot_${i}`;
        dotsContainer.appendChild(dot);
      }

      document.getElementById('scoreChip').textContent = `Score : 0 / 5`;
      showScreen('play');
      loadQuestion(0);
    }

    // Load a Question in active set
    function loadQuestion(idx) {
      currentQuestionIndex = idx;
      currentMistakes = 0;
      const q = activeQuestions[idx];

      // Update progress dots status
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`progressDot_${i}`);
        if (i === idx) {
          dot.className = 'progress-dot current';
        } else if (i > idx) {
          dot.className = 'progress-dot';
        }
      }

      document.getElementById('expressionDisplay').textContent = q.expr;
      document.getElementById('nextBtn').style.display = 'none';
      hideFeedback();

      // QCM vs Saisie Libre layout configuration
      if (currentLevel <= 3) {
        document.getElementById('gamePrompt').textContent = "Choisis la bonne réponse :";
        document.getElementById('choicesContainer').style.display = 'flex';
        document.getElementById('inputContainer').style.display = 'none';
        renderChoices(q);
      } else {
        document.getElementById('gamePrompt').textContent = "Calcule le résultat final de cette expression :";
        document.getElementById('choicesContainer').style.display = 'none';
        document.getElementById('inputContainer').style.display = 'flex';
        document.getElementById('answerInput').value = '';
      }
    }

    // Render QCM choices
    function renderChoices(q) {
      const container = document.getElementById('choicesContainer');
      container.innerHTML = '';
      
      // Shuffle options copy
      const shuffledOptions = [...q.options].sort(() => 0.5 - Math.random());
      
      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleChoiceClick(btn, opt, q));
        container.appendChild(btn);
      });
    }

    // Handle Click on QCM button
    function handleChoiceClick(button, val, question) {
      // Ignore click if question already solved
      if (document.getElementById('nextBtn').style.display === 'inline-flex') return;

      if (val === question.correct) {
        button.classList.add('correct-choice');
        handleCorrectAnswer(question);
      } else {
        button.classList.add('wrong-choice');
        currentMistakes++;
        showFeedbackBox(false, question);
      }
    }

    // Handle Input validation for free response (Niveau 4)
    function validateFreeInput() {
      // Ignore validation if question already solved
      if (document.getElementById('nextBtn').style.display === 'inline-flex') return;

      const inputValStr = document.getElementById('answerInput').value.trim();
      if (inputValStr === '') return;

      const userVal = parseInt(inputValStr, 10);
      const question = activeQuestions[currentQuestionIndex];

      if (userVal === question.correct) {
        handleCorrectAnswer(question);
      } else {
        currentMistakes++;
        showFeedbackBox(false, question);
      }
    }

    // Correct Answer Handler
    function handleCorrectAnswer(question) {
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.style.display = 'inline-flex';
      
      const dot = document.getElementById(`progressDot_${currentQuestionIndex}`);

      if (currentMistakes === 0) {
        score++;
        dot.className = 'progress-dot correct';
        showFeedbackBox(true, question);
      } else {
        dot.className = 'progress-dot mistake';
        showFeedbackBox(true, question);
      }

      resultsHistory.push({
        expr: question.expr,
        mistakes: currentMistakes
      });

      document.getElementById('scoreChip').textContent = `Score : ${score} / 5`;

      if (currentQuestionIndex === 4) {
        nextBtn.innerHTML = `<span>Voir mes résultats</span> 🏆`;
      } else {
        nextBtn.innerHTML = `<span>Question suivante</span> ➡️`;
      }
    }

    // Feedback visual handlers
    function showFeedbackBox(isCorrect, q) {
      const box = document.getElementById('feedbackBox');
      const title = document.getElementById('feedbackTitle');
      const icon = document.getElementById('feedbackIcon');
      const text = document.getElementById('feedbackText');
      const stepsList = document.getElementById('feedbackSteps');

      box.style.display = 'flex';
      stepsList.innerHTML = '';

      if (isCorrect) {
        box.className = 'feedback-box correct';
        icon.textContent = "🌟";
        title.textContent = (currentMistakes === 0 ? "Excellent !" : "Bien joué !");
        text.textContent = (currentMistakes === 0 
          ? "Tu as trouvé la bonne réponse du premier coup. Félicitations !" 
          : "Tu as corrigé ton erreur et trouvé le bon résultat. C'est parfait !");
      } else {
        box.className = 'feedback-box wrong';
        box.classList.remove('shake');
        void box.offsetWidth; // trigger reflow
        box.classList.add('shake');

        icon.textContent = "⚠️";
        title.textContent = "Oups, ce n'est pas tout à fait ça !";
        text.innerHTML = `<strong>Rappel pédagogique :</strong> ${q.desc}<br>Voici la résolution pas-à-pas pour t'aider :`;

        q.steps.forEach(st => {
          const li = document.createElement('li');
          li.textContent = st;
          stepsList.appendChild(li);
        });
      }
    }

    // Hide feedback box
    function hideFeedback() {
      document.getElementById('feedbackBox').style.display = 'none';
    }

    // Next button click handler
    function nextQuestion() {
      if (currentQuestionIndex < 4) {
        loadQuestion(currentQuestionIndex + 1);
      } else {
        showEndScreen();
      }
    }

    // End Game Screen
    function showEndScreen() {
      showScreen('end');
      document.getElementById('endScoreText').innerHTML = `Tu as réussi <strong>${score}</strong> question${score > 1 ? 's' : ''} du premier coup !`;
      
      const commentText = document.getElementById('endCommentText');
      if (score === 5) {
        commentText.textContent = "Incroyable ! Un sans-faute parfait. Tu es un champion de PEMDAS ! 👑🏆";
      } else if (score >= 3) {
        commentText.textContent = "Super travail ! Tu maîtrises bien l'ordre des opérations. 🌟";
      } else {
        commentText.textContent = "Bien essayé ! Entraîne-toi encore pour t'améliorer, tu vas y arriver ! 💪";
      }

      const summary = document.getElementById('resultsSummary');
      summary.innerHTML = '';
      resultsHistory.forEach((res, i) => {
        const item = document.createElement('div');
        item.className = 'summary-item';

        const hasMistakes = (res.mistakes > 0);
        const icon = hasMistakes ? "⚠️" : "✅";
        const statusClass = hasMistakes ? "mistake" : "good";
        const detail = hasMistakes ? `${res.mistakes} erreur${res.mistakes > 1 ? 's' : ''}` : "Du premier coup !";

        item.innerHTML = `
          <div class="summary-q">Question ${i + 1}</div>
          <div class="summary-expr">${res.expr}</div>
          <div class="summary-status ${statusClass}">${icon} ${detail}</div>
        `;
        summary.appendChild(item);
      });
    }

    function confirmQuit() {
      if (confirm("Es-tu sûr de vouloir quitter cette partie en cours ?")) {
        showScreen('start');
      }
    }

    // Virtual Keyboard handler
    function handleKeyboardPress(val) {
      const input = document.getElementById('answerInput');
      if (val === 'C') {
        input.value = '';
      } else if (val === 'back') {
        input.value = input.value.slice(0, -1);
      } else {
        // limit answer string length to 4 digits
        if (input.value.length < 4) {
          input.value += val;
        }
      }
    }

    // Event listener bindings
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lvl = parseInt(btn.getAttribute('data-level'), 10);
        startGame(lvl);
      });
    });

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-val');
        handleKeyboardPress(val);
      });
    });

    const quitBtn = document.getElementById('quitGameBtn');
    if (quitBtn) quitBtn.addEventListener('click', confirmQuit);

    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.addEventListener('click', nextQuestion);

    const validateBtn = document.getElementById('validateInputBtn');
    if (validateBtn) validateBtn.addEventListener('click', validateFreeInput);

    const restartBtn = document.getElementById('restartGameBtn');
    if (restartBtn) restartBtn.addEventListener('click', () => showScreen('start'));

    const trophyImg = document.getElementById('trophyImg');
    if (trophyImg) {
      trophyImg.addEventListener('error', () => {
        trophyImg.style.display = 'none';
      });
    }

    // Physical Keyboard support for Niveau 4
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('play').style.display !== 'block') return;
      if (currentLevel !== 4) return;

      if (e.key >= '0' && e.key <= '9') {
        handleKeyboardPress(e.key);
      } else if (e.key === 'Backspace') {
        handleKeyboardPress('back');
      } else if (e.key === 'Delete' || e.key === 'Escape') {
        handleKeyboardPress('C');
      } else if (e.key === 'Enter') {
        validateFreeInput();
      }
    });
  </script>
</body>
</html>
