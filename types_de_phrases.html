<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détective des Intentions : Les Types de Phrases</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --purple: #5B4FCF;
      --purple-light: #EEF0FF;
      --purple-mid: #C7C2F5;
      --green: #1A9E75;
      --green-light: #E2F5EE;
      --red: #D94F3D;
      --red-light: #FDECEA;
      --amber: #C97B1A;
      --amber-light: #FEF3E2;
      --blue: #1A6FA0;
      --blue-light: #E2F0FA;
      --bg: #FDFBF7;
      --surface: #FFFFFF;
      --text: #1A1A2E;
      --muted: #6B7080;
      --border: #1A1A2E;
      --r: 20px;
      --rsm: 10px;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    
    .font-display {
      font-family: 'Outfit', sans-serif;
    }
    
    .font-title {
      font-family: 'Nunito', sans-serif;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 2px solid var(--border);
      border-radius: var(--rsm);
      background: var(--surface);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
      box-shadow: 2px 2px 0px var(--border);
      transition: all .15s;
      margin-bottom: 1.5rem;
    }
    
    .back-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
      background: #F3F4F6;
    }
    
    .back-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border);
    }
    
    /* Neo-Brutalist cards */
    .neo-card {
      background: var(--surface);
      border: 3px solid var(--border);
      border-radius: var(--r);
      box-shadow: 6px 6px 0px var(--border);
      padding: 2rem;
      transition: all 0.2s ease;
    }
    
    /* Interactive buttons */
    .neo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 1.5rem;
      border: 3px solid var(--border);
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 4px 4px 0px var(--border);
      text-align: center;
      width: 100%;
    }
    
    .neo-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
    }
    
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--border);
    }
    
    .btn-assertion {
      background-color: var(--blue-light);
      color: var(--blue);
    }
    .btn-assertion:hover {
      background-color: #D1E9FA;
    }
    
    .btn-interrogative {
      background-color: var(--green-light);
      color: var(--green);
    }
    .btn-interrogative:hover {
      background-color: #D1F0E4;
    }
    
    .btn-injonctive {
      background-color: var(--purple-light);
      color: var(--purple);
    }
    .btn-injonctive:hover {
      background-color: #E2E4FF;
    }
    
    /* Progress bar */
    .progress-outer {
      width: 100%;
      height: 16px;
      border: 2px solid var(--border);
      background: #E5E7EB;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 2px 2px 0px var(--border);
    }
    
    .progress-inner {
      height: 100%;
      background-color: var(--purple);
      transition: width 0.3s ease;
    }
    
    /* Shake animation on error */
    .shake-anim {
      animation: shake 0.4s ease;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(6px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }
    
    /* Fade animation */
    .fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>

    <!-- Active Screen Container -->

  </div>

    };

      if (gameState.level === null) {
        // We are on menu, try to close window
        if (window.opener || window.history.length > 1) {
          window.close();
        } else {
          // Fallback if opened directly
          alert("Fermez cet onglet pour revenir à la plateforme principale LCML.");
        }
      } else {
        // Go back to main menu
        resetGame();
        showMenu();
      }
    }

      gameState = {
        level: null,

        currentIndex: 0,
        score: 0,
        submitted: false,
        selectedAnswer: null,
        history: []

    // --- RENDER MENU ---
    function showMenu() {

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Level 1 Card -->
            <div onclick="startLevel('level1')" class="cursor-pointer border-3 border-neutral-900 rounded-2xl p-6 bg-[#E2F5EE] hover:bg-[#D1F0E4] shadow-[4px_4px_0px_#1A1A2E] hover:shadow-[6px_6px_0px_#1A1A2E] hover:-translate-y-1 transition-all flex flex-col justify-between items-center text-center h-full min-h-[220px]">
              <div>
                <span class="text-4xl mb-3 block">🟢</span>
                <h3 class="font-title font-black text-xl text-[#1A9E75] mb-2">Apprenti Détective</h3>
                <p class="text-neutral-700 text-xs sm:text-sm">
                  Des phrases simples, sans pièges, pour bien s'entraîner aux notions de base.
                </p>
              </div>
              <button class="mt-4 px-4 py-2 bg-[#1A9E75] text-white font-title font-black rounded-lg border-2 border-neutral-900 shadow-[2px_2px_0px_#1A1A2E]">
                C'est parti !
              </button>
            </div>
            
            <!-- Level 2 Card -->
            <div onclick="startLevel('level2')" class="cursor-pointer border-3 border-neutral-900 rounded-2xl p-6 bg-[#FEF3E2] hover:bg-[#FEECD1] shadow-[4px_4px_0px_#1A1A2E] hover:shadow-[6px_6px_0px_#1A1A2E] hover:-translate-y-1 transition-all flex flex-col justify-between items-center text-center h-full min-h-[220px]">
              <div>
                <span class="text-4xl mb-3 block">🟠</span>
                <h3 class="font-title font-black text-xl text-[#C97B1A] mb-2">Maître Détective</h3>
                <p class="text-neutral-700 text-xs sm:text-sm">
                  Garde l'œil ouvert ! Injonctions déguisées au futur, exclamations trompeuses, etc.
                </p>
              </div>
              <button class="mt-4 px-4 py-2 bg-[#C97B1A] text-white font-title font-black rounded-lg border-2 border-neutral-900 shadow-[2px_2px_0px_#1A1A2E]">
                Relever le défi !
              </button>
            </div>
          </div>
          
          <!-- Rules reminder -->
          <div class="mt-8 pt-6 border-t-2 border-dashed border-neutral-200">
            <h4 class="font-title font-black text-md text-neutral-800 mb-2">Aide-mémoire :</h4>
            <ul class="text-xs text-neutral-600 space-y-2 list-disc pl-4">
              <li><strong>Assertion :</strong> Énonce un fait, une idée ou décrit le monde (ex: <em>Le train est arrivé.</em>).</li>
              <li><strong>Interrogation :</strong> Pose une question directe pour obtenir une information (ex: <em>Est-il arrivé ?</em>).</li>
              <li><strong>Injonction :</strong> Donne un ordre, un conseil, une consigne ou formule une interdiction (ex: <em>Attends ici.</em>).</li>
            </ul>
          </div>
        </div>
      `;
    }

    // --- START GAME LEVEL ---
    function startLevel(levelKey) {
      gameState.level = levelKey;
      // Shuffle sentences from DB and select up to 10
      const shuffled = [...DB_EXERCICES[levelKey]].sort(() => Math.random() - 0.5);
      gameState.questions = shuffled.slice(0, 10);
      gameState.currentIndex = 0;
      gameState.score = 0;
      gameState.submitted = false;
      gameState.selectedAnswer = null;
      gameState.history = [];
      
      renderQuestion();
    }

    // --- RENDER CURRENT QUESTION ---
    function renderQuestion() {
      const screenContainer = document.getElementById("screen-container");
      const question = gameState.questions[gameState.currentIndex];
      const pct = ((gameState.currentIndex) / gameState.questions.length) * 100;
      
      screenContainer.innerHTML = `
        <div id="game-card" class="neo-card fade-in">
          <!-- Progress -->
          <div class="flex justify-between items-center mb-4">
            <span class="font-title font-black text-xs sm:text-sm text-neutral-500">
              Phrase ${gameState.currentIndex + 1} sur ${gameState.questions.length}
            </span>
            <span class="font-title font-black text-xs sm:text-sm text-neutral-700 bg-neutral-100 border-2 border-neutral-900 px-3 py-1 rounded-full shadow-[1px_1px_0px_#1A1A2E]">
              Score : ${gameState.score} / ${gameState.currentIndex}
            </span>
          </div>
          
          <div class="progress-outer mb-6">
            <div class="progress-inner" style="width: ${pct}%"></div>
          </div>
          
          <!-- Sentence container -->
          <div class="border-3 border-neutral-900 rounded-2xl p-6 sm:p-8 bg-[#FFFDF5] text-center shadow-[3px_3px_0px_#1A1A2E] mb-8 min-h-[140px] flex flex-col justify-center items-center">
            <p class="font-display font-extrabold text-xl sm:text-2xl text-neutral-800 tracking-wide leading-relaxed">
              « ${question.text} »
            </p>
          </div>
          
          <!-- Buttons Area (Choice) -->
          <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <button onclick="submitAnswer('assertion')" class="neo-btn btn-assertion text-lg">
              Assertion
            </button>
            <button onclick="submitAnswer('interrogation')" class="neo-btn btn-interrogative text-lg">
              Interrogation
            </button>
            <button onclick="submitAnswer('injonction')" class="neo-btn btn-injonctive text-lg">
              Injonction
            </button>
          </div>
          
          <!-- Explanation / Feedback Panel (Hidden initially) -->
          <div id="feedback-panel" class="hidden mt-6 pt-6 border-t-3 border-dashed border-neutral-900 fade-in">
            <div id="feedback-content" class="border-3 border-neutral-900 p-5 rounded-xl mb-4 shadow-[3px_3px_0px_#1A1A2E]">
              <!-- Loaded dynamically -->
            </div>
            
            <div class="flex justify-end">
              <button onclick="nextQuestion()" class="px-6 py-3 font-title font-black text-lg bg-neutral-900 text-white rounded-xl hover:bg-neutral-800 transition-all border-2 border-neutral-900 shadow-[3px_3px_0px_#CBCBCB] hover:-translate-y-0.5 active:translate-y-0">
                ${gameState.currentIndex < gameState.questions.length - 1 ? "Phrase suivante ➔" : "Voir les résultats ➔"}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- SUBMIT ANSWER ---
    function submitAnswer(answer) {
      if (gameState.submitted) return; // Prevent double click
      
      gameState.submitted = true;
      gameState.selectedAnswer = answer;
      
      const question = gameState.questions[gameState.currentIndex];
      const isCorrect = (answer === question.type);
      
      if (isCorrect) {
        gameState.score++;
      } else {
        // Shake the card on error
        const card = document.getElementById("game-card");
        card.classList.add("shake-anim");
        setTimeout(() => card.classList.remove("shake-anim"), 500);
      }
      
      // Store in history
      gameState.history.push({
        questionText: question.text,
        studentAnswer: answer,
        correctAnswer: question.type,
        correct: isCorrect,
        explanation: question.explanation
      });
      
      // Display Feedback Panel
      const feedbackPanel = document.getElementById("feedback-panel");
      const feedbackContent = document.getElementById("feedback-content");
      const choicesContainer = document.getElementById("choices-container");
      
      // Disable choice buttons visually
      const buttons = choicesContainer.getElementsByTagName("button");
      for (let btn of buttons) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
      }
      
      // Format response text
      const typeLabel = {
        assertion: "Assertion",
        interrogation: "Interrogation",
        injonction: "Injonction"
      };
      
      if (isCorrect) {
        feedbackContent.className = "border-3 border-neutral-900 p-5 rounded-xl mb-4 shadow-[3px_3px_0px_#1A1A2E] bg-[#E2F5EE] text-[#137A5A]";
        feedbackContent.innerHTML = `
          <h4 class="font-title font-black text-xl mb-2 flex items-center gap-2">
            🎉 Bravo ! C'est correct !
          </h4>
          <p class="text-sm leading-relaxed mb-3">
            Tu as choisi <strong>${typeLabel[answer]}</strong>.
          </p>
          <div class="bg-white/80 p-3 rounded-lg border-2 border-neutral-900/10 text-neutral-800 text-xs sm:text-sm">
            ${question.explanation}
          </div>
        `;
      } else {
        feedbackContent.className = "border-3 border-neutral-900 p-5 rounded-xl mb-4 shadow-[3px_3px_0px_#1A1A2E] bg-[#FDECEA] text-[#B91C1C]";
        feedbackContent.innerHTML = `
          <h4 class="font-title font-black text-xl mb-2 flex items-center gap-2">
            😢 Oh, ce n'est pas tout à fait ça...
          </h4>
          <p class="text-sm leading-relaxed mb-3 text-neutral-800">
            Tu as choisi <strong>${typeLabel[answer]}</strong>, mais la bonne réponse était <strong>${typeLabel[question.type]}</strong>.
          </p>
          <div class="bg-white/80 p-3 rounded-lg border-2 border-neutral-900/10 text-neutral-800 text-xs sm:text-sm">
            <strong>Explication pédagogique :</strong><br>
            ${question.explanation}
          </div>
        `;
      }
      
      feedbackPanel.classList.remove("hidden");
    }

    // --- NEXT QUESTION OR END SCREEN ---
    function nextQuestion() {
      gameState.currentIndex++;
      gameState.submitted = false;
      gameState.selectedAnswer = null;
      
      if (gameState.currentIndex < gameState.questions.length) {
        renderQuestion();
      } else {
        renderResults();
      }
    }

    // --- RENDER RESULTS SCREEN ---
    function renderResults() {
      const screenContainer = document.getElementById("screen-container");
      
      // Custom feedback text based on performance
      let scoreTitle = "";
      let scoreMessage = "";
      let scoreEmoji = "";
      
      if (gameState.score === gameState.questions.length) {
        scoreTitle = "Incroyable ! Score parfait !";
        scoreMessage = "Tu as déjoué tous les mystères de la langue française. Tu es un véritable Maître Détective !";
        scoreEmoji = "🏆🥇";
        triggerConfettiFull();
      } else if (gameState.score >= 7) {
        scoreTitle = "Excellent travail !";
        scoreMessage = "C'est un excellent score ! Tu as une très bonne maîtrise des types de phrases.";
        scoreEmoji = "🌟🎉";
        triggerConfettiMini();
      } else if (gameState.score >= 5) {
        scoreTitle = "Pas mal du tout !";
        scoreMessage = "C'est un score encourageant. Relis bien les explications pour progresser encore !";
        scoreEmoji = "👍🔍";
      } else {
        scoreTitle = "Continue à t'entraîner !";
        scoreMessage = "Chaque erreur est une occasion d'apprendre. Essaie à nouveau pour progresser !";
        scoreEmoji = "📚💪";
      }
      
      // Format history rows
      let historyRowsHTML = "";
      const typeBadge = {
        assertion: `<span class="px-2 py-0.5 rounded text-xs font-bold border border-blue-400 bg-blue-50 text-blue-700">Assertion</span>`,
        interrogation: `<span class="px-2 py-0.5 rounded text-xs font-bold border border-green-400 bg-green-50 text-green-700">Interrogation</span>`,
        injonction: `<span class="px-2 py-0.5 rounded text-xs font-bold border border-purple-400 bg-purple-50 text-purple-700">Injonction</span>`
      };
      
      gameState.history.forEach((h, idx) => {
        historyRowsHTML += `
          <tr class="border-b border-neutral-200 hover:bg-neutral-50 transition-all">
            <td class="p-3 text-xs sm:text-sm font-bold text-neutral-800">
              ${idx + 1}
            </td>
            <td class="p-3 text-xs sm:text-sm font-medium text-neutral-800">
              « ${h.questionText} »
            </td>
            <td class="p-3 text-center">
              ${typeBadge[h.correctAnswer]}
            </td>
            <td class="p-3 text-center">
              ${h.correct 
                ? `<span class="text-green-600 font-extrabold text-lg">✓</span>` 
                : `<span class="text-red-500 font-extrabold text-lg">✗</span>`
              }
            </td>
          </tr>
          ${!h.correct ? `
            <tr class="bg-red-50/50">
              <td colspan="4" class="p-3 pl-8 text-xs text-red-800 border-b border-neutral-200">
                <strong>Ton erreur :</strong> Tu as choisi <em>${h.studentAnswer === 'assertion' ? 'Assertion' : h.studentAnswer === 'interrogation' ? 'Interrogation' : 'Injonction'}</em>.<br>
                <strong>Explication :</strong> ${h.explanation}
              </td>
            </tr>
          ` : ''}
        `;
      });
      
      screenContainer.innerHTML = `
        <div class="neo-card fade-in">
          <!-- Main Feedback Block -->
          <div class="text-center border-3 border-neutral-900 rounded-2xl p-6 sm:p-8 bg-[#EEF0FF] shadow-[4px_4px_0px_#1A1A2E] mb-8">
            <span class="text-5xl sm:text-6xl mb-4 block">${scoreEmoji}</span>
            <h2 class="font-display font-black text-2xl sm:text-3xl text-[#5B4FCF] mb-2">
              ${scoreTitle}
            </h2>
            <div class="inline-block border-3 border-neutral-900 bg-white px-6 py-2 rounded-full font-title font-black text-2xl sm:text-3xl text-neutral-900 my-4 shadow-[2px_2px_0px_#1A1A2E]">
              Note : ${gameState.score} / ${gameState.questions.length}
            </div>
            <p class="text-neutral-700 text-sm sm:text-md max-w-lg mx-auto font-medium">
              ${scoreMessage}
            </p>
          </div>
          
          <!-- Detailed analysis table -->
          <h3 class="font-title font-black text-xl text-neutral-800 mb-4 flex items-center gap-2">
            📊 Rapport de l'enquête
          </h3>
          
          <div class="border-3 border-neutral-900 rounded-xl overflow-hidden shadow-[3px_3px_0px_#1A1A2E] bg-white mb-8">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-neutral-100 border-b-3 border-neutral-900">
                    <th class="p-3 text-xs sm:text-sm font-black text-neutral-700 w-10">N°</th>
                    <th class="p-3 text-xs sm:text-sm font-black text-neutral-700">Phrase</th>
                    <th class="p-3 text-xs sm:text-sm font-black text-neutral-700 text-center w-28">Type correct</th>
                    <th class="p-3 text-xs sm:text-sm font-black text-neutral-700 text-center w-16">Statut</th>
                  </tr>
                </thead>
                <tbody>
                  ${historyRowsHTML}
                </tbody>
              </table>
            </div>
          </div>
          
          <!-- Control Actions -->
          <div class="flex flex-col sm:flex-row gap-4">
            <button onclick="startLevel('${gameState.level}')" class="neo-btn flex-1 bg-neutral-900 text-white hover:bg-neutral-800">
              🔄 Recommencer
            </button>
            <button onclick="showMenu()" class="neo-btn flex-1 bg-white text-neutral-900 border-3 border-neutral-900 hover:bg-neutral-50">
              🏠 Choisir un autre niveau
            </button>
          </div>
        </div>
      `;
    }

    // --- CONFETTI ENGINE (Pure Javascript Canvas) ---
    let confettiTimer = null;
    let confettiActive = false;
    
    function triggerConfettiFull() {
      startConfetti(150, 6);
    }
    
    function triggerConfettiMini() {
      startConfetti(40, 2);
    }
    
    function startConfetti(particlesCount, durationSeconds) {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      
      // Set canvas size
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
      
      const colors = ["#5B4FCF", "#1A9E75", "#D94F3D", "#C97B1A", "#1A6FA0", "#E0F2FE", "#FEF08A", "#F5D0FE"];
      const particles = [];
      
      for (let i = 0; i < particlesCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * -canvas.height - 20,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedX: Math.random() * 4 - 2,
          speedY: Math.random() * 5 + 3,
          rotation: Math.random() * 360,
          rotationSpeed: Math.random() * 4 - 2
        });
      }
      
      confettiActive = true;
      if (confettiTimer) clearInterval(confettiTimer);
      
      let startTime = Date.now();
      
      function update() {
        if (!confettiActive) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let allOut = true;
        
        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.rotation += p.rotationSpeed;
          
          if (p.y < canvas.height) {
            allOut = false;
          }
          
          // Draw particle
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
          
          // Recycle particles to top if duration is not elapsed
          if (p.y > canvas.height && Date.now() - startTime < durationSeconds * 1000) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
            p.speedY = Math.random() * 5 + 3;
            p.speedX = Math.random() * 4 - 2;
          }
        });
        
        if (allOut && Date.now() - startTime >= durationSeconds * 1000) {
          confettiActive = false;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        } else {
          requestAnimationFrame(update);
        }
      }
      
      requestAnimationFrame(update);
    }
  </script>
